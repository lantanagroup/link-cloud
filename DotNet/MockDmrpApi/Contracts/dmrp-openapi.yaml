openapi: 3.0.3

info:
  title: DMRP API
  version: 0.2.0-provisional
  description: |
    ##########################################################################
    # PROVISIONAL. THIS IS NOT THE PUBLISHED CONTRACT.
    #
    # DMRP (Digital Monthly Reporting Plan) is being developed by Leidos for
    # CDC. The real endpoint is reachable only from the CDC Dev environment
    # and no OpenAPI description has been published to LCG.
    #
    # This document is a best-effort reconstruction from what LCG knows, so
    # that:
    #   * the implementing service has a machine-readable source of truth, and
    #   * replacing this file with the published contract turns every
    #     difference into a C# compile error rather than a silent divergence.
    #
    # WHEN THE PUBLISHED CONTRACT ARRIVES: replace this file WHOLESALE,
    # rebuild, and fix the resulting compile errors. Do not hand-merge. Do not
    # add endpoints of our own to this file -- the service that implements this
    # contract also hosts a separate support surface, which is deliberately
    # absent here so that this document can be replaced without losing it.
    #
    # Treat no field name, path or status code here as authoritative.
    ##########################################################################

    ## Two reporting plans, two components

    A reporting plan lists the NHSN measures a facility is enrolled to report.
    There are two, and they differ in both subject and cadence:

    | Operation      | Component | Subject          | Cadence |
    |----------------|-----------|------------------|---------|
    | `/msc`         | MSC       | Medicine reports | Monthly |
    | `/ps/annual`   | PS        | Patient safety   | Annual  |

    `reportingMonth` is therefore present on a monthly plan and absent from an
    annual one.

    ## Enrollment is expressed by presence, not by value

    Both operations return only the measures a facility IS enrolled in. A
    measure that does not appear in the `measures` array means the facility is
    NOT enrolled in it for that period. There is no negative representation,
    and `isReporting` is currently always `Y` wherever an entry exists.

    Consequently a facility enrolled in nothing returns `200` with an empty
    `measures` array - not `204`, and not `404`. An empty plan is a
    meaningful answer, not an absent resource.

servers:
  - url: http://localhost:6159
    description: Local instance

tags:
  - name: Reporting Plans
    description: Retrieval of a facility's reporting plan.

paths:

  /msc:
    get:
      tags: [Reporting Plans]
      operationId: GetMonthlyMedicineReportingPlan
      summary: Get a facility's monthly medicine reporting plan.
      description: |
        Returns the medicine-report measures the facility is enrolled to report
        for the given month and year.
      security:
        - dmrpBearer: []
      parameters:
        - name: facilityId
          in: query
          required: true
          description: The facility identifier, as known to the reporting system.
          schema: { type: string, minLength: 1, maxLength: 120 }
          example: FAC001
        - name: reportingMonth
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 1, maximum: 12 }
          example: 5
        - name: reportingYear
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 2000, maximum: 2100 }
          example: 2026
      responses:
        '200':
          description: The monthly reporting plan. `measures` may be empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingPlanResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'

  /ps/annual:
    get:
      tags: [Reporting Plans]
      operationId: GetPatientSafetyAnnualReportingPlan
      summary: Get a facility's annual patient-safety reporting plan.
      description: |
        Returns the patient-safety measures the facility is enrolled to report
        for the given year.

        This plan is annual, so it takes no month and the response omits
        `reportingMonth`.
      security:
        - dmrpBearer: []
      parameters:
        - name: facilityId
          in: query
          required: true
          description: The facility identifier, as known to the reporting system.
          schema: { type: string, minLength: 1, maxLength: 120 }
          example: FAC001
        - name: reportingYear
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 2000, maximum: 2100 }
          example: 2026
      responses:
        '200':
          description: The annual reporting plan. `measures` may be empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingPlanResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'

components:

  securitySchemes:
    dmrpBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A bearer token issued by the reporting system's authorization server.

  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    Unauthorized:
      description: Missing, malformed or expired bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

    Unavailable:
      description: The API is not available in this environment.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:

    ReportingPlanResponse:
      type: object
      required: [facilityId, reportingYear, measures]
      properties:
        facilityId:
          type: string
        reportingMonth:
          type: integer
          format: int32
          nullable: true
          description: |
            The reporting month, on a monthly plan. Absent from an annual plan.
        reportingYear:
          type: integer
          format: int32
        measures:
          type: array
          description: |
            Only measures the facility IS enrolled in appear here. Absence of a
            measure means the facility is NOT enrolled in it for this period.
            There is no negative representation. An empty array is a valid,
            meaningful response.
          items: { $ref: '#/components/schemas/ReportingPlanMeasure' }
        retrievedOn:
          type: string
          format: date-time
          description: When the response was produced.

    ReportingPlanMeasure:
      type: object
      required: [measure, isReporting]
      properties:
        measure:
          type: string
          description: NHSN measure short name.
          example: HOB
        isReporting:
          type: string
          description: Currently always `Y`.
          example: 'Y'

    ProblemDetails:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, format: int32, nullable: true }
        detail: { type: string, nullable: true }
        instance: { type: string, nullable: true }
        traceId: { type: string, nullable: true }
      additionalProperties: true
