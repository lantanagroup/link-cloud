    failureMessage: 'Error 2: Invalid Encounter.classHistory.period format. Correct Encounter.classHistory.period to meet FHIR date/time requirements.
      Use a valid dateTime formatted as YYYY-MM-DDThh:mm:ss±zz:zz.'
    code: encounter-classhistory-period-valid
- id: encounter-class-or-type-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 26
  enabled: true
  parameters:
    expression: Encounter.class.exists() or Encounter.type.exists()
    failureMessage: 'Error: Missing encounter.class. Must include either an encounter.class or encounter.type code. Please assign an encounter
      class code from either. valueset "NHSN Inpatient Encounter Class Codes" http://cts.nlm.nih.gov/fhir/ValueSet/2.16.840.1.113762.1.4.1046.274''
      or ''observation encounter'' ''emergency'' from valueset "v3.ActEncounterCode" https://hl7.org/fhir/R4/v3/ActEncounterCode/vs.html''. or.
      Please assign the encounter.class code from one of these value sets:. "Emergency Department Visit":. ''http://cts.nlm.nih.gov/fhir/ValueSet/2.16.840.1.113883.3.117.1.7.1.292''.
      "Observation Services": ''http://cts.nlm.nih.gov/fhir/ValueSet/2.16.840.1.113762.1.4.1111.143''. "Encounter Inpatient": ''http://cts.nlm.nih.gov/fhir/ValueSet/2.16.840.1.113883.3.666.5.307''.'
    code: encounter-class-or-type-required
- id: encounter-class-terminology
