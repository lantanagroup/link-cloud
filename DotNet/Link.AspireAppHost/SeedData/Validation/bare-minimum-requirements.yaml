# Derived from PQ_ACHMonthly-FHIR DD-v3.2.0_final.xlsx.
# Selection reconciliation: 92 visible Unacceptable rows; one Encounter.partOf row is marked NR and excluded;
# 91 valid Unacceptable rows less 10 resource-presence, 10 resource.id, and 14 technical reference-URL rows = 57 source requirement rows.
# 40 source rows contain two separately labelled Error/Warning findings; splitting them adds 40 checks, for 97 atomic checks.
# VALUESET parameters intentionally contain only path and versioned valueSet for VaaS registrar compatibility.
# Every FHIRPATH failureMessage is copied from its atomic Proposed Action for User finding; line breaks are normalized to '. '.
# Resource.exists() root checks and technical-only id/reference checks are not included.
# 2026-11-04 (link-engine-prototype run 14): birth sex and sex value set paths select their extension by url
# (Patient.extension.valueCode matched nothing); the lab and vital-sign Observation checks apply only to
# Observations of that category, except the two category-required checks, which apply to every Observation.
id: bare-minimum-requirements
semver: 1.1.0
title: ACH Monthly Bare-Minimum Requirements
owner: lcg
dimensions:
- CONFORMANCE
- TERMINOLOGY
scoringPolicy:
  type: piqi-dimension-scorecard
  rollup: worst-of
checks:
- id: diagnosticreport-category-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 1
  enabled: true
  parameters:
    expression: DiagnosticReport.category.exists()
    failureMessage: 'Error 1: Missing DiagnosticReport.category code. The DiagnosticReport resource does not contain a category code. Populate
      DiagnosticReport.category with a valid code from the HL7 v2-0074 Diagnostic Service Section value set (http://terminology.hl7.org/CodeSystem/v2-0074)
      to identify the type of diagnostic report.'
    code: diagnosticreport-category-required
- id: diagnosticreport-category-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: ERROR
  ordinal: 2
  enabled: true
  parameters:
    path: DiagnosticReport.category
    valueSet: http://hl7.org/fhir/ValueSet/diagnostic-service-sections|4.0.1
- id: diagnosticreport-code-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 3
  enabled: true
  parameters:
    expression: DiagnosticReport.code.exists()
    failureMessage: 'Error: Missing DiagnosticReport.code. Provide a US Core Laboratory Test Codes value set (http://hl7.org/fhir/us/core/ValueSet/us-core-laboratory-test-codes).
      If an applicable code exists, the code must be used and sent.'
    code: diagnosticreport-code-required
- id: diagnosticreport-code-lab-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: WARNING
  ordinal: 4
  enabled: true
  parameters:
    path: DiagnosticReport.code
    valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-laboratory-test-codes|6.1.0
- id: diagnosticreport-effective-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: WARNING
  ordinal: 5
  enabled: true
  parameters:
    expression: (DiagnosticReport.status = 'partial' or DiagnosticReport.status = 'preliminary' or DiagnosticReport.status = 'final' or DiagnosticReport.status
      = 'amended' or DiagnosticReport.status = 'corrected' or DiagnosticReport.status = 'appended') implies DiagnosticReport.effective.exists()
    failureMessage: 'Warning 1: Missing. DiagnosticReport.effective. Populate DiagnosticReport.effective with the clinically relevant date/time
      or period during which the diagnostic data was collected. If using DiagnosticReport.effectivePeriod, ensure that the start date/time occurs
      before the end date/time and that both values are valid FHIR date/time formats.'
    code: diagnosticreport-effective-required
- id: diagnosticreport-effective-valid
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: WARNING
  ordinal: 6
  enabled: true
  parameters:
    expression: DiagnosticReport.effective.all(($this is dateTime) implies ($this.toString().length() >= 10)) and DiagnosticReport.effective.ofType(Period).all(start.exists()
      and start.toString().length() >= 10 and (end.empty() or (end.toString().length() >= 10 and end > start)))
    failureMessage: 'Warning 2: Invalid DiagnosticReport.effective date/time or period format. Use a valid dateTime formatted as YYYY-MM-DDThh:mm:ss±zz:zz.'
    code: diagnosticreport-effective-valid
- id: diagnosticreport-result-reference-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: WARNING
  ordinal: 7
  enabled: true
  parameters:
    expression: DiagnosticReport.result.exists() and DiagnosticReport.result.all(reference.exists() and resolve().is(Observation))
    failureMessage: 'Warning: Missing DiagnosticReport.result reference. The DiagnosticReport.result does not contain references. Populate DiagnosticReport.result
      with one or more references to Observation resources that contain the findings, measurements, or test results associated with this diagnostic
      report.'
    code: diagnosticreport-result-reference-required
- id: observation-lab-status-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 8
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(status.exists())'
    failureMessage: 'Error message 1: Missing an observation.status code. Populate Observation.status with a valid status code that indicates
      the current state of the observation. For labs, reference Non-Negative Observation Status: http://hl7.org/fhir/us/qicore/ValueSet/qicore-non-negative-observation-status.'
    code: observation-lab-status-required
- id: observation-lab-status-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: ERROR
  ordinal: 9
  enabled: true
  parameters:
    path: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).status'
    valueSet: http://hl7.org/fhir/us/qicore/ValueSet/qicore-non-negative-observation-status|6.0.0
- id: observation-lab-category-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 10
  enabled: true
  parameters:
    expression: Observation.category.exists()
    failureMessage: 'Error message 1: Missing observation.category.code. . Populate Observation.category with an appropriate category code such
      as "laboratory" for a lab from http://terminology.hl7.org/CodeSystem/observation-category.'
    code: observation-lab-category-required
- id: observation-lab-category-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: ERROR
  ordinal: 11
  enabled: true
  parameters:
    path: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).category'
    valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-clinical-result-observation-category|6.1.0
- id: observation-lab-code-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 12
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(code.exists())'
    failureMessage: 'Error1: Missing Observation.code. Add a valid LOINC code to Observation.code. Use a laboratory LOINC code (CLASSTYPE=1) for
      lab observations and a code from http://hl7.org/fhir/us/core/ValueSet/us-core-laboratory-test-codes.'
    code: observation-lab-code-required
- id: observation-lab-code-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: ERROR
  ordinal: 13
  enabled: true
  parameters:
    path: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).code'
    valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-laboratory-test-codes|6.1.0
- id: observation-lab-effective-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 14
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(effective.exists())'
    failureMessage: 'Error 1: Missing observation.effective date/time. Populate Observation.effective with the date/time or period when the observation
      was performed or collected. Ensure the date/time falls within or overlaps the required measurement period when applicable. Use the format
      YYYY-MM-DDThh:mm:ss+zz:zz.'
    code: observation-lab-effective-required
- id: observation-lab-effective-valid
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 15
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(effective.all(($this is dateTime) implies ($this.toString().length() >= 10)) and effective.ofType(Period).all(start.exists() and start.toString().length() >= 10 and (end.empty() or (end.toString().length() >= 10 and end > start))))'
    failureMessage: 'Error 2: Invalid Observation.effective date/time format. Provide a valid date/time in the format YYYY-MM-DDThh:mm:ss+zz:zz.'
    code: observation-lab-effective-valid
- id: observation-lab-value-or-absent-reason
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: WARNING
  ordinal: 16
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(component.exists() or hasMember.exists() or value.exists() or dataAbsentReason.exists())'
    failureMessage: 'Warning: Missing observation.value or laboratory result. This Observation must include a result. Add a result in Observation.value.
      If the result is represented by Observation.component or Observation.hasMember, no top-level value is required. If a result is unavailable,
      provide Observation.dataAbsentReason explaining why the result is missing. For coded results, use the required SNOMED CT code.'
    code: observation-lab-value-or-absent-reason
- id: observation-lab-interpretation-present
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: WARNING
  ordinal: 17
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(interpretation.exists())'
    failureMessage: 'Warning 1: The Observation resource does not contain an interpretation. Consider populating Observation.interpretation with
      a clinically relevant interpretation, such as high, low, normal, or abnormal, to help users understand the significance of the observation
      result from value set http://hl7.org/fhir/ValueSet/observation-interpretation. If an applicable code exists, the code must be used and sent.'
    code: observation-lab-interpretation-present
- id: observation-lab-interpretation-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: WARNING
  ordinal: 18
  enabled: true
  parameters:
    path: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).interpretation'
    valueSet: http://hl7.org/fhir/ValueSet/observation-interpretation|4.0.1
- id: observation-lab-component-code-required
  type: FHIRPATH
  dimension: CONFORMANCE
  severityOverride: ERROR
  ordinal: 19
  enabled: true
  parameters:
    expression: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).all(component.all(code.exists()))'
    failureMessage: 'Error 1: Missing Observation.component.code Provide a valid LOINC code and include it in Observation.code from US Core Laboratory
      Test Codes: http://hl7.org/fhir/us/core/ValueSet/us-core-laboratory-test-codes) value set if exist. Local codes or codes from third party
      pharmacy vendors must be mapped to standardized codes.'
    code: observation-lab-component-code-required
- id: observation-lab-component-code-terminology
  type: VALUESET
  dimension: TERMINOLOGY
  severityOverride: ERROR
  ordinal: 20
  enabled: true
  parameters:
    path: 'Observation.where(category.coding.where(system = ''http://terminology.hl7.org/CodeSystem/observation-category'' and code = ''laboratory'').exists()).component.code'
    valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-laboratory-test-codes|6.1.0
