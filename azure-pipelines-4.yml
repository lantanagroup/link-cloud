resources:
  pipelines:
  - pipeline: pipeline-trigger
    source: Deploy_All_Services
    trigger: true

trigger:
  branches:
    include:
    - dev
    - release/*
    - linkathon/*
  paths:
    include:
    - DotNet/Account/*
    - DotNet/Shared/*
    exclude:
    - '*'
    
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: link-cloud-variables
- name: project
  value: 'DotNet/Account/Account.csproj'
- name: testProject
  value: 'DotNet/AccountUnitTests/AccountUnitTests.csproj'
- name: serviceName
  value: 'Account'
- name: registry-repo-Name
  value: 'link-account'
- name: dockerPath
  value: '**/DotNet/Account/Dockerfile'
- name: containerRegistry
  value: 'NHSNLink ACR Premium'
  
steps:

  - task: Bash@3
    inputs:
      targetType: 'inline'
      script: |
        GIT_COMMIT=$(git rev-parse --short HEAD)
        echo "GIT_COMMIT: ${GIT_COMMIT}"
        echo "##vso[task.setvariable variable=GIT_COMMIT]${GIT_COMMIT}"

