        cd "/home/vsts/work/1/s"
        ls
        # Path to your JSON file
        $jsonPath = "$(Build.SourcesDirectory)/DotNet/Account/appsettings.json"

        # Load the JSON file
        echo "Load the JSON file"
        $json = Get-Content $jsonPath -Raw | ConvertFrom-Json


        $newCommit = "123"
        
        
        ``$json.ServiceInformation.GitCommit = $newCommit
        $json | ConvertTo-Json -Depth 10 | Set-Content $jsonPath

        
        echo "Getting Contents"
        Get-Content -Path "$(Build.SourcesDirectory)/DotNet/Account/appsettings.json

