<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar body -->
  <rect x="3" y="5" width="18" height="16" rx="2" ry="2" fill="#3B82F6" stroke="#2563EB"/>

  <!-- Calendar top tabs -->
  <rect x="6" y="2" width="3" height="3" rx="0.5" ry="0.5" fill="#2563EB"/>
  <rect x="15" y="2" width="3" height="3" rx="0.5" ry="0.5" fill="#2563EB"/>

  <!-- Clock face -->
  <circle cx="12" cy="13" r="4" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>

  <!-- Clock hands -->
  <line x1="12" y1="13" x2="12" y2="10" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="13" x2="14.5" y2="13" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
</svg>
