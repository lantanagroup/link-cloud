<div class="sub-pre-qual-report-issues">
  <div>
    <h4>Unacceptable Issues (12)</h4>
    <div class="vd-mat-table limited-height">
      <table mat-table #outerSort="matSort" [dataSource]="dataSource" multiTemplateDataRows matSort>
        <!-- Level 1 (Category) Columns -->
        <ng-container matColumnDef="{{column}}" *ngFor="let column of categoryColumns">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> {{column}} </th>
          <td mat-cell *matCellDef="let category"> {{category[column]}} </td>
        </ng-container>

        <!-- Expansion Column -->
        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let category" [attr.colspan]="categoryColumns.length">
            <div class="expanded-container" *ngIf="category.issues?.data.length"
              [@detailExpand]="category == expandedCategory ? 'expanded' : 'collapsed'">
              <div *ngIf="expandedCategory">
                <table #innerTables mat-table #innerSort="matSort" [dataSource]="category.issues" matSort
                  class="inner-table">
                  <!-- Level 2 (Issue) Columns -->
                  <ng-container matColumnDef="{{innerColumn}}" *ngFor="let innerColumn of issueColumns">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> {{innerColumn}} </th>
                    <td mat-cell *matCellDef="let issue" class="inner-table-cell--{{innerColumn}}">
                      {{issue[innerColumn]}}
                    </td>
                  </ng-container>
                  <!-- Inner Header Row -->
                  <tr mat-header-row *matHeaderRowDef="issueColumns"></tr>
                  <!-- Inner Data Row -->
                  <tr mat-row *matRowDef="let row; columns: issueColumns;"></tr>
                </table>
              </div>
              <!-- <mat-sort #nestedSort></mat-sort> -->
            </div>
          </td>
        </ng-container>

        <!-- Main Header Row -->
        <tr mat-header-row *matHeaderRowDef="categoryColumns; sticky: true"></tr>
        <!-- Main Data Row -->
        <tr mat-row *matRowDef="let row; columns: categoryColumns;" class="main-row"
          [class.expandable-main-row]="row.issues?.data.length" [class.expanded-main-row]="expandedCategory === row"
          (click)="toggleRow(row)">
        </tr>
        <!-- Expanded Row -->
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="inner-row"></tr>
      </table>
    </div>
  </div>
  <div>
    <h4>Acceptable Issues (8)</h4>
    <div class="sub-pre-qual-report-issues--table-placeholder">Table Here</div>
  </div>
  <div>
    <h4>Uncategorized Issues (5)</h4>
    <div class="sub-pre-qual-report-issues--table-placeholder">Table Here</div>
  </div>
</div>
