<div class="content">

  <!-- Toolbar -->
  <p>
    <mat-toolbar class="page-header-bar" color="primary">
      <span>Measure Mappings</span>
      <button mat-mini-fab
              aria-label="Add measure mapping"
              matTooltip="Add Measure Mapping"
              (click)="onAdd()">
        <mat-icon>add</mat-icon>
      </button>
    </mat-toolbar>
  </p>

  <!-- Card -->
  <div class="link-card" style="margin-top: 2em;">
    <div class="link-card-header">
      <p class="title">All Measure Mappings</p>

      <div class="filter-bar">
        <mat-form-field appearance="outline" class="compact-filter">
          <mat-label>Measure</mat-label>
          <input matInput [(ngModel)]="filterMeasure" (keyup.enter)="onSearchChange()" placeholder="Search measure...">
          <button *ngIf="filterMeasure" matSuffix mat-icon-button aria-label="Clear measure filter"
                  (click)="filterMeasure=''; onSearchChange()">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="compact-filter">
          <mat-label>dQM</mat-label>
          <input matInput [(ngModel)]="filterDqm" (keyup.enter)="onSearchChange()" placeholder="Search dQM...">
          <button *ngIf="filterDqm" matSuffix mat-icon-button aria-label="Clear dqm filter"
                  (click)="filterDqm=''; onSearchChange()">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="compact-filter">
          <mat-label>Frequency</mat-label>
          <mat-select [(ngModel)]="filterFrequency" (selectionChange)="onSearchChange()">
            <mat-option [value]="null">All</mat-option>
            <mat-option *ngFor="let freq of frequencyOptions" [value]="freq">{{ freq }}</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="filter-actions">
          <button mat-stroked-button (click)="clearFilters()" *ngIf="hasActiveFilters()">
            <mat-icon>filter_list_off</mat-icon> Clear All Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container no-border">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" style="width:100%; background-color: transparent">

        <!-- Measure -->
        <ng-container matColumnDef="measure">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Measure</th>
          <td mat-cell *matCellDef="let row">{{ row.measure }}</td>
        </ng-container>

        <!-- dQM -->
        <ng-container matColumnDef="dqm">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>dQM</th>
          <td mat-cell *matCellDef="let row">{{ row.dqm }}</td>
        </ng-container>

        <!-- Frequency -->
        <ng-container matColumnDef="frequency">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Frequency</th>
          <td mat-cell *matCellDef="let row">{{ row.frequency }}</td>
        </ng-container>

        <!-- Action buttons -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
          <td mat-cell *matCellDef="let row" class="actions-column">
            <button mat-icon-button color="primary" (click)="onEdit(row)"
                    aria-label="Edit Measure Mapping" matTooltip="Edit Measure Mapping">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="onDelete(row)"
                    aria-label="Delete Measure Mapping" matTooltip="Delete Measure Mapping">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Header / rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- No data row -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="no-data-message">
              <mat-icon>search_off</mat-icon>
              No measure mappings found.
            </div>
          </td>
        </tr>

      </table>

      <!-- Paginator -->
      <mat-paginator [length]="paginationMetadata.totalCount"
                     [pageSize]="paginationMetadata.pageSize"
                     [pageIndex]="paginationMetadata.pageNumber"
                     [pageSizeOptions]="[5, 10, 25, 50]"
                     (page)="pagedEvent($event)"
                     aria-label="Select page">
      </mat-paginator>

    </div>
  </div>
</div>
