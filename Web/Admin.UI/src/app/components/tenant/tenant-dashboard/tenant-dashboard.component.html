<div class="content">

  <!-- Toolbar -->
  <p>
    <mat-toolbar class="page-header-bar" color="primary">
      <span>Tenant Dashboard</span>
      <button mat-mini-fab
              aria-label="Create tenant"
              title="Create tenant"
              matTooltip="Create Facility"
              (click)="showCreateFacilityDialog()">
        <mat-icon>add</mat-icon>
      </button>
    </mat-toolbar>
  </p>

  <!-- Card -->
  <div class="link-card" style="margin-top: 2em;">
    <div class="link-card-header">
      <div class="split-container" style="margin-bottom: 0;">
        <div class="left-pane">
          <p class="title">All Tenants</p>
        </div>

        <div class="right-pane">
          <mat-checkbox [(ngModel)]="showDeleted" (change)="onShowDeletedChange()">
            Show deleted
          </mat-checkbox>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container no-border">
      <table mat-table [dataSource]="dataSource" style="width:100%; background-color: transparent">

        <!-- Facility ID -->
        <ng-container matColumnDef="facilityId">
          <th mat-header-cell *matHeaderCellDef>Facility ID</th>
          <td mat-cell *matCellDef="let row">
            <a *ngIf="!row.isDeleted; else disabledText"
               [routerLink]="['/tenant/facility', row.facilityId]">
              {{ row.facilityId }}
            </a>
            <ng-template #disabledText>
              <span class="disabled-text">
                {{ row.facilityId }}
              </span>
            </ng-template>
          </td>
        </ng-container>

        <!-- Facility Name -->
        <ng-container matColumnDef="facilityName">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">{{ row.facilityName }}</td>
        </ng-container>

        <!-- Timezone -->
        <ng-container matColumnDef="timeZone">
          <th mat-header-cell *matHeaderCellDef>Timezone</th>
          <td mat-cell *matCellDef="let row">{{ row.timeZone }}</td>
        </ng-container>

        <!-- Action buttons -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" [routerLink]="['/tenant/facility', row.facilityId, 'edit']"
                    matTooltip="Edit Facility" [disabled]="row.isDeleted">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="onSoftDeleteFacility(row.facilityId)"
                    matTooltip="Delete Facility" [disabled]="row.isDeleted">
              <mat-icon>delete</mat-icon>
            </button>

            <button mat-icon-button color="primary" [routerLink]="['/tenant/facility', row.facilityId]"
                    matTooltip="View Facility" [disabled]="row.isDeleted">
              <mat-icon>visibility</mat-icon>
            </button>

            <button mat-icon-button color="accent" (click)="onRestoreFacility(row.facilityId)"
                    matTooltip="Restore Facility" *ngIf="row.isDeleted">
              <mat-icon>restore</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Deleted column -->
        <ng-container matColumnDef="isDeleted">
          <th mat-header-cell *matHeaderCellDef>Deleted</th>
          <td mat-cell *matCellDef="let row">{{ row.isDeleted ? 'Yes' : 'No' }}</td>
        </ng-container>

        <!-- Header / rows -->
        <tr mat-header-row *matHeaderRowDef="getColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: getColumns();" [class.deleted-row]="row.isDeleted"></tr>

        <!-- No data row -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="getColumns().length">
            <div class="no-data-message">
              <mat-icon>search_off</mat-icon>
              No tenants found.
            </div>
          </td>
        </tr>

      </table>

      <!-- Paginator -->
      <mat-paginator [length]="paginationMetadata.totalCount"
                     [pageSize]="paginationMetadata.pageSize"
                     [pageIndex]="paginationMetadata.pageNumber"
                     [pageSizeOptions]="[5, 10, 25, 50]"
                     (page)="pagedEvent($event)"
                     aria-label="Select page">
      </mat-paginator>

    </div>
  </div>
</div>
