<div class="content">
  <p>Placeholder page for a custom Kafka UI for environments where the default Kafka UI is not available.</p>
  @if (kafkaUrl) {
    <p>
      <a href="{{kafkaUrl}}" target="_blank">Kafka UI</a>
    </p>
  }
  @if (!kafkaUrl) {
    <p>
      <span>Default Kafka UI is not available.</span>
    </p>
  }
</div>
