<div mat-dialog-title class="dialog-header">
  <h1>{{ dialogTitle }}</h1>
  <vd-button variant="dialog-close" mat-dialog-close class="dialog-close-button" aria-label="Close Add/Edit Rule Modal">
    [Close x]
  </vd-button>
</div>
<div mat-dialog-content class="vd-dialog__content">
  <form class="vd-form">
    <div class="form-field-row form-field-row--inverted">
      <label for="inverted">Inverted</label>
      <select [(ngModel)]="rule.matcher.inverted" name="inverted" id="inverted" aria-label="Inverted">
        <option [ngValue]="true">Yes</option>
        <option [ngValue]="false">No</option>
      </select>
    </div>
    <div class="form-field-row form-field-row--field">
          <label for="field">Field</label>
          <select [(ngModel)]="rule.matcher.field" name="field" id="field" aria-label="Field">
            <option value="MESSAGE">MESSAGE</option>
            <option value="EXPRESSION">EXPRESSION</option>
            <option value="CODE">CODE</option>
            <option value="SEVERITY">SEVERITY</option>
          </select>
        </div>
    <div class="form-field-row form-field-row--regex">
      <label for="regex">Regex</label>
      <input [(ngModel)]="rule.matcher.regex" id="regex" name="regex" aria-label="Regex"/>
    </div>
  </form>
</div>
<div class="vd-dialog__actions">
  <div class="action-button-group">
    <vd-button mat-dialog-close condensed="true" variant="outline-neutral" aria-label="Cancel">Cancel</vd-button>
    <vd-button (click)="onSave()" condensed="true" aria-label="Save">Save</vd-button>
  </div>
</div>
