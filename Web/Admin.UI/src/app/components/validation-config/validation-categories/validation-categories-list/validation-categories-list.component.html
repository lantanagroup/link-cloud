<div class="container">
  <h2>Validation Categories</h2>

  <table mat-table [dataSource]="categories" class="mat-elevation-z8">
    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let category">{{category.title}}</td>
    </ng-container>

    <!-- Severity Column -->
    <ng-container matColumnDef="severity">
      <th mat-header-cell *matHeaderCellDef>Severity</th>
      <td mat-cell *matCellDef="let category">{{category.severity}}</td>
    </ng-container>

    <!-- Acceptable Column -->
    <ng-container matColumnDef="acceptable">
      <th mat-header-cell *matHeaderCellDef>Acceptable</th>
      <td mat-cell *matCellDef="let category">{{category.acceptable ? 'Yes' : 'No'}}</td>
    </ng-container>

    <!-- Guidance Column -->
    <ng-container matColumnDef="guidance">
      <th mat-header-cell *matHeaderCellDef>Guidance</th>
      <td mat-cell *matCellDef="let category">{{category.guidance}}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let category">
        <button mat-icon-button [routerLink]="['/validation-config/validation-categories', category.id, 'edit']" matTooltip="Edit Category">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
