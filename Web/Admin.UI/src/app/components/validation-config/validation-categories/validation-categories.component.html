<div class="validation-categories">
  <app-link-admin-subnav-bar></app-link-admin-subnav-bar>
  <div class="validation-categories--banner">
    <div class="validation-categories-banner--kicker">Configuration</div>
    <h2 class="validation-categories-banner--heading">Validation Categories</h2>
  </div>
  <div class="validation-categories--table">
    <h4>Validation Categories</h4>
    <div class="sub-pre-qual-report-categories-table">
      <div class="vd-mat-table limited-height--lg">
        <table mat-table #sort="matSort" [dataSource]="dataSource" matSort>
          <!-- Issue Columns -->
          <ng-container matColumnDef="{{column}}" *ngFor="let column of validationCategoryColumns">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> {{column}} </th>
            <td mat-cell *matCellDef="let issue"> {{issue[column]}} </td>
          </ng-container>

          <!-- Main Header Row -->
          <tr mat-header-row *matHeaderRowDef="validationCategoryColumns; sticky: true"></tr>
          <!-- Main Data Row -->
          <tr mat-row *matRowDef="let row; columns: validationCategoryColumns;" class="main-row">
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
