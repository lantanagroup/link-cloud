############################################################################################
# SQL Script Apply TEST
############################################################################################
- stage: Apply_TEST_Update_SQL_DBs
  displayName: Apply TEST SQL Updates
  trigger: manual
  condition: always()

  pool:
    vmImage: windows-latest

  jobs:
  - ${{ each db in parameters.databases }}:

    - ${{ if ne(db.name, 'validation') }}: # Excludes Validation database

      - job: Update_${{ db.name }}_TEST
        displayName: Update ${{ db.name }}

        steps:
        - download: current
          artifact: ${{ db.artifact }}

        - task: SqlAzureDacpacDeployment@1
          displayName: Apply ${{ db.name }} DB Schema
          inputs:
            azureSubscription: "NHSNLink Resource Manager"
            ServerName: '$(link-db_server)'
            DatabaseName: 'link-test-botw-${{ db.name }}'
            SqlUsername: '$(link-db_username)'
            SqlPassword: '$(link-db_pass)'
            deployType: 'SqlTask'
            SqlFile: '$(Pipeline.Workspace)/${{ db.artifact }}/${{ db.file }}'

      - job: Update_validation_TEST
        displayName: Update validation

        steps:
        - download: current
          artifact: validation-db

        - task: PowerShell@2
          displayName: Combine Validation SQL Scripts
          inputs:
            targetType: inline
            script: |

              $path = "$(Pipeline.Workspace)/validation-db"
              $outputFile = "$(Pipeline.Workspace)/validation-db/validationDb.sql"

              # Find all Validation migration scripts
              $files = Get-ChildItem `
                -Path $path `
                -Filter "V*.sql" `
                -File |
                Sort-Object Name

              Write-Host ""
              Write-Host "Validation SQL files found:"
              Write-Host ""

              foreach ($file in $files) 
              {
                  Write-Host "  $($file.Name)"
              }

              Write-Host ""
              Write-Host "Creating combined SQL file: $outputFile"

              # Start with a clean file
              New-Item `
                -ItemType File `
                -Path $outputFile `
                -Force | Out-Null

              foreach ($file in $files) 
              {

                Write-Host "Adding $($file.Name)"
                Add-Content `
                  -Path $outputFile `
                  -Value ""
                
                Add-Content `
                  -Path $outputFile `
                  -Value "-- ====================================================="

                Add-Content `
                  -Path $outputFile `
                  -Value "-- Migration: $($file.Name)"

                Add-Content `
                  -Path $outputFile `
                  -Value "-- ====================================================="

                Get-Content $file.FullName |
                  Add-Content -Path $outputFile

                Add-Content `
                  -Path $outputFile `
                  -Value ""
              }

        - task: SqlAzureDacpacDeployment@1
          displayName: Apply validation DB Schema
          inputs:
            azureSubscription: "NHSNLink Resource Manager"
            ServerName: '$(link-db_server)'
            DatabaseName: 'link-test-botw-validation'
            SqlUsername: '$(link-db_username)'
            SqlPassword: '$(link-db_pass)'
            deployType: 'SqlTask'
            SqlFile: '$(Pipeline.Workspace)/validation-db/validationDb.sql'

