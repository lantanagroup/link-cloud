# Pipeline that will generate a .sql script to apply to databases on changed files

trigger: none
    
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: 'MSSQL_DBCreation'

parameters:
- name: previous_release
  displayName: "What is the Tag or Commit SHA of the Previous Release? (i.e. : v0.2.0-beta.1)"
  type: string

- name: current_release
  displayName: "What is the Tag or Commit SHA of the Current Release? (i.e. : v0.2.0-beta.2)"
  type: string

- name: databases
  type: object
  default:
    - name: account
      artifact: account-db
      file: accountDb.sql
    - name: audit
      artifact: audit-db
      file: auditDb.sql
    - name: census
      artifact: census-db
      file: censusDb.sql
    - name: data
      artifact: data-db
      file: dataDb.sql
    # No mock-dmrp entry. The Build stage publishes mock-dmrp-db, but no environment has a
    # Mock DMRP database yet -- the service has no rows in any App Configuration store, so
    # the apply stages have nothing to target. Add an entry here once one is provisioned,
    # and note that ${{ db.name }} becomes a job identifier: it must be a single word with
    # no hyphen, so 'mockdmrp' rather than 'mock-dmrp'.
    - name: normalization
      artifact: normalization-db
      file: normalizationDb.sql
    - name: querydispatch
      artifact: querydispatch-db
      file: querydispatchDb.sql
    - name: report
      artifact: report-db
      file: reportDb.sql
    - name: submission
      artifact: submission-db
      file: submissionDb.sql
    - name: tenant
      artifact: tenant-db
      file: tenantDb.sql
    - name: validation
      artifact: validation-db
      file: V20241101__Initial_schema.sql

#####################

stages:
- stage: Build
  jobs:
  - job: getChangedFiles
    displayName: Get Changes
    steps: 
      - checkout: self
        fetchDepth: 0
        persistCredentials: true
      - task: PowerShell@2
        name: setVariables
        inputs:
          targetType: 'inline'
          script: |
            Write-Host ${env:BYPASSCHANGEEVALUATION}
            
            # Get any changed files
            $prev = '${{ parameters.previous_release }}'
            $curr = '${{ parameters.current_release }}'

            # Define path to changedServices.txt
            $changedFilesFile = "$(Build.SourcesDirectory)/changedfiles.txt"
            $changedServicesFile = "$(Build.SourcesDirectory)/changedServices.txt"

            # Ensure files exist even if empty
            New-Item -ItemType File -Path $changedFilesFile -Force | Out-Null
            New-Item -ItemType File -Path $changedServicesFile -Force | Out-Null

            Write-Host "Previous Release: $prev"
            Write-Host "Current Release: $curr"

            git fetch --tags

            If ($prev && $curr) {
              $changedFiles = git diff $prev $curr --name-only
            } else {
              $changedFiles = git diff --name-status HEAD HEAD^
            }
            
            Write-Host "Changed files:"
            Write-Host $changedFiles

            # Save output to changedfiles.txt
            $changedFiles | Out-File -FilePath $changedFilesFile -Encoding utf8

            # List of DotNet services to check
            $dotnetServices = @("Account", "Audit", "Census", "MockDmrpApi", "Normalization", "QueryDispatch", "Report", "Submission", "Tenant" )
            $javaServices = @("validation" )
            $dataAcquisition = @("DataAcquisition" )

            # DotNet Services
            foreach ($service in $dotnetServices) {
              $path = "Dotnet/$service/migrations"
              $match = $changedFiles | Where-Object { $_ -like "$path*" }

              if ($match) {
                $message = "$service migration files have changed."
                Write-Host $message
                Add-Content -Path $changedServicesFile -Value $message
              } else {
                Write-Host "No changes in $service files."
                }
              }

            # dataAcquisition Services
            foreach ($service in $dataAcquisition) {
              $path = "Dotnet/$service.Domain/Migrations"
              $match = $changedFiles | Where-Object { $_ -like "$path*" }

              if ($match) {
                $message = "$service migration files have changed."
                Write-Host $message
                Add-Content -Path $changedServicesFile -Value $message
              } else {
                Write-Host "No changes in $service files."
                }
              }

            # Java Services
            foreach ($service in $javaServices) {
              $path = "Java/$service/src/main/resources/database/migrations"
              $match = $changedFiles | Where-Object { $_ -like "$path*" }

              if ($match) {
                $message = "$service migration files have changed."
                Write-Host $message
                Add-Content -Path $changedServicesFile -Value $message
              } else {
                Write-Host "No changes in $service files."
                }
              }

            Write-Host "##vso[task.setvariable variable=task.A.status]Success"

      # Publish Changed Services

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Build.SourcesDirectory)/changedServices.txt'
          ArtifactName: 'changedServices'

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Build.SourcesDirectory)/changedfiles.txt'
          ArtifactName: 'changedFiles'

############################################################################################
# SQL Script Generation
############################################################################################
  # Account
  - job: Account
    displayName: "Generate Account Schema Script"
    steps:
      - script: |
          cd DotNet/Account
          dotnet new tool-manifest --force
          dotnet tool install dotnet-ef --version 8.0.22
          dotnet tool restore
          dotnet tool run dotnet-ef --version
        displayName: Install dotnet-ef (local pinned)
      - script: |
          cd DotNet/Account
          mkdir -p $(build.artifactstagingdirectory)/DatabaseScripts
          dotnet tool run dotnet-ef migrations script --idempotent --verbose -c AccountDbContext -s $(build.sourcesdirectory)/DotNet/Account/Account.csproj -p $(build.sourcesdirectory)/DotNet/Account/Account.csproj -o $(build.artifactstagingdirectory)/DatabaseScripts/accountDb.sql
        displayName: Generate Account SQL Script
      - task: PublishBuildArtifacts@1
        inputs:
         PathtoPublish: '$(Build.ArtifactStagingDirectory)/DatabaseScripts/accountDb.sql'
         ArtifactName: 'account-db'
         publishLocation: 'container'
        displayName: Publish Account SQL Script  
