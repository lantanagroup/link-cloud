############################################################################################
  # Account
  - job: Account
    displayName: "Generate Account Schema Script"
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true
      - script: |
          # The generated script is produced from the working tree, so the tree must be
          # moved to current_release or the parameter is a label with no effect on output.
          if [ -n "${{ parameters.current_release }}" ]; then
            git checkout --detach "${{ parameters.current_release }}"
          fi
          echo "Generating schema from commit:"
          git rev-parse HEAD
        displayName: Check out current_release
      - script: |
          cd DotNet/Account
          dotnet new tool-manifest --force
          dotnet tool install dotnet-ef --version 8.0.22
          dotnet tool restore
          dotnet tool run dotnet-ef --version
        displayName: Install dotnet-ef (local pinned)
      - script: |
          cd DotNet/Account
          mkdir -p $(build.artifactstagingdirectory)/DatabaseScripts
          dotnet tool run dotnet-ef migrations script --idempotent --verbose -c AccountDbContext -s $(build.sourcesdirectory)/DotNet/Account/Account.csproj -p $(build.sourcesdirectory)/DotNet/Account/Account.csproj -o $(build.artifactstagingdirectory)/DatabaseScripts/accountDb.sql
        displayName: Generate Account SQL Script
      - task: PublishBuildArtifacts@1
        inputs:
         PathtoPublish: '$(Build.ArtifactStagingDirectory)/DatabaseScripts/accountDb.sql'
         ArtifactName: 'account-db'
         publishLocation: 'container'
