resources:
  pipelines:
  - pipeline: pipeline-trigger
    source: Build_And_Push_All
    trigger: true

trigger:
  branches:
    include:
    - dev
    - release/*
    - linkathon/*
  paths:
    include:
    - DotNet/Automation.UI/*
    - DotNet/Shared/*
    exclude:
    - '*'
    
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: link-cloud-variables
- name: project
  value: 'DotNet/Automation.UI/Automation.UI.csproj'
- name: testProject
  value: 'DotNet/AutomationUnitTests/AutomationUnitTests.csproj'
- name: serviceName
  value: 'Automation'
- name: registry-repo-Name
  value: 'link-Automation'
- name: dockerPath
  value: '**/DotNet/Automation.UI/Dockerfile'
- name: projectDir
  value: 'DotNet/Automation.UI'
  
steps:

  - task: Bash@3
    inputs:
      targetType: 'inline'
      script: |
        GIT_COMMIT=$(git rev-parse --short HEAD)
        echo "GIT_COMMIT: ${GIT_COMMIT}"
        echo "##vso[task.setvariable variable=GIT_COMMIT]${GIT_COMMIT}"

  - task: PythonScript@0
    displayName: "Inject Service Info"
    inputs:
      scriptSource: 'filePath'
      scriptPath: '$(Build.SourcesDirectory)/Scripts/set_service_info.py'
      workingDirectory: '$(Build.SourcesDirectory)'
      arguments: './ "$(projectDir)" "$(GIT_COMMIT)" "$(Build.BuildNumber)"'

  - task: NuGetAuthenticate@1
    displayName: Authenticate Shared_BOTW_Feed

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: '$(project)'
      feedsToUse: config
      nugetConfigPath: nuget.config
  
  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: '$(project)'

  - task: DotNetCoreCLI@2
    inputs:
      command: 'test'
      projects: $(testProject)'
    displayName: 'Run Tests'
  
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        if ("$(Build.SourceBranch)" -like "*release/*") {
        $myTag1 = "release-$(Build.SourceBranchName)-$(GIT_COMMIT)"
        }
        else { 
        $myTag1 = "$(Build.SourceBranchName)-$(GIT_COMMIT)"
        }
        Write-Host "##vso[task.setvariable variable=MyTag]$myTag1"
        Write-Host "Set MyTag to: $myTag1"

  # Build and push are separate steps because buildAndPush ignores `arguments`, and the
  # image build needs the Shared_BOTW_Feed token for the LantanaGroup.Thetis.* packages.
  # NuGetAuthenticate above only covers restores on the agent, not inside the container.
  # The token goes in as a BuildKit secret (the Dockerfile's feed_accesstoken mount) rather
  # than a build arg so it does not end up in the image history.
  - task: Docker@2
    displayName: "Build Automation Docker Image"
    condition: always()
    inputs:
      containerRegistry: $(containerRegistry) # Variable Group
      repository: $(registry-repo-name)
      command: 'build'
      Dockerfile: $(dockerPath)
      tags: |
        latest
        $(MyTag)
      buildContext: '$(Build.Repository.LocalPath)'
      arguments: '--secret id=feed_accesstoken,env=FEED_ACCESSTOKEN'
    env:
      FEED_ACCESSTOKEN: $(System.AccessToken)

  - task: Docker@2
    displayName: "Push Automation Docker Image"
    condition: always()
    inputs:
      containerRegistry: $(containerRegistry) # Variable Group
      repository: $(registry-repo-name)
      command: 'push'
      tags: |
        latest
        $(MyTag)

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'manifest'
