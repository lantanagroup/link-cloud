# Pipeline that will create\delete Kafka Topics in a Kafka Cluster from .txt file on link-cloud Repo

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: environment
  displayName: Select the Kafka Topics environment to update?
  type: string
  default: DEV
  values:
    - DEV
    - TEST
    - QA
    - QA2
- name: growPartitions
  displayName: Increase partition counts up to topics.txt (never shrinks or deletes)
  type: boolean
  default: false

variables:
- group: kafka_topics # variable group `kafka_topics`

- name: gitBranch
  value: $[ replace(variables['Build.SourceBranch'], 'refs/heads/', '') ]

  # GitHub Topics File
- name: TOPICS_URL
  value: "https://raw.githubusercontent.com/lantanagroup/link-cloud/$(gitBranch)/topics.txt"
- name: RETRY_SERVICES_URL
  value: "https://raw.githubusercontent.com/lantanagroup/link-cloud/$(gitBranch)/kafka-retry-services.txt"

# REST URL
- name: restUrl
  ${{ if eq(parameters.environment, 'DEV') }}:
    value:  '$(dev-rest-url)'
  ${{ if eq(parameters.environment, 'TEST') }}:
    value:  '$(test-rest-url)'
  ${{ if eq(parameters.environment, 'QA') }}:
    value:  '$(qa-rest-url)'
  ${{ if eq(parameters.environment, 'QA2') }}:
    value:  '$(qa2-rest-url)'

stages:
- stage: Sync_Kafka_Topics_${{ parameters.environment }}
  jobs:
  - job: Sync_Kafka_Topics_${{ parameters.environment }}
    steps:
      - checkout: none

      - task: Bash@3
        displayName: "Sync Kafka Topics - ${{ parameters.environment }}"
        inputs:
          targetType: 'inline'
          script: |
            set -euo pipefail

            REST_PROXY_URL="$(restUrl)"
            USERNAME="$(kafka-username)"
            PASSWORD="$(kafka-password)"
            GROW_PARTITIONS=$(printf '%s' "${{ parameters.growPartitions }}" | tr '[:upper:]' '[:lower:]')

            if [[ -z "$REST_PROXY_URL" || -z "$USERNAME" || -z "$PASSWORD" ]]; then
              echo "ERROR: Missing required variables."
              exit 1
            fi

            echo "Starting Kafka topic sync..."
            echo "Using REST Proxy: $REST_PROXY_URL"

            echo "Fetching topics from GitHub..."
            TOPICS_CONTENT=$(curl -s -f "$(TOPICS_URL)" || true)

            # --- Validate topics file ---
            if [[ -z "$TOPICS_CONTENT" ]]; then
              echo "ERROR: Failed to fetch topics file from GitHub or file is empty. Aborting pipeline to prevent deletion."
              exit 1
            fi

            # Only keep lines with at least 3 colon-separated fields (topic:partitions:replicas)
            DESIRED_TOPICS=$(echo "$TOPICS_CONTENT" | awk -F: '/^[^#]/ && NF>=3')

            if [[ -z "$DESIRED_TOPICS" ]]; then
              echo "ERROR: Topics file is invalid or contains no valid topics. Aborting pipeline to prevent deletion."
              exit 1
            fi

            echo "Validated topics file. Processing topics..."

            # --- Get Kafka Cluster ID ---
            CLUSTER_ID=$(curl -s -u "$USERNAME:$PASSWORD" "$REST_PROXY_URL/v3/clusters" \
              | sed -n 's/.*"cluster_id":"\([^"]*\)".*/\1/p')

            if [[ -z "$CLUSTER_ID" || "$CLUSTER_ID" == "null" ]]; then
              echo "ERROR: Failed to retrieve Kafka cluster ID."
              exit 1
            fi

            echo "Detected Kafka Cluster ID: $CLUSTER_ID"
            echo

            # --- Create or update topics ---
            while IFS=: read -r TOPIC PARTITIONS REPLICAS CONFIGS || [[ -n "$TOPIC" ]]; do
              [[ -z "$TOPIC" ]] && continue
              [[ "$TOPIC" =~ ^# ]] && continue

              echo "Checking topic '$TOPIC'..."
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -u "$USERNAME:$PASSWORD" \
                "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$TOPIC")

              # Build configs JSON for creation
              CONFIG_JSON=""
              if [[ -n "${CONFIGS:-}" ]]; then
                IFS=',' read -ra CFG <<< "$CONFIGS"
                CONFIG_JSON='"configs":['
                FIRST=true
                for kv in "${CFG[@]}"; do
                  KEY=$(echo "$kv" | cut -d= -f1)
                  VAL=$(echo "$kv" | cut -d= -f2)
                  if [ "$FIRST" = true ]; then
                    FIRST=false
                  else
                    CONFIG_JSON+=","
                  fi
                  CONFIG_JSON+="{\"name\":\"$KEY\",\"value\":\"$VAL\"}"
                done
                CONFIG_JSON+=']'
              fi

              # --- Create topic if missing ---
              if [[ "$STATUS_CODE" == "404" ]]; then
                if ! [[ "$PARTITIONS" =~ ^[0-9]+$ && "$REPLICAS" =~ ^[0-9]+$ ]]; then
                  echo "ERROR: Invalid partitions/replicas for topic '$TOPIC'"
                  exit 1
                fi
                echo "Creating topic '$TOPIC'..."
                CREATE_PAYLOAD="{\"topic_name\":\"$TOPIC\",\"partitions_count\":$PARTITIONS,\"replication_factor\":$REPLICAS"
                [[ -n "$CONFIG_JSON" ]] && CREATE_PAYLOAD="$CREATE_PAYLOAD, $CONFIG_JSON"
                CREATE_PAYLOAD="$CREATE_PAYLOAD}"
                CREATE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  -u "$USERNAME:$PASSWORD" \
                  -X POST "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics" \
                  -H "Content-Type: application/json" \
                  -d "$CREATE_PAYLOAD")
                if [[ "$CREATE_CODE" != "200" && "$CREATE_CODE" != "201" ]]; then
                  echo "ERROR: Failed to create topic '$TOPIC' (HTTP $CREATE_CODE)."
                  exit 1
                fi
              elif [[ "$STATUS_CODE" == "200" ]]; then
                echo "Topic '$TOPIC' exists. Updating configs if any..."
                if [[ "${GROW_PARTITIONS}" == "true" ]]; then
                  LIVE_PARTITIONS=$(curl -s -u "$USERNAME:$PASSWORD" \
                    "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$TOPIC" \
                    | grep -oE '"partitions_count":[0-9]+' | head -n 1 | cut -d: -f2)
                  if [[ -z "$LIVE_PARTITIONS" ]]; then
                    LIVE_PARTITIONS=$(curl -s -u "$USERNAME:$PASSWORD" \
                      "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$TOPIC" \
                      | grep -o '"partition_id"' | wc -l | tr -d ' ')
                  fi
                  if [[ "$LIVE_PARTITIONS" =~ ^[0-9]+$ && "$PARTITIONS" =~ ^[0-9]+$ && "$LIVE_PARTITIONS" -lt "$PARTITIONS" ]]; then
                    echo "Growing '$TOPIC' from $LIVE_PARTITIONS to $PARTITIONS partitions."
                    GROW_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                      -u "$USERNAME:$PASSWORD" \
                      -X PATCH "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$TOPIC" \
                      -H "Content-Type: application/json" \
                      -d "{\"partitions_count\":$PARTITIONS}")
                    if [[ "$GROW_CODE" != "200" && "$GROW_CODE" != "204" ]]; then
                      echo "ERROR: Failed to grow '$TOPIC' (HTTP $GROW_CODE)."
                      exit 1
                    fi
                  elif [[ "$LIVE_PARTITIONS" =~ ^[0-9]+$ && "$PARTITIONS" =~ ^[0-9]+$ && "$LIVE_PARTITIONS" -gt "$PARTITIONS" ]]; then
                    echo "Leaving '$TOPIC' at $LIVE_PARTITIONS partitions. topics.txt asks for $PARTITIONS and counts are never reduced."
                  fi
                fi
              else
                echo "ERROR: Unexpected status $STATUS_CODE checking topic '$TOPIC'."
                exit 1
              fi

              # --- Update configs for existing topics ---
              if [[ -n "${CONFIGS:-}" ]]; then
                IFS=',' read -ra CFG <<< "$CONFIGS"
                for kv in "${CFG[@]}"; do
                  KEY=$(echo "$kv" | cut -d= -f1)
                  VAL=$(echo "$kv" | cut -d= -f2)
                  echo "Setting $KEY=$VAL for topic '$TOPIC'..."
                  UPDATE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                    -u "$USERNAME:$PASSWORD" \
                    -X PUT "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$TOPIC/configs/$KEY" \
                    -H "Content-Type: application/json" \
                    -d "{\"value\":\"$VAL\"}")
                  if [[ "$UPDATE_CODE" != "200" && "$UPDATE_CODE" != "204" ]]; then
                    echo "WARNING: Failed to update $KEY for '$TOPIC' (HTTP $UPDATE_CODE)"
                  fi
                done
              fi
              echo
            done <<< "$DESIRED_TOPICS"

            # Topics that are not listed are left in place. This sync never deletes and never recreates.
            echo "Creating per-service retry and redrive topics..."
            if ! RETRY_CONTENT=$(curl -s -f "$(RETRY_SERVICES_URL)"); then
              echo "ERROR: kafka-retry-services.txt was not fetched. Per-service retry topics were not created."
              exit 1
            fi
            if [[ -z "$RETRY_CONTENT" ]]; then
              echo "ERROR: kafka-retry-services.txt was empty. Per-service retry topics were not created."
              exit 1
            fi
              while IFS=: read -r MAIN_TOPIC SERVICES || [[ -n "$MAIN_TOPIC" ]]; do
                [[ -z "$MAIN_TOPIC" || "$MAIN_TOPIC" =~ ^# ]] && continue
                MAIN_PARTITIONS=$(echo "$DESIRED_TOPICS" | awk -F: -v t="$MAIN_TOPIC" '$1==t {print $2; exit}')
                MAIN_REPLICAS=$(echo "$DESIRED_TOPICS" | awk -F: -v t="$MAIN_TOPIC" '$1==t {print $3; exit}')
                MAIN_PARTITIONS=${MAIN_PARTITIONS:-3}
                MAIN_REPLICAS=${MAIN_REPLICAS:-1}
                IFS=',' read -ra SERVICE_LIST <<< "$SERVICES"
                for SERVICE in "${SERVICE_LIST[@]}"; do
                  SERVICE="${SERVICE#"${SERVICE%%[![:space:]]*}"}"
                  SERVICE="${SERVICE%"${SERVICE##*[![:space:]]}"}"
                  SUFFIXES=(Retry Redrive)
                  if [[ "$SERVICE" == "~"* ]]; then
                    SERVICE="${SERVICE#~}"
                    SUFFIXES=(Redrive)
                  fi
                  if [[ -z "$SERVICE" || "$SERVICE" == *"~"* ]]; then
                    echo "ERROR: invalid service for topic '$MAIN_TOPIC'."
                    exit 1
                  fi
                  for SUFFIX in "${SUFFIXES[@]}"; do
                    DERIVED="${MAIN_TOPIC}-${SUFFIX}-${SERVICE}"
                    DERIVED_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                      -u "$USERNAME:$PASSWORD" \
                      "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$DERIVED")
                    if [[ "$DERIVED_CODE" == "404" ]]; then
                      echo "Creating '$DERIVED' with $MAIN_PARTITIONS partitions."
                      CREATE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                        -u "$USERNAME:$PASSWORD" \
                        -X POST "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics" \
                        -H "Content-Type: application/json" \
                        -d "{\"topic_name\":\"$DERIVED\",\"partitions_count\":$MAIN_PARTITIONS,\"replication_factor\":$MAIN_REPLICAS}")
                      if [[ "$CREATE_CODE" != "200" && "$CREATE_CODE" != "201" ]]; then
                        echo "ERROR: Failed to create '$DERIVED' (HTTP $CREATE_CODE)."
                        exit 1
                      fi
                    elif [[ "$DERIVED_CODE" == "200" ]]; then
                      if [[ "${GROW_PARTITIONS}" == "true" ]]; then
                        LIVE_DERIVED=$(curl -s -u "$USERNAME:$PASSWORD" \
                          "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$DERIVED" \
                          | grep -oE '"partitions_count":[0-9]+' | head -n 1 | cut -d: -f2)
                        if [[ "$LIVE_DERIVED" =~ ^[0-9]+$ && "$MAIN_PARTITIONS" =~ ^[0-9]+$ && "$LIVE_DERIVED" -lt "$MAIN_PARTITIONS" ]]; then
                          echo "Growing '$DERIVED' from $LIVE_DERIVED to $MAIN_PARTITIONS partitions."
                          GROW_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                            -u "$USERNAME:$PASSWORD" \
                            -X PATCH "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics/$DERIVED" \
                            -H "Content-Type: application/json" \
                            -d "{\"partitions_count\":$MAIN_PARTITIONS}")
                          if [[ "$GROW_CODE" != "200" && "$GROW_CODE" != "204" ]]; then
                            echo "ERROR: Failed to grow '$DERIVED' (HTTP $GROW_CODE)."
                            exit 1
                          fi
                        fi
                      fi
                    else
                      echo "ERROR: Unexpected status $DERIVED_CODE checking topic '$DERIVED'."
                      exit 1
                    fi
                  done
                done
              done <<< "$RETRY_CONTENT"

            echo "Listing topics that are not in topics.txt (left unchanged)..."
            ALL_TOPICS=$(curl -s -u "$USERNAME:$PASSWORD" "$REST_PROXY_URL/v3/clusters/$CLUSTER_ID/topics" \
              | grep -oE '"topic_name":"[^"]+"' | cut -d'"' -f4)

            DESIRED_TOPIC_NAMES=$(echo "$DESIRED_TOPICS" | awk -F: '{print $1}')

            for TOPIC in $ALL_TOPICS; do
              if [[ "$TOPIC" == _* ]]; then
                continue
              fi
              if [[ -n "$DESIRED_TOPIC_NAMES" ]] && ! echo "$DESIRED_TOPIC_NAMES" | grep -qxF "$TOPIC"; then
                echo "Leaving unlisted topic '$TOPIC' in place."
              fi
            done

            echo "Topic sync complete!"
