                    group_id=group,
                    enable_auto_commit=False,
                    auto_offset_reset="earliest",
                    max_poll_records=1,
                )
            except Exception:
                time.sleep(2)
        while True:
            batches = consumer.poll(timeout_ms=1000, max_records=1)
            for messages in batches.values():
                for msg in messages:
                    try:
                        seq = json.loads(msg.value.decode("utf-8")).get("seq")
                    except Exception:
                        seq = None
                    line = json.dumps({
                        "group": group,
                        "key": (msg.key or b"").decode("utf-8", "replace"),
                        "seq": seq,
                        "partition": msg.partition,
                        "offset": msg.offset,
                    })
                    with open("/logs/consumer.lock", "a", encoding="utf-8") as lock:
                        fcntl.flock(lock, fcntl.LOCK_EX)
                        with open(path, "a", encoding="utf-8") as fh:
                            fh.write(line + "\n")
                            fh.flush()
                            os.fsync(fh.fileno())
                        fcntl.flock(lock, fcntl.LOCK_UN)
                    consumer.commit()
                    print(line, flush=True)
        PY

  mig-stray-producer:
    image: python:3.12-slim
    profiles: ["stray"]
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-1:9092}
      MIG_TOPIC: ${MIG_TOPIC:-ResourcesNormalized}
    entrypoint: ["bash", "-lc"]
    command:
      - |
        pip install --disable-pip-version-check -q kafka-python==2.2.15
        python -u - <<'PY'
        import json, os, time
        from kafka import KafkaProducer

        bootstrap = os.environ.get("KAFKA_BOOTSTRAP", "kafka-1:9092")
        topic = os.environ.get("MIG_TOPIC", "ResourcesNormalized")
        producer = None
        while producer is None:
            try:
                producer = KafkaProducer(bootstrap_servers=bootstrap, acks="all")
            except Exception:
                time.sleep(2)
        key = json.dumps({"facilityId": "stray", "patientId": "stray"}, separators=(",", ":")).encode("utf-8")
        while True:
            producer.send(topic, key=key, value=b'{"seq":0,"stray":true}').get(timeout=30)
            print("stray", flush=True)
            time.sleep(1)
        PY

volumes:
  mig-seq:
  mig-logs:
