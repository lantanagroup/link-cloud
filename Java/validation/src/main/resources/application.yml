service-information:
  service-name: Link Validation Service

loki:
  enabled: true
  url: http://localhost:3100
  app: link-cloud

server:
  port: 31820

telemetry:
  exporterEndpoint: http://localhost:55690

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: ValidationService

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    discovery:
      enabled: false
      
  jackson:
    mapper:
      accept-case-insensitive-enums: true
      accept-case-insensitive-properties: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ''
  #datasource:
  #  url: jdbc:sqlserver://;serverName=localhost\SQLEXPRESS;encrypt=true;trustServerCertificate=true
  #  username: link-user
  #  password: link-password
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: validation
    producer:
      client-id: validation-service
    #properties:
      #security.protocol: SASL_SSL
      #sasl.mechanism: PLAIN
      #sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="";
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      
  #data:
    #redis:
      #host: localhost
      #port: 6379
      #password:

cache:
  type: redis   # or "redis" and uncomment spring.data.redis properties
  validate-code:
    ttl: 3600
  rubric:
    ttl: 3600   # seconds; backstop only — register/publish/retire evict explicitly

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false
    ping:
      enabled: false
    refresh:
      enabled: false
    redis:
      enabled: false     # Custom RedisHealthIndicator (bounded PING) is used instead of the auto one
      timeout-ms: 3000   # backstop deadline for the custom indicator's PING; the 2s command timeout
                         # (RedisCacheConfig commandTimeout) reports DOWN sooner in the common case

logging:
  level:
    com.lantanagroup.link: debug

secret-management:
  key-vault-uri: ''

authentication:
  anonymous: false
  authority: 'https://localhost:7004'
  signing-key: ''

link:
  info-route: /api/validation/info
  # Link Terminology service ROOT (no path) — consumers append /api/terminology/fhir.
  # Overridden in docker by the compose environment (http://terminology:8076).
  terminology-service-url: 'http://localhost:8076'
  rubric:
    # Max rubric definition payload size (256 KiB). Checked against Content-Length before
    # body binding, and against the parsed body for chunked requests.
    max-payload-bytes: 262144
    dry-run:
      # When true, publishing a rubric version requires a completed dry run with status
      # ACCEPTABLE or ACCEPTABLE_WITH_WARNINGS. Outcomes are recorded by the $dry-run endpoint.
      required-for-publish: false
  # Retry for all HAPI FHIR REST clients (terminology validate-code/$lookup/etc.).
  # Transient failures only: connection IOExceptions, HTTP 429, and 5xx (e.g. Envoy
  # "503 no healthy upstream" during a terminology-service rollout). 4xx never retries.
  fhir-client-retry:
    max-attempts: 5
    backoff-millis: 5000
  report:
    base-url: http://localhost:5110
    routes:
      submission-model:
        path: /api/Report/Bundle/Patient
        query:
          - facilityId={facilityId}
          - patientId={patientId}
          - reportScheduleId={reportId}
      report-schedules:
        path: /api/schedules/{reportId}

internal-blob-storage:
  connection-string: ''
  blob-container-name: ''

pre-qualification:
  write-pre-qual-operation-outcome: false
  write-expressions-in-operation-outcome: true

vaas:
  checks:
    parallel: true
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 0
    keep-alive-seconds: 60
  bridge:
    enabled: true
    rubric-id: measure-report-submission-v1

validation:
  # Behavioural knobs for rubric (v2) category override and scoring, bound to ValidationPolicyConfig.
  # Every key below is stated explicitly rather than left to the code default, so the whole policy is
  # readable in one place. Values here match the code defaults except categoryOverride.scope.
  #
  # NOTE ON ENUM VALUES: these bind via Spring relaxed binding, which uses the enum CONSTANT NAME
  # (WORST_OF, FHIR_ONLY). The kebab-case forms seen in rubric JSON ("worst-of") come from the
  # enum's JSON value and apply to Jackson only -- they will NOT bind here.
  categoryOverride:
    # Master switch. When false the override engine short-circuits before reading any category, and
    # every finding keeps its own severity -- i.e. scoring behaves exactly as it did before the
    # override engine existed.
    enabled: true

    # Which findings the override engine may touch. ALL_CHECKS | FHIR_ONLY.
    # FHIR_ONLY restricts it to CheckType.FHIR_CONFORMANCE findings, so COMPLETENESS / PLAUSIBILITY /
    # TERMINOLOGY errors are filtered out before any category is consulted and can never be
    # downgraded.
    scope: FHIR_ONLY

    # How several matching categories collapse into one decision. WORST_OF | FIRST_MATCH.
    # WORST_OF combines severity and acceptable independently, each taking the worst value:
    # any acceptable=false wins, and the highest severity wins.
    matchStrategy: WORST_OF

  scoring:
    # Fallback rollup, used ONLY when a rubric version's own scoringPolicy.rollup is absent.
    # A rubric's persisted rollup always wins over this -- see ScoringPolicyResolver.
    # WORST_OF | BEST_OF | PASS_FAIL | MAJORITY | ALL_MUST_PASS.
    rollup: WORST_OF

  response:
    # Diagnostic fields only -- neither of these ever affects a score.
    # Emit originalSeverity / overriddenSeverity on each finding a category matched.
    includeOriginalSeverity: true
    # Emit categoryIds / governingCategoryId on each finding a category matched.
    includeCategoryIds: true
