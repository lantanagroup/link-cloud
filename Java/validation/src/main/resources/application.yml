service-information:
  service-name: Link Validation Service

loki:
  enabled: true
  url: http://localhost:3100
  app: link-cloud

server:
  port: 31820

telemetry:
  exporterEndpoint: http://localhost:55690

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: ValidationService

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    discovery:
      enabled: false
      
  jackson:
    mapper:
      accept-case-insensitive-enums: true
      accept-case-insensitive-properties: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ''
  #datasource:
  #  url: jdbc:sqlserver://;serverName=localhost\SQLEXPRESS;encrypt=true;trustServerCertificate=true
  #  username: link-user
  #  password: link-password
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: validation
    producer:
      client-id: validation-service
    retry:
      # consumer-retry-duration is the single source of truth for retry depth and timing: each entry is
      # the delay before that retry, and the attempt count is the list size + 1 (then dead-lettered).
      consumer-retry-duration:
        - PT20S
        - PT60S
        - PT120S
      disable-retry-consumer: false
    #properties:
      #security.protocol: SASL_SSL
      #sasl.mechanism: PLAIN
      #sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="";
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      
  #data:
    #redis:
      #host: localhost
      #port: 6379
      #password:

cache:
  type: redis   # or "redis" and uncomment spring.data.redis properties
  validate-code:
    ttl: 3600
  rubric:
    ttl: 3600   # seconds; backstop only — register/publish/retire evict explicitly

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false
    ping:
      enabled: false
    refresh:
      enabled: false
    redis:
      enabled: false     # Custom RedisHealthIndicator (bounded PING) is used instead of the auto one
      timeout-ms: 3000   # backstop deadline for the custom indicator's PING; the 2s command timeout
                         # (RedisCacheConfig commandTimeout) reports DOWN sooner in the common case

logging:
  level:
    com.lantanagroup.link: debug

secret-management:
  key-vault-uri: ''

authentication:
  anonymous: false
  authority: 'https://localhost:7004'
  signing-key: ''

link:
  info-route: /api/validation/info
  bundle-validation-parallelism: 4
  terminology-service-url: ''
  rubric:
    max-payload-bytes: 262144
    dry-run:
      required-for-publish: false
  validation-result-ignore-rules:
    - id: ignore_measureeval_measure_report_population_description_invalid_version
      description: Ignore known MeasureEval-generated MeasureReport population description extension version warnings
      matcher:
        field: EXPRESSION
        regex: "\\.extension\\[[0-9]+\\]\\[url='http://hl7\\.org/fhir/5\\.0/StructureDefinition/extension-MeasureReport\\.population\\.description'\\]$"
    - id: ignore_sde_reference_extension
      description: Ignore known MeasureReport.supplementalDataElement.reference extension
      matcher:
        field: EXPRESSION
        regex: "\\.extension\\[[0-9]+\\]\\[url='http://hl7\\.org/fhir/5\\.0/StructureDefinition/extension-MeasureReport\\.supplementalDataElement\\.reference'\\]$"
    - id: ignore_measureeval_measure_report_population_description_unknown_extension
      description: Ignore known MeasureEval-generated MeasureReport population description unknown extension warnings
      matcher:
        field: MESSAGE
        regex: "^Unknown extension http://hl7\\.org/fhir/5\\.0/StructureDefinition/extension-MeasureReport\\.population\\.description$"
    - id: ignore_deprecated_criteria_reference_extension
      description: Ignore deprecated criteriaReference extension warnings from measure-generated content
      matcher:
        field: MESSAGE
        regex: "^The extension http://hl7\\.org/fhir/us/davinci-deqm/StructureDefinition/extension-criteriaReference\\|5\\.0\\.0 is deprecated$"
  # Retry for all HAPI FHIR REST clients (terminology validate-code/$lookup/etc.).
  # Transient failures only: connection IOExceptions, HTTP 429, and 5xx (e.g. Envoy
  # "503 no healthy upstream" during a terminology-service rollout). 4xx never retries.
  fhir-client-retry:
    max-attempts: 5
    backoff-millis: 5000
  report:
    base-url: http://localhost:5110
    routes:
      submission-model:
        path: /api/Report/Bundle/Patient
        query:
          - facilityId={facilityId}
          - patientId={patientId}
          - reportScheduleId={reportId}
      report-schedules:
        path: /api/schedules/{reportId}

internal-blob-storage:
  connection-string: ''
  blob-container-name: ''

pre-qualification:
  write-pre-qual-operation-outcome: false
  write-expressions-in-operation-outcome: true

vaas:
  checks:
    parallel: true
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 0
    keep-alive-seconds: 60
  bridge:
    enabled: true
    rubric-id: measure-report-submission-v1

validation:
  categoryOverride:
    enabled: true

  scoring:
    rollup: WORST_OF

  response:
    includeOriginalSeverity: true
    includeCategoryIds: true
