service-information:
  service-name: "Link Measure Evaluation Service"
  product-version: dev

server:
  port: 8067

spring:
  data:
    mongodb:
      uri: mongodb://mongo:27017
      database: link-measureeval
    redis:
      host: redis_cache
      port: 6379
      timeout: 2000ms            # command timeout — bounds the health-check PING (default is 60s)
      connect-timeout: 1000ms    # socket connect timeout — bounds the "Redis unreachable" case
      lettuce:
        shutdown-timeout: 100ms

  kafka:
    bootstrap-servers: kafka_b:9092

    consumer:
      group-id: measureeval-events
      client-id: measureeval-client

    producer:
      properties:
        max:
          request:
            size: 10485760
    properties:
      security:
        protocol: SASL_PLAINTEXT
      sasl:
        mechanism: PLAIN

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

authentication:
  anonymous: true

link:
  data-acquisition:
    base-url: http://dataacq:8065

telemetry:
  exporter_endpoint: http://otel-collector:4317

loki:
  enabled: true
  url: http://loki:3100
