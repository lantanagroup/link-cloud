service-information:
  service-name: Link Measure Evaluation Service

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: false   # Drops Spring's camelCase livenessState/readinessState rows, and with
                         # them /health/liveness and /health/readiness. No Link deployment probes
                         # those paths; re-enable this if one ever does.
  health:
    discover-composite:
      enabled: false
    ping:
      enabled: false
    refresh:
      enabled: false
    diskspace:
      enabled: false
    mongo:
      enabled: false   # auto Mongo indicator disabled; MongoHealthIndicator checks the ping
      timeout-ms: 2000 # backstop deadline for the ping; an unreachable mongod otherwise blocks for
                       # the driver's serverSelectionTimeoutMS (30s by default), which pushes /health
                       # past the BFF's health-check deadline and blanks the dashboard entries.
                       # Spring runs indicators sequentially on the request thread, so the budgets
                       # add up: 2s here, 3s for the resource-cache backstop below, and 1.5s for the
                       # Kafka indicator -- 6.5s with all three backends down at once, inside the
                       # BFF's 8s deadline (SpringServiceHealth.Deadline). Keep the sum under
                       # it: exceeding it costs every row for this service, and the rows are what
                       # say which backend failed.
    redis:
      enabled: false     # auto Redis indicator disabled; ResourceCacheHealthIndicator checks Redis + ABS
    resource-cache:
      timeout-ms: 3000   # backstop deadline for the combined Redis+ABS check. The 2s Redis command
                         # timeout (spring.data.redis.timeout) reports DOWN sooner in the common case
                         # but does not bound the ABS half, so this is what the budget above counts.
    kafka:
      enabled: true      # Ensures Kafka health is checked
      timeout-ms: 1500   # backstop deadline for the acknowledgement; stays above the health
                         # producer's max.block.ms (Properties.MAX_BLOCK_MS_CONFIG, 1000) so an
                         # unreachable broker is reported as one rather than as a timed-out future

logging:
  level:
    com.lantanagroup.link: debug
    com.lantanagroup.link.performance: info

server:
  port: 5135

telemetry:
  exporterEndpoint: http://localhost:55690

loki:
  enabled: true
  url: http://localhost:3100
  app: link-cloud

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:

  cloud:
    discovery:
      enabled: false

  application:
    name: measureeval

  data:
    mongodb:
      uri: mongodb://localhost:27017/${spring.application.name}?serverSelectionTimeoutMS=4000
      database: ${spring.application.name}

    redis:
      timeout: 2000ms            # command timeout — bounds the health-check PING (default is 60s)
      connect-timeout: 1000ms    # socket connect timeout — bounds the "Redis unreachable" case
      lettuce:
        shutdown-timeout: 100ms

  jackson:
    mapper:
      accept-case-insensitive-enums: true
      accept-case-insensitive-properties: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: ${spring.application.name}
      client-id: ${spring.application.name}-${HOSTNAME:local}-c1
      auto-offset-reset: earliest
      properties:
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        "[metadata.max.age.ms]": 30000
        "[max.partition.fetch.bytes]": 10485760

    producer:
      client-id: ${spring.application.name}-${HOSTNAME:local}-p
      acks: all
      properties:
        enable.idempotence: true
        max.request.size: 10485760

    retry:
      # consumer-retry-duration is the single source of truth for retry depth and timing: each entry is
      # the delay before that retry, and the attempt count is the list size + 1 (then dead-lettered).
      consumer-retry-duration:
        - PT20S
        - PT60S
        - PT120S
      disable-retry-consumer: false

link:
  info-route: /api/measureeval/info
  reportability-predicate: com.lantanagroup.link.measureeval.reportability.IsInInitialPopulation
  cql-debug: false

  report:
    base-url: http://localhost:5110
    routes:
      submission-model:
        path: /api/Report/Bundle/Patient
        query:
          - facilityId={facilityId}
          - patientId={patientId}
          - reportScheduleId={reportId}
      report-schedules:
        path: /api/schedules/{reportId}

secret-management:
  key-vault-uri: ''

authentication:
  anonymous: false
  authority: 'https://localhost:7004'
  signing-key: ''

internal-blob-storage:
  connection-string: ''
  blob-container-name: ''

resource-cache:
  blob-storage:
    connection-string: ''
    blob-container-name: ''
    blob-root: ''
