# Add 'config-change' label to any file changes within the 'docs/config' folder or the docs/README.md file
config-change:
- changed-files:
  - any-glob-to-any-file: 
    - 'docs/config/*'
    - 'docs/service_specs/*'
    - 'docs/README.md'

# Add 'db-change' label to any file changes within the migrations folders
db-change:
- changed-files:
  - any-glob-to-any-file: 
    - 'Dotnet/Account/Migrations/*'
    - 'Dotnet/Audit/Migrations/*'
    - 'Dotnet/Census/Migrations/*'
    - 'Dotnet/DataAcquisition.Domain/Migrations/*'
    - 'Dotnet/Normalization/Migrations/*'
    - 'Dotnet/QueryDispatch/Migrations/*'
    - 'Dotnet/Tenant/Migrations/*'
    - 'Java/validation/src/main/resources/database/migrations/*'
