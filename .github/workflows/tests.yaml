name: "Tests"

on:
#  schedule:
#    - cron: "0 0 * * *"
  pull_request:
    branches:
      - dev
      - workflow/**
      - release/**
      - hotfix/**
      - tech_debt/**
      - test/**

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs: 
      run_job: ${{ steps.should.outputs.run_job }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute whether to run E2E tests
        id: should
        shell: bash
        run: |
          RANGE="origin/${{ github.base_ref }}...HEAD"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true

          CHANGED_FILES=$(git diff --name-only "$RANGE" || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq '^(DotNet/|Tests/|Java/|docker-compose\.yml|\.github/workflows/tests\.yaml)'; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show decision
        run: echo "run_job=${{ steps.should.outputs.run_job }}"

  backend-e2e-tests:
    # Each matrix entry runs as its own GitHub Actions job, so it gets its
    # own collapsible section and its own clean log stream in the UI — no
    # more interleaved output from unrelated test categories. The jobs run
    # in parallel across runners, and each one stands up its own isolated
    # docker compose stack (scoped by PROJECT_NAME) so they can't collide.
    name: Backend E2E - ${{ matrix.test.name }}
    runs-on: [docker-16core-64gb]
    timeout-minutes: 60

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: Adhoc Report
            category: AdhocReportTest
            trx: adhoc-report-test-results.trx
            slug: adhoc-report
          - name: API Stability
            category: ApiStabilityTest
            trx: api-stability-test-results.trx
            slug: api-stability
          - name: Report Scheduled
            category: ReportScheduledTest
            trx: report-scheduled-test-results.trx
            slug: report-scheduled
          - name: Regenerate Report
            category: RegenerateReportTest
            trx: regenerate-report-test-results.trx
            slug: regenerate-report
          - name: Multi-Measure
            category: MultiMeasureTest
            trx: multi-measure-test-results.trx
            slug: multi-measure

    env:
      # Unique compose project per matrix job keeps parallel stacks isolated
      # (separate networks, container names, volumes).
      PROJECT_NAME: link-${{ matrix.test.slug }}
      HEALTH_CHECK_TIMEOUT: 60
      CHECK_INTERVAL: 10
      ADHOC_REPORT_TEST_DOWNLOAD_PATH: ./Tests/BackendE2ETests/TestResults/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services with cache
        run: |
          docker buildx bake --file docker-compose.yml \
            --set *.cache-from=type=gha,scope=e2e-docker \
            --set *.cache-to=type=gha,scope=e2e-docker \
            --set *.output=type=docker   # <-- makes images visible to `docker compose`

      - name: Start services
        run: docker compose -p "$PROJECT_NAME" up --no-build -d

      - name: Wait for services to start
        run: sleep 10

      - name: Wait for Services to Become Healthy
        run: |
          chmod +x Scripts/check_health.sh
          Scripts/check_health.sh $PROJECT_NAME $HEALTH_CHECK_TIMEOUT $CHECK_INTERVAL

      - name: ${{ matrix.test.name }} E2E Test
        run: |
          dotnet test ./Tests/BackendE2ETests/BackendE2ETests.csproj \
            --filter "Category=${{ matrix.test.category }}" \
            --logger "trx;LogFileName=${{ matrix.test.trx }}" \
            --logger "console;verbosity=detailed" \
            --results-directory ./Tests/BackendE2ETests/TestResults

      # ---- Artifact uploads ----

      - name: Upload Service Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-service-logs-${{ matrix.test.slug }}
          path: service-logs/

      - name: Upload ${{ matrix.test.name }} test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test.slug }}-test-results
          path: ./Tests/BackendE2ETests/TestResults/${{ matrix.test.trx }}
          if-no-files-found: ignore

      - name: Upload Adhoc Report submission ZIP
        if: ${{ !cancelled() && matrix.test.category == 'AdhocReportTest' }}
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-report-submission-zip
          path: ./Tests/BackendE2ETests/TestResults/adhoc-report-test-submission.zip
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        run: docker compose -p "$PROJECT_NAME" down -v --remove-orphans

  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Pulled up-front so the integration fixtures (Testcontainers) don't
      # spend their per-test pull budget on the cold pull.
      - name: Pull Azurite Docker image
        run: docker pull mcr.microsoft.com/azure-storage/azurite:latest

      - name: Pull SQL Server Docker image
        run: docker pull mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04

      - name: Restore dependencies
        run: dotnet restore DotNet/ServiceTests/ServiceTests.csproj

      - name: Build
        run: dotnet build DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-restore

      # Single invocation runs every test in the ServiceTests project (unit + integration).
      # No Category filter; xUnit's collection wiring keeps integration tests serialized
      # and unit tests parallel within the same run.
      - name: Run .NET tests
        run: |
          mkdir -p ./TestResults
          dotnet test DotNet/ServiceTests/ServiceTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=dotnet-test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        continue-on-error: true
        timeout-minutes: 25

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            ./TestResults/*.trx
            ./TestResults/*/coverage.cobertura.xml

      - name: .NET Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: .NET Test Report
          path: ./TestResults/*.trx
          reporter: dotnet-trx

  java-unit-tests:
    name: Unit Tests for Java
    runs-on: ['ubuntu-latest']

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean test
        working-directory: Java

      - name: Java Unit Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: XUnit Tests
          path: "**/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload Java Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-coverage
          path: "**/target/site/jacoco/jacoco.xml"

  coverage-report:
    name: Aggregate Coverage Report
    runs-on: ubuntu-latest
    needs: [dotnet-tests, java-unit-tests]
    if: always() && (needs.dotnet-tests.result == 'success' || needs.dotnet-tests.result == 'skipped' || needs.dotnet-tests.result == 'failure') && (needs.java-unit-tests.result == 'success' || needs.java-unit-tests.result == 'skipped' || needs.java-unit-tests.result == 'failure')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DotNet Coverage
        uses: actions/download-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet-coverage
        continue-on-error: true

      - name: Download Java Coverage
        uses: actions/download-artifact@v4
        with:
          name: java-coverage
          path: java-coverage
        continue-on-error: true

      - name: Run Coverage Script
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python Scripts/update_pr_coverage.py
