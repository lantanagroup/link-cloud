name: "Tests"

on:
#  schedule:
#    - cron: "0 0 * * *"
  pull_request:
    branches:
      - dev
      - workflow/**
      - release/**
      - hotfix/**
      - tech_debt/**
      - test/**

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs: 
      run_job: ${{ steps.should.outputs.run_job }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute whether to run E2E tests
        id: should
        shell: bash
        run: |
          RANGE="origin/${{ github.base_ref }}...HEAD"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true

          CHANGED_FILES=$(git diff --name-only "$RANGE" || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq '^(DotNet/|Tests/|Java/|docker-compose\.yml|\.github/workflows/tests\.yaml)'; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show decision
        run: echo "run_job=${{ steps.should.outputs.run_job }}"

  backend-e2e-tests:
    name: Smoke Test with Docker Compose
    runs-on: [docker-16core-64gb]
    timeout-minutes: 60

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    env:
      PROJECT_NAME: link
      HEALTH_CHECK_TIMEOUT: 60
      CHECK_INTERVAL: 10
      ADHOC_REPORT_TEST_DOWNLOAD_PATH: ./Tests/BackendE2ETests/TestResults/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services with cache
        run: |
          docker buildx bake --file docker-compose.yml \
            --set *.cache-from=type=gha,scope=e2e-docker \
            --set *.cache-to=type=gha,scope=e2e-docker \
            --set *.output=type=docker   # <-- makes images visible to `docker compose`

      - name: Start services
        run: docker compose up --no-build -d

      - name: Wait for services to start
        run: sleep 10

      - name: Wait for Services to Become Healthy
        run: |
          chmod +x Scripts/check_health.sh
          Scripts/check_health.sh $PROJECT_NAME $HEALTH_CHECK_TIMEOUT $CHECK_INTERVAL

      # ---- Test categories run sequentially against the SAME compose stack. ----
      # `if: ${{ !cancelled() }}` lets later categories run even if an earlier one fails,
      # while still letting a failure mark the overall job as failed.

      - name: Adhoc Report Tests
        run: dotnet test ./Tests/BackendE2ETests/BackendE2ETests.csproj --filter "Category=AdhocReportTest" --logger "trx;LogFileName=adhoc-report-test-results.trx" --logger "console;verbosity=detailed"

      - name: API Stability Test
        if: ${{ !cancelled() }}
        run: dotnet test ./Tests/BackendE2ETests/BackendE2ETests.csproj --filter "Category=ApiStabilityTest" --logger "trx;LogFileName=api-stability-test-results.trx" --logger "console;verbosity=detailed"

      - name: Report Scheduled E2E Test
        if: ${{ !cancelled() }}
        run: dotnet test ./Tests/BackendE2ETests/BackendE2ETests.csproj --filter "Category=ReportScheduledTest" --logger "trx;LogFileName=report-scheduled-test-results.trx" --logger "console;verbosity=detailed"

      - name: Regenerate Report E2E Test
        if: ${{ !cancelled() }}
        run: dotnet test ./Tests/BackendE2ETests/BackendE2ETests.csproj --filter "Category=RegenerateReportTest" --logger "trx;LogFileName=regenerate-report-test-results.trx" --logger "console;verbosity=detailed"

      - name: Multi-Measure E2E Test
        if: ${{ !cancelled() }}
        run: dotnet test ./Tests/BackendE2ETests/BackendE2ETests.csproj --filter "Category=MultiMeasureTest" --logger "trx;LogFileName=multi-measure-test-results.trx" --logger "console;verbosity=detailed"

      # ---- Always-on artifact uploads (preserve per-category artifact names) ----

      - name: Upload Service Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-service-logs
          path: service-logs/

      - name: Upload Adhoc Report test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-report-test-results
          path: ./Tests/BackendE2ETests/TestResults/adhoc-report-test-results.trx
          if-no-files-found: ignore

      - name: Upload Adhoc Report submission ZIP
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-report-submission-zip
          path: ./Tests/BackendE2ETests/TestResults/adhoc-report-test-submission.zip
          if-no-files-found: ignore

      - name: Upload API Stability test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-stability-test-results
          path: ./Tests/BackendE2ETests/TestResults/api-stability-test-results.trx
          if-no-files-found: ignore

      - name: Upload Report Scheduled test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-scheduled-test-results
          path: ./Tests/BackendE2ETests/TestResults/report-scheduled-test-results.trx
          if-no-files-found: ignore

      - name: Upload Regenerate Report test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regenerate-report-test-results
          path: ./Tests/BackendE2ETests/TestResults/regenerate-report-test-results.trx
          if-no-files-found: ignore

      - name: Upload Multi-Measure test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-measure-test-results
          path: ./Tests/BackendE2ETests/TestResults/multi-measure-test-results.trx
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        run: docker compose down -v --remove-orphans

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pull Azurite Docker image
        run: docker pull mcr.microsoft.com/azure-storage/azurite:latest

      - name: Pull SQL Server Docker image
        run: docker pull mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04

      - name: Restore dependencies
        run: dotnet restore DotNet/ServiceTests/ServiceTests.csproj

      - name: Build
        run: dotnet build DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: |
          mkdir -p ./TestResults
          dotnet test DotNet/ServiceTests/ServiceTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity detailed \
            --logger "trx;LogFileName=dotnet-integration-test-results.trx" \
            --results-directory ./TestResults \
            --filter "Category=IntegrationTests"
        continue-on-error: true
        timeout-minutes: 15

      - name: Normalize TRX output location
        if: always()
        run: |
          mkdir -p ./TestResults
          i=0
          while IFS= read -r -d '' file; do
            i=$((i+1))
            cp "$file" "./TestResults/integration-$i.trx"
          done < <(find . -type f -name "*.trx" -print0)
          echo "Collected $i trx file(s) into ./TestResults"

      - name: Debug test results
        run: |
          ls -la ./TestResults || true
          find . -type f -name "*.trx" -print || true
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/*.trx

      - name: .NET Integration Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: XUnit Integration Tests
          path: ./TestResults/*.trx
          reporter: dotnet-trx

  dotnet-unit-tests:
    name: Unit Tests for DotNet
    runs-on: windows-latest
    timeout-minutes: 10

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DotNet/ServiceTests/ServiceTests.csproj

      - name: Build
        run: dotnet build DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-restore

      - name: Run dotnet-unit tests
        run: dotnet test DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-build --verbosity detailed --logger "trx;LogFileName=dotnet-unit-test-results.trx" --results-directory ./TestResults --filter "Category=UnitTests" --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        continue-on-error: true
        timeout-minutes: 5

      - name: Debug test results
        run: dir .\TestResults
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-unit-test-results
          path: |
            ./TestResults/*.trx
            ./TestResults/*/coverage.cobertura.xml

      - name: .NET Integration Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: XUnit Integration Tests
          path: ./TestResults/dotnet-unit-test-results.trx
          reporter: dotnet-trx

  java-unit-tests:
    name: Unit Tests for Java
    runs-on: ['ubuntu-latest']

    needs: changes
    if: ${{ needs.changes.outputs.run_job == 'true' }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean test
        working-directory: Java

      - name: Java Unit Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: XUnit Tests
          path: "**/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload Java Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-coverage
          path: "**/target/site/jacoco/jacoco.xml"

  coverage-report:
    name: Aggregate Coverage Report
    runs-on: ubuntu-latest
    needs: [dotnet-unit-tests, java-unit-tests]
    if: always() && (needs.dotnet-unit-tests.result == 'success' || needs.dotnet-unit-tests.result == 'skipped' || needs.dotnet-unit-tests.result == 'failure') && (needs.java-unit-tests.result == 'success' || needs.java-unit-tests.result == 'skipped' || needs.java-unit-tests.result == 'failure')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DotNet Coverage
        uses: actions/download-artifact@v4
        with:
          name: dotnet-unit-test-results
          path: dotnet-coverage
        continue-on-error: true

      - name: Download Java Coverage
        uses: actions/download-artifact@v4
        with:
          name: java-coverage
          path: java-coverage
        continue-on-error: true

      - name: Run Coverage Script
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python Scripts/update_pr_coverage.py
