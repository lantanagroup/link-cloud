name: "Auto-format"

on:
  pull_request:
    branches:
      - dev
      - workflow/**
      - release/**
      - hotfix/**
      - tech_debt/**
      - test/**

permissions:
  contents: write

jobs:
  auto-format:
    name: Auto-format Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on actual PR branches, not forks (forks can't push back)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Get changed C# files
        id: changed
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD -- '*.cs' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No C# files changed."
          else
            echo "Changed files: $files"
          fi

      - name: Apply dotnet format
        if: steps.changed.outputs.files != ''
        run: dotnet format link-cloud.sln --include ${{ steps.changed.outputs.files }}

      - name: Push formatting changes via GitHub API
        if: steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const status = execSync('git status --porcelain').toString().trim();
            if (!status) {
              console.log('No formatting changes needed.');
              return;
            }

            console.log('Files changed by dotnet format:');
            console.log(status);

            const branch = process.env.GITHUB_HEAD_REF;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Current HEAD
            const headSha = execSync('git rev-parse HEAD').toString().trim();
            const { data: headCommit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: headSha
            });

            // Create blobs for each changed file
            const changedFiles = status.split('\n').map(line => line.substring(3));
            const treeEntries = [];

            for (const filePath of changedFiles) {
              const content = fs.readFileSync(filePath, 'utf8');
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content, encoding: 'utf-8'
              });
              treeEntries.push({
                path: filePath, mode: '100644', type: 'blob', sha: blob.sha
              });
            }

            // Create tree and commit via the API (GitHub signs these automatically)
            const { data: newTree } = await github.rest.git.createTree({
              owner, repo, base_tree: headCommit.tree.sha, tree: treeEntries
            });

            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: 'style: auto-format changed files',
              tree: newTree.sha,
              parents: [headSha]
            });

            console.log(`Created verified commit: ${newCommit.sha}`);

            // Update the branch to point to the new signed commit
            await github.rest.git.updateRef({
              owner, repo,
              ref: `heads/${branch}`,
              sha: newCommit.sha
            });

            console.log(`Branch ${branch} updated to ${newCommit.sha}`);
