name: "Auto-format"

on:
  pull_request:
    branches:
      - dev
      - workflow/**
      - release/**
      - hotfix/**
      - tech_debt/**
      - test/**

permissions:
  contents: write

jobs:
  auto-format:
    name: Auto-format Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on actual PR branches, not forks (forks can't push back)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Get changed C# files
        id: changed
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD -- '*.cs' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No C# files changed."
          else
            echo "Changed files: $files"
          fi

      - name: Apply dotnet format
        if: steps.changed.outputs.files != ''
        run: dotnet format link-cloud.sln --include ${{ steps.changed.outputs.files }}

      - name: Commit and push formatting changes
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: auto-format changed files"
            git push
          fi
