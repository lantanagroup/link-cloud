# From: https://levelup.gitconnected.com/enforcing-jira-ticket-formatting-in-github-pr-titles-and-commit-messages-78d9755568df
name: "PR Requirements Check"
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    branches:
      - dev
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'users/stephen/support-docs-layout-changes'
    types: [opened, edited, synchronize]
  merge_group:
    branches:
      - dev

jobs:
  check-pr-requirements:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set PR context
      id: pr_context
      env:
        PR_TITLE_INPUT: ${{ github.event.pull_request.title }}
        PR_BODY_INPUT: ${{ github.event.pull_request.body }}
      run: |
        echo "PR_TITLE<<EOF" >> $GITHUB_ENV
        echo "$PR_TITLE_INPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        echo "PR_BODY<<EOF" >> $GITHUB_ENV
        echo "$PR_BODY_INPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Verify PR title requirements are met
      run: python3 .github/scripts/pr_title_check.py

    - name: Verify PR body requirements are met
      id: pr_body_check
      run: python3 .github/scripts/pr_body_check.py

    - name: Comment on PR if PR body check warning or failure
      if: steps.pr_body_check.outputs.log != '' && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          :warning: **PR template requirements not met**
          ${{ steps.pr_body_check.outputs.log }}
        edit-mode: replace
        comment-id: pr-template-warning

    - name: Comment on PR if PR body check passes
      if: steps.pr_body_check.outputs.log == '' && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          :white_check_mark: **PR template requirements met!**
        edit-mode: replace
        comment-id: pr-template-warning

    - name: Find PR requirements comment
      uses: peter-evans/find-comment@v3
      id: find_comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: pr-template-warning

    - name: Set compliance status
      id: compliance_status
      run: |
        # Example: echo "compliance_status=compliant" >> $GITHUB_OUTPUT
        # Or: echo "compliance_status=non-compliant" >> $GITHUB_OUTPUT

    - name: Conditionally comment on PR
      if: |
        (
          (steps.compliance_status.outputs.compliance_status == 'non-compliant' &&
           !contains(steps.find_comment.outputs.comment-body, ':warning: **PR template requirements not met**'))
          ||
          (steps.compliance_status.outputs.compliance_status == 'compliant' &&
           !contains(steps.find_comment.outputs.comment-body, ':white_check_mark: **PR template requirements met!**'))
        )
        && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ${{ steps.compliance_status.outputs.compliance_status == 'compliant' && ':white_check_mark: **PR template requirements met!**' || ':warning: **PR template requirements not met**' }}
          ${{ steps.pr_body_check.outputs.log }}
        edit-mode: replace
        comment-id: pr-template-warning

