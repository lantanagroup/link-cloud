# From: https://levelup.gitconnected.com/enforcing-jira-ticket-formatting-in-github-pr-titles-and-commit-messages-78d9755568df
name: "PR Requirements Check"
permissions:
  contents: read
on:
  pull_request:
    branches: 
      - dev
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'users/stephen/support-docs-layout-changes' 
    types: [opened, edited, synchronize]
  merge_group:
    branches:
      - dev

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify PR template requirements are met
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const payload = context.payload;
          let prTitle, prBody;

          if (payload.pull_request) {
            prTitle = payload.pull_request.title;
            prBody = payload.pull_request.body;
          } else if (payload.merge_group && payload.merge_group.pull_requests?.length) {
            prTitle = payload.merge_group.pull_requests[0].title;
            prBody = payload.merge_group.pull_requests[0].body;
          } else {
            core.setFailed('Cannot determine PR title or description for validation.');
          }

          // Title check
          const prTitleExpectedPattern = /(^LNK-\d+:\s)|(^TECH_DEBT:\s)/g;
          const prTitleMismatchError = 'Invalid PR title! Must begin with LNK-nnnn:<space> or TECH_DEBT:<space>, e.g. LNK-1234: My PR title, or TECH_DEBT: My PR title';
          if (!prTitleExpectedPattern.test(prTitle)) {
            console.log(prTitleMismatchError);
            core.setFailed(prTitleMismatchError);
          } else {
            console.log('PR title format is correct.');
          }

          // Description check
          const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'pull_request_template.md');
          let templateContent = '';
          try {
            templateContent = fs.readFileSync(templatePath, 'utf8').trim();
          } catch (err) {
            console.error(`Error reading pull_request_template.md: ${err.message}`);
            core.setFailed('Could not read pull_request_template.md for PR description validation.');
          }

          function normalize(str) {
            return str.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
          }

          // Split template into sections by headings (e.g., ### Section)
          const sectionRegex = /###\s+(.+)\n([\s\S]*?)(?=\n###|$)/g;
          let match;
          let incompleteSections = [];
          while ((match = sectionRegex.exec(templateContent)) !== null) {
            const sectionTitle = match[1].trim();
            const templateSectionContent = match[2].trim();

            // Find corresponding section in PR body
            const prSectionRegex = new RegExp(`###\\s+${sectionTitle}\\n([\\s\\S]*?)(?=\\n###|$)`, 'g');
            const prMatch = prSectionRegex.exec(prBody || '');
            const prSectionContent = prMatch ? prMatch[1].trim() : '';

            // If PR section is missing or unchanged from template, mark as incomplete
            if (!prSectionContent || prSectionContent === templateSectionContent) {
              incompleteSections.push(sectionTitle);
            }
          }

          if (incompleteSections.length > 0) {
            const errorMsg = `PR template requirements not met. Please complete the following section(s): ${incompleteSections.join(', ')}`;
            console.log(errorMsg);
            core.setFailed(errorMsg);
          } else {
            console.log('PR description format is correct.');
          }
