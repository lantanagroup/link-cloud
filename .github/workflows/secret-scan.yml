name: "Secret Scan"

# Scans every commit a pull request adds with the TruffleHog release pinned in
# .githooks/trufflehog.pins, the one the pre-commit hook runs, and fails if one of them adds a likely
# secret. TruffleHog reads only the lines each commit adds, so secrets already in the base branch are
# not reported unless a commit adds them again. See dev-docs/secret-scanning.md.
#
# Logs here are public: report the path, line, finding type and commit only, never the secret.
on:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Nothing here pushes, so keep the token out of .git/config, away from the downloaded scanner.
          persist-credentials: false

      - name: Install TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' .githooks/trufflehog.pins)
          sha256=$(sed -n 's/^linux_amd64=//p' .githooks/trufflehog.pins)
          if ! printf '%s' "$version" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' ||
             ! printf '%s' "$sha256" | grep -qxE '[0-9a-f]{64}'; then
            echo "::error::.githooks/trufflehog.pins needs a version and a linux_amd64 SHA-256."
            exit 1
          fi
          echo "TruffleHog $version"

          asset="trufflehog_${version}_linux_amd64.tar.gz"
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/$asset"
          echo "$sha256  $RUNNER_TEMP/$asset" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trufflehog
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan each commit the pull request adds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # The base commit may not be among the fetched branches if the base has moved on since.
          git fetch -q --no-tags origin "$BASE_SHA" || true
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Scanning $(git rev-list --no-merges --count "$merge_base..HEAD") commit(s) since ${merge_base:0:9}."

          findings="$RUNNER_TEMP/findings.jsonl"
          errors="$RUNNER_TEMP/trufflehog.err"

          # No verification: it would send each candidate to its provider, and a database that is not
          # reachable from a runner would read as an invalid credential and be dropped.
          if ! trufflehog git file://. --since-commit "$merge_base" --branch HEAD --json --no-verification \
              --no-update --results=verified,unknown,unverified > "$findings" 2> "$errors"; then
            echo "::error::TruffleHog failed."
            tail -20 "$errors"
            exit 2
          fi

          # From the base branch as it is now, not the pull request, so a pull request cannot exclude its own
          # findings, and a re-run picks up a pattern merged since the pull request was opened.
          exclude="$RUNNER_TEMP/trufflehog-exclude.txt"
          : > "$exclude"
          if git cat-file -e "origin/$BASE_REF:.githooks/trufflehog-exclude.txt" 2>/dev/null; then
            git show "origin/$BASE_REF:.githooks/trufflehog-exclude.txt" > "$exclude"
          fi

          # Report the path, line, finding type and commit only: the secret itself never reaches the log.
          # Exits 10 when it reports a finding, so a crash is not mistaken for one.
          status=0
          python3 - "$findings" "$exclude" <<'PY' || status=$?
          import json, re, sys
          excluded = [re.compile(pattern) for pattern in (raw.strip() for raw in open(sys.argv[2], encoding="utf-8"))
                      if pattern and not pattern.startswith("#")]
          reported = set()
          skipped = 0
          for line in open(sys.argv[1], encoding="utf-8"):
              if not line.startswith("{"):
                  continue
              finding = json.loads(line)
              git = finding["SourceMetadata"]["Data"]["Git"]
              path, number, commit = git.get("file", ""), git.get("line", 0), git["commit"]
              if any(pattern.search(path) for pattern in excluded):
                  skipped += 1
                  continue
              key = (path, number, commit, finding["DetectorName"])
              if key in reported:
                  continue
              reported.add(key)
              print(f"::error file={path},line={number}::TruffleHog found a likely {finding['DetectorName']} secret "
                    f"added in commit {commit[:9]}. Remove it from that commit, not only from the latest change.")
          if skipped:
              print(f"::notice::Ignored {skipped} finding(s) in paths listed in .githooks/trufflehog-exclude.txt.")
          sys.exit(10 if reported else 0)
          PY

          if [ "$status" -eq 10 ]; then
            echo "::error::Likely secrets were added. See the annotations above."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Could not read TruffleHog's results."
            exit 2
          fi
          echo "No likely secrets added."
