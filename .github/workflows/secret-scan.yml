name: "Secret Scan"

# Scans every commit a pull request adds with TruffleHog 2.2.1, the version the team uses
# locally, and fails if one of them adds a likely secret. Secrets already in the base branch
# are not reported unless a commit adds them again.
#
# Logs here are public: report the path, finding type and commit only, never the secret.
on:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TruffleHog 2.2.1
        run: pip install "truffleHog==2.2.1"

      - name: Scan each commit the pull request adds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # The base commit may not be among the fetched branches if the base has moved on since.
          git fetch -q --no-tags origin "$BASE_SHA" || true
          merge_base=$(git merge-base "$BASE_SHA" HEAD)

          # Version 2 diffs commits in date order, not parent to child, so a branch's history cannot be
          # scanned reliably. Instead, replay each commit's own change as a parentless two-commit branch
          # and scan that alone. Merge commits are skipped: they carry the base branch's changes.
          git remote set-url origin "$PWD"
          commits=$(git rev-list --no-merges --reverse "$merge_base..HEAD")
          echo "Scanning $(printf '%s' "$commits" | grep -c . || true) commit(s) since ${merge_base:0:9}."

          found=0
          for commit in $commits; do
            root=$(git -c user.name=scan -c user.email=scan@localhost commit-tree "$commit^^{tree}" -m root)
            tip=$(git -c user.name=scan -c user.email=scan@localhost commit-tree "$commit^{tree}" -p "$root" -m tip)
            git update-ref "refs/heads/scan-$commit" "$tip"

            # Exit code 1 means findings. A traceback means TruffleHog itself failed, which must not pass.
            trufflehog --regex --entropy=False --json --repo_path "$PWD" \
              --branch "scan-$commit" --since_commit "$root" unused > findings.jsonl 2> trufflehog.err || true
            if grep -q Traceback trufflehog.err; then
              echo "::error::TruffleHog failed while scanning commit ${commit:0:9}."
              cat trufflehog.err
              exit 2
            fi

            # Version 2 also matches unchanged context and removed lines, so keep only findings whose
            # secret is on a line this commit adds. Report the path, finding type and commit only: the
            # secret itself never reaches the log.
            hits=$(python3 - "$commit" <<'PY'
          import json, subprocess, sys
          commit = sys.argv[1]
          reported = set()
          for line in open("findings.jsonl", encoding="utf-8"):
              if not line.startswith("{"):
                  continue
              finding = json.loads(line)
              path, reason = finding["path"], finding["reason"]
              if (path, reason) in reported:
                  continue
              diff = subprocess.run(["git", "diff", "--unified=0", f"{commit}^", commit, "--", path],
                                    capture_output=True, text=True, errors="replace").stdout
              added = "\n".join(l[1:] for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++"))
              # Matches can end in the newline that closed them, so compare without surrounding whitespace.
              if not any(s.strip() and s.strip() in added for s in finding["stringsFound"]):
                  continue
              reported.add((path, reason))
              print(f"::error file={path}::TruffleHog found a likely {reason} added in commit {commit[:9]}. "
                    f"Remove it from that commit, not only from the latest change.")
          PY
            )
            if [ -n "$hits" ]; then
              echo "$hits"
              found=$((found + 1))
            fi
          done

          if [ "$found" -gt 0 ]; then
            echo "::error::$found commit(s) add likely secrets. See the annotations above."
            exit 1
          fi
          echo "No likely secrets added."
