name: "Unit Tests"

on:
  #  schedule:
  #    - cron: "0 0 * * *"
  pull_request:
    branches:
      - dev

jobs:
  
  dotnet-unit-tests:
    runs-on: ['windows-latest']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore .NET dependencies
        run: dotnet restore link-cloud.sln
            
      - name: Build .NET solution
        run: dotnet build link-cloud.sln --no-restore
        
      - name: Run .NET tests
        run: dotnet test link-cloud.sln --filter "Category!=SmokeTest" --no-build --verbosity normal --logger "trx;LogFileName=dotnet-unit-test-results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/dotnet-unit-test-results.trx"
  
  java-unit-tests:
    runs-on: ['ubuntu-latest']
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build and Test with Maven
        run: mvn clean test
        working-directory: Java

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/surefire-reports/*.xml"