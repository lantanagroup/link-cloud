name: "Integration Tests"

on:
  pull_request:
    branches:
      - dev  # Adjust to your default branch (e.g., 'master', 'develop')

jobs:
  dotnet-integration-tests:
    runs-on: ubuntu-latest  # Use ubuntu-latest; switch to windows-latest if needed

    steps:
    # Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies for ServiceTests project
    - name: Restore dependencies
      run: dotnet restore DotNet/ServiceTests/ServiceTests.csproj

    # Build the ServiceTests project
    - name: Build
      run: dotnet build DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-restore

    # Run integration tests for ServiceTests project
    - name: Run integration tests
      run: dotnet test DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-build --verbosity normal --logger "trx" --results-directory ./TestResults --filter "FullyQualifiedName~IntegrationTests"
      continue-on-error: true  # Continue even if tests fail

    # Publish test results
    - name: .NET Integration Test Report
      uses: dorny/test-reporter@v2
      if: always()  # Run regardless of previous step outcome
      with:
        name: XUnit Tests
        path: ./TestResults/*.trx  # Match .trx files in TestResults directory
        reporter: dotnet-trx