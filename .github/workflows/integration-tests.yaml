name: "Integration Tests"

on:
  pull_request:
    branches:
      - dev  # Adjust to your default branch (e.g., 'master', 'develop')

jobs:
  dotnet-integration-tests:
    runs-on: windows-latest  # Match Unit Tests workflow environment
    timeout-minutes: 10  # Prevent hanging jobs

    steps:
    # Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies for ServiceTests project
    - name: Restore dependencies
      run: dotnet restore DotNet/ServiceTests/ServiceTests.csproj

    # Build the ServiceTests project
    - name: Build
      run: dotnet build DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-restore

    # Debug: List available tests
    - name: List tests
      run: dotnet test DotNet/ServiceTests/ServiceTests.csproj --list-tests
      continue-on-error: true

    # Run integration tests for ServiceTests project
    - name: Run integration tests
      run: dotnet test DotNet/ServiceTests/ServiceTests.csproj --configuration Release --no-build --verbosity detailed --logger "trx;LogFileName=dotnet-integration-test-results.trx" --results-directory ./TestResults --filter "FullyQualifiedName~IntegrationTests"
      continue-on-error: true  # Continue even if tests fail
      timeout-minutes: 5  # Prevent hanging tests

    # Debug: Check for test results file
    - name: Debug test results
      run: ls -la ./TestResults
      continue-on-error: true

    # Upload test results as artifact for debugging
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: ./TestResults/*.trx

    # Publish test results
    - name: .NET Integration Test Report
      uses: dorny/test-reporter@v2
      if: always()  # Run regardless of previous step outcome
      with:
        name: XUnit Integration Tests
        path: ./TestResults/dotnet-integration-test-results.trx 
        reporter: dotnet-trx