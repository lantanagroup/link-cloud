# _config.yml (put this in the root of /docs if you're using 'docs/' as your site source)
title: Link (Cloud)
description: A site generated with GitHub Pages and Jekyll
remote_theme: jekyll/minima@master

# Optional but helpful
markdown: kramdown
highlighter: rouge

# GitHub Pages-specific
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# Ensure this if your GitHub Pages site is in a subdirectory (like user.github.io/repo/)
baseurl: "/link-cloud"  # replace with your actual repo name, or leave "" if at root

# Let Jekyll know where your source is, if using /docs
# Only needed if _config.yml is in repo root
# source: docs

# Optional: default layout setting (so you don’t need to write layout: default in every file)
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default