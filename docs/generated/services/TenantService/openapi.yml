swagger: "2.0"
info:
  version: 0.4.1
  title: Tenant
paths:
  /api/Facility:
    get:
      tags:
      - Facility
      summary: Get facilities
      operationId: GetFacilities
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: facilityId
        description: ""
        type: string
      - in: query
        name: facilityName
        description: ""
        type: string
      - in: query
        name: sortBy
        description: ""
        type: string
      - in: query
        name: sortOrder
        description: ""
      - in: query
        name: pageSize
        description: ""
        type: integer
        format: int32
        default: 10
      - in: query
        name: pageNumber
        description: ""
        type: integer
        format: int32
        default: 1
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FacilityModelPagedConfigModel'
        "204":
          description: No Content
        "500":
          description: Internal Server Error
    post:
      tags:
      - Facility
      summary: Creates a facility configuration.
      consumes:
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: body
        name: body
        description: ""
        schema:
          $ref: '#/definitions/FacilityModel'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/FacilityModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Facility/list:
    get:
      tags:
      - Facility
      summary: Get a list of all facilities
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties:
              type: string
        "204":
          description: No Content
        "500":
          description: Internal Server Error
  /api/Facility/{facilityId}:
    get:
      tags:
      - Facility
      summary: Gets a facility configuration by facilityId.
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FacilityModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
    put:
      tags:
      - Facility
      summary: Updates a facility configuration.
      consumes:
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: body
        name: body
        description: ""
        schema:
          $ref: '#/definitions/FacilityModel'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FacilityModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
    delete:
      tags:
      - Facility
      summary: Deletes a facility configuration.
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Facility/{facilityId}/AdHocReport:
    post:
      tags:
      - Facility
      summary: Generat
      consumes:
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: body
        name: body
        description: ""
        schema:
          $ref: '#/definitions/AdHocReportRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GenerateAdhocReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Facility/{facilityId}/RegenerateReport:
    post:
      tags:
      - Facility
      consumes:
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        required: true
        type: string
      - in: body
        name: body
        schema:
          $ref: '#/definitions/RegenerateReportRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GenerateAdhocReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/facility/info:
    get:
      tags:
      - Tenant
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ServiceInformation'
  /health:
    get:
      tags:
      - Health
      summary: Health check endpoint
      description: Returns the health status of the service and its dependencies
      produces:
      - application/json
      responses:
        "200":
          description: Healthy
          schema:
            type: object
            properties:
              status:
                description: Overall health status
                type: string
              totalDuration:
                description: Total duration of health checks
                type: string
              entries:
                type: object
                properties:
                  Database:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
                  Kafka:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
        "503":
          description: Unhealthy
          schema:
            type: object
            properties:
              status:
                description: Overall health status
                type: string
              totalDuration:
                description: Total duration of health checks
                type: string
              entries:
                type: object
                properties:
                  Database:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
                  Kafka:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
definitions:
  AdHocReportRequest:
    type: object
    properties:
      bypassSubmission:
        type: boolean
      startDate:
        format: date-time
        type: string
      endDate:
        format: date-time
        type: string
      reportTypes:
        type: array
        items:
          type: string
      patientIds:
        type: array
        items:
          type: string
    additionalProperties: false
  FacilityModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      facilityId:
        type: string
      facilityName:
        type: string
      timeZone:
        type: string
      scheduledReports:
        $ref: '#/definitions/TenantScheduledReportConfig'
    additionalProperties: false
  FacilityModelPagedConfigModel:
    type: object
    properties:
      records:
        type: array
        items:
          $ref: '#/definitions/FacilityModel'
      metadata:
        $ref: '#/definitions/PaginationMetadata'
    additionalProperties: false
  GenerateAdhocReportResponse:
    type: object
    properties:
      reportId:
        type: string
    additionalProperties: false
  PaginationMetadata:
    type: object
    properties:
      pageSize:
        format: int32
        type: integer
      pageNumber:
        format: int32
        type: integer
      totalCount:
        format: int64
        type: integer
      totalPages:
        format: int64
        type: integer
    additionalProperties: false
  ProblemDetails:
    type: object
    properties:
      type:
        type: string
      title:
        type: string
      status:
        format: int32
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: {}
  RegenerateReportRequest:
    type: object
    properties:
      reportId:
        type: string
      bypassSubmission:
        type: boolean
    additionalProperties: false
  ServiceInformation:
    type: object
    properties:
      serviceName:
        type: string
      version:
        type: string
      productVersion:
        type: string
      commit:
        type: string
      build:
        type: string
      swaggerUrl:
        type: string
    additionalProperties: false
  SortOrder:
    format: int32
    enum:
    - 0
    - 1
    type: integer
  TenantScheduledReportConfig:
    type: object
    properties:
      daily:
        type: array
        items:
          type: string
      weekly:
        type: array
        items:
          type: string
      monthly:
        type: array
        items:
          type: string
    additionalProperties: false

