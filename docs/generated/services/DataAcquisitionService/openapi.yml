        "200":
          description: OK
          schema:
            $ref: '#/definitions/DataAcquisitionLogModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
    put:
      tags:
      - Log
