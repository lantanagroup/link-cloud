      - application/json
      - text/json
      parameters:
      - in: query
        name: FacilityId
        type: string
      - in: query
        name: PatientId
        type: string
      - in: query
        name: ReportId
        type: string
      - in: query
        name: ResourceId
        type: string
      - in: query
        name: QueryPhase
      - in: query
        name: QueryType
      - in: query
        name: Status
      - in: query
        name: Priority
      - in: query
        name: PageNumber
        type: integer
        format: int32
        maximum: 2147483647
        minimum: 1
      - in: query
        name: PageSize
        type: integer
        format: int32
        maximum: 100
        minimum: 1
      - in: query
        name: SortBy
        type: string
      - in: query
        name: SortOrder
      responses:
        "200":
          description: Returns a list of data acquisition logs.
          schema:
            $ref: '#/definitions/QueryLogSummaryModelIPagedModel'
        "400":
          description: If the request is invalid.
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: If no data acquisition logs are found.
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: If there is an internal server error.
  /api/data/acquisition-logs/{id}:
