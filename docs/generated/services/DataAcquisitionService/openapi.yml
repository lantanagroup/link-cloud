      description: This endpoint updates a data acquisition log entry.
      consumes:
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: id
        description: The ID of the log entry to update.
        required: true
        type: string
      - in: body
        name: body
        description: The model containing the updated data acquisition log entry.
        schema:
          $ref: '#/definitions/UpdateDataAcquisitionLogModel'
      responses:
        "200":
          description: OK
        "400":
          description: If the ID is null or empty.
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: If the data acquisition log entry is not found.
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: If there is an internal server error.
        "202":
          description: Returns the updated data acquisition log entry.
    delete:
      tags:
      - Log
      summary: Delete a data acquisition log entry.
      description: This endpoint deletes a data acquisition log entry by its ID.
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: id
        description: The ID of the log entry to delete.
        required: true
        type: integer
        format: int64
      responses:
        "204":
          description: If the log entry was successfully deleted.
        "400":
          description: If the ID is null or empty.
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: If the log entry is not found.
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: If there is an internal server error.
