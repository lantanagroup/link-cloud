definitions:
  AcquisitionPriority:
    enum:
    - Critical
    - High
    - Normal
    type: string
  ApiCreateFhirQueryConfigurationModel:
    type: object
    properties:
      facilityId:
        type: string
      fhirServerBaseUrl:
        type: string
      authentication:
        $ref: '#/definitions/AuthenticationConfigurationModel'
      maxConcurrentRequests:
        format: int32
        type: integer
      minAcquisitionPullTime:
        format: date-span
        type: string
      maxAcquisitionPullTime:
        format: date-span
        type: string
      timeZone:
        type: string
    additionalProperties: false
  ApiResultFhirQueryConfigurationModel:
    required:
    - facilityId
    - fhirServerBaseUrl
    - id
    type: object
    properties:
      id:
        type: string
      facilityId:
        type: string
      fhirServerBaseUrl:
        type: string
      authentication:
