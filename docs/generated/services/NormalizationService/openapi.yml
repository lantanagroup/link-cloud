definitions:
  IOperation:
    type: object
    properties:
      operationType:
        $ref: '#/definitions/OperationType'
      name:
        type: string
      description:
        type: string
    additionalProperties: false
  OperationModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      facilityId:
        type: string
      operationJson:
        type: string
      operationType:
        type: string
      name:
        type: string
      description:
        type: string
      isDisabled:
        type: boolean
      createDate:
        format: date-time
        type: string
      modifyDate:
        format: date-time
        type: string
      vendorPresets:
        type: array
        items:
          $ref: '#/definitions/VendorVersionOperationPresetModel'
      operationResourceTypes:
        type: array
        items:
          $ref: '#/definitions/OperationResourceTypeModel'
    additionalProperties: false
  OperationResourceTypeModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      operationId:
        format: uuid
        type: string
      resourceTypeId:
        format: uuid
        type: string
      operation:
        $ref: '#/definitions/OperationModel'
      resource:
        $ref: '#/definitions/ResourceModel'
    additionalProperties: false
  OperationResult:
    description: Result of a copy operation, including status, error message, and modified resource.
    type: object
    properties:
      successCode:
        $ref: '#/definitions/OperationStatus'
      result:
        type: string
        readOnly: true
      errorMessage:
        type: string
      resource:
        type: object
        additionalProperties: {}
    additionalProperties: false
  OperationSequenceModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      facilityId:
        type: string
      sequence:
        format: int32
        type: integer
      createDate:
        format: date-time
        type: string
      modifyDate:
        format: date-time
        type: string
      operationResourceType:
        $ref: '#/definitions/OperationResourceTypeModel'
      vendorPresets:
        type: array
        items:
          $ref: '#/definitions/VendorVersionOperationPresetModel'
    additionalProperties: false
  OperationStatus:
    format: int32
    description: Status of a copy operation.
    enum:
    - 0
    - 1
    - 2
    type: integer
  OperationType:
    format: int32
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    type: integer
  PostOperationModel:
    required:
    - operation
    - resourceTypes
    type: object
    properties:
      resourceTypes:
        type: array
        items:
          type: string
      operation:
        $ref: '#/definitions/IOperation'
      facilityId:
        type: string
      vendorIds:
        type: array
        items:
          format: uuid
          type: string
    additionalProperties: false
  PostOperationSequence:
    required:
    - operationId
    - sequence
    type: object
    properties:
      operationId:
        format: uuid
        type: string
      sequence:
        format: int32
        maximum: 2147483647
        minimum: 1
        type: integer
    additionalProperties: false
  ProblemDetails:
    type: object
    properties:
      type:
        type: string
      title:
        type: string
      status:
        format: int32
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: {}
  PutOperationModel:
    required:
    - id
    - operation
    - resourceTypes
    type: object
    properties:
      id:
        format: uuid
        type: string
      resourceTypes:
        type: array
        items:
          type: string
      operation:
        $ref: '#/definitions/IOperation'
      isDisabled:
        type: boolean
      facilityId:
        type: string
      vendorIds:
        type: array
        items:
          format: uuid
          type: string
    additionalProperties: false
  ResourceModel:
    type: object
    properties:
      resourceTypeId:
        format: uuid
        type: string
      resourceName:
        type: string
    additionalProperties: false
  ServiceInformation:
    type: object
    properties:
      serviceName:
        type: string
      version:
        type: string
      productVersion:
        type: string
      commit:
        type: string
      build:
        type: string
      swaggerUrl:
        type: string
    additionalProperties: false
  SortOrder:
    format: int32
    enum:
    - 0
    - 1
    type: integer
  TestOperationModel:
    required:
    - operation
    - resource
    type: object
    properties:
      operation:
        $ref: '#/definitions/IOperation'
      resource:
        type: object
        additionalProperties: {}
    additionalProperties: false
  VendorModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      name:
        type: string
      versions:
        type: array
        items:
          $ref: '#/definitions/VendorVersionModel'
    additionalProperties: false
  VendorVersionModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      vendorId:
        format: uuid
        type: string
      version:
        type: string
      vendor:
        $ref: '#/definitions/VendorModel'
    additionalProperties: false
  VendorVersionOperationPresetModel:
    type: object
    properties:
      id:
        format: uuid
        type: string
      createDate:
        format: date-time
        type: string
      modifyDate:
        format: date-time
        type: string
      vendorVersionId:
        format: uuid
        type: string
        readOnly: true
      operationResourceTypeId:
        format: uuid
        type: string
        readOnly: true
      operationResourceType:
        $ref: '#/definitions/OperationResourceTypeModel'
      vendorVersion:
