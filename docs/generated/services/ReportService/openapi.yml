swagger: "2.0"
info:
  version: 0.4.1
  title: Report
paths:
  /api/report/info:
    get:
      tags:
      - Report
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ServiceInformation'
  /api/Report/Bundle/Patient:
    get:
      tags:
      - Report
      summary: |-
        Returns a serialized PatientSubmissionModel containing all the Patient level resources and Other resources
        for all measure reports for the provided FacilityId, PatientId, and Reporting Period.
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: facilityId
        description: ""
        type: string
      - in: query
        name: patientId
        description: ""
        type: string
      - in: query
        name: reportScheduleId
        description: ""
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PatientSubmissionModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/Bundle/Manifest:
    get:
      tags:
      - Report
      summary: Returns a report's manifest as a Bundle.
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: facilityId
        type: string
      - in: query
        name: reportScheduleId
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/Submission:
    get:
      tags:
      - Report
      summary: |-
        Returns a report's submission (including patient and manifest bundles).
        Each bundle is serialized as NDJSON.
        The entire submission is returned as a ZIP archive.
      produces:
      - application/zip
      parameters:
      - in: query
        name: facilityId
        type: string
      - in: query
        name: reportScheduleId
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/Schedule:
    get:
      tags:
      - Report
      summary: Returns a summary of a ReportSchedule based on the provided facilityId and reportScheduleId
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: facilityId
        description: ""
        type: string
      - in: query
        name: reportScheduleId
        description: ""
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ReportScheduleSummaryModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/summaries:
    get:
      tags:
      - Report
      summary: Returns a summary list item of a ReportSchedule based on the provided search criteria
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: facilityId
        description: ""
        type: string
      - in: query
        name: pageNumber
        description: ""
        type: integer
        format: int32
        default: 1
      - in: query
        name: pageSize
        description: ""
        type: integer
        format: int32
        default: 10
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ScheduledReportListSummaryPagedConfigModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/summaries/{facilityId}:
    get:
      tags:
      - Report
      summary: Returns a summary of a scheduled report based on the provided reportId
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: query
        name: reportId
        description: ""
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ScheduledReportListSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/summaries/{facilityId}/measure-reports:
    get:
      tags:
      - Report
      summary: Returns a summary list item of a ReportSchedule based on the provided search criteria
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: query
        name: ReportId
        type: string
      - in: query
        name: PatientId
        type: string
      - in: query
        name: MeasureReportId
        type: string
      - in: query
        name: Measure
        type: string
      - in: query
        name: ReportStatus
      - in: query
        name: ValidationStatus
      - in: query
        name: SortBy
        type: string
      - in: query
        name: SortOrder
      - in: query
        name: PageNumber
        type: integer
        format: int32
      - in: query
        name: PageSize
        type: integer
        format: int32
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MeasureReportSummaryPagedConfigModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/summaries/{facilityId}/measure-reports/{reportId}/resources:
    get:
      tags:
      - Report
      summary: Returns a summary list item of a ReportSchedule based on the provided search criteria
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: path
        name: reportId
        description: ""
        required: true
        type: string
      - in: query
        name: resourceType
        description: ""
      - in: query
        name: pageNumber
        description: ""
        type: integer
        format: int32
        default: 1
      - in: query
        name: pageSize
        description: ""
        type: integer
        format: int32
        default: 10
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ResourceSummaryPagedConfigModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/summaries/{facilityId}/measure-reports/{reportId}/resource-types:
    get:
      tags:
      - Report
      summary: Returns a list of unique resouces types contained in a measure report
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: path
        name: reportId
        description: ""
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/report-submission-statuses:
    get:
      tags:
      - Report
      summary: Returns a list of possible report submission statuses
      produces:
      - text/plain
      - application/json
      - text/json
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/report-validation-statuses:
    get:
      tags:
      - Report
      summary: Returns a list of possible report validation statuses
      produces:
      - text/plain
      - application/json
      - text/json
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Report/{facilityId}/{reportId}/patient:
    get:
      tags:
      - Report
      summary: Returns a list of unique resouces types contained in a measure report
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: path
        name: facilityId
        description: ""
        required: true
        type: string
      - in: path
        name: reportId
        description: ""
        required: true
        type: string
      - in: query
        name: page
        description: ""
        type: integer
        format: int32
        default: 1
      - in: query
        name: count
        description: ""
        type: integer
        format: int32
        default: 10
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
        "500":
          description: Internal Server Error
  /health:
    get:
      tags:
      - Health
      summary: Health check endpoint
      description: Returns the health status of the service and its dependencies
      produces:
      - application/json
      responses:
        "200":
          description: Healthy
          schema:
            type: object
            properties:
              status:
                description: Overall health status
                type: string
              totalDuration:
                description: Total duration of health checks
                type: string
              entries:
                type: object
                properties:
                  Database:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
                  Kafka:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
        "503":
          description: Unhealthy
          schema:
            type: object
            properties:
              status:
                description: Overall health status
                type: string
              totalDuration:
                description: Total duration of health checks
                type: string
              entries:
                type: object
                properties:
                  Database:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
                  Kafka:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
definitions:
  Frequency:
    enum:
    - Discharge
    - Daily
    - Weekly
    - Monthly
    - Adhoc
    type: string
  MeasureReportSummary:
    required:
    - id
    - patientId
    - reportScheduleId
    type: object
    properties:
      id:
        type: string
      patientId:
        type: string
      reportType:
        type: string
      status:
        type: string
      validationStatus:
        type: string
      resourceCount:
        format: int32
        type: integer
      reportScheduleId:
        type: string
      resourceCountSummary:
        type: object
        additionalProperties:
          format: int32
          type: integer
    additionalProperties: false
  MeasureReportSummaryPagedConfigModel:
    type: object
    properties:
      records:
        type: array
        items:
          $ref: '#/definitions/MeasureReportSummary'
      metadata:
        $ref: '#/definitions/PaginationMetadata'
    additionalProperties: false
  PaginationMetadata:
    type: object
    properties:
      pageSize:
        format: int32
        type: integer
      pageNumber:
        format: int32
        type: integer
      totalCount:
        format: int64
        type: integer
      totalPages:
        format: int64
        type: integer
    additionalProperties: false
  PatientSubmissionModel:
    type: object
    properties:
      facilityId:
        type: string
      patientId:
        type: string
      reportScheduleId:
        type: string
      startDate:
        format: date-time
        type: string
      endDate:
        format: date-time
        type: string
      bundle:
        type: object
        additionalProperties: {}
    additionalProperties: false
  PatientSubmissionStatus:
    format: int32
    enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    type: integer
  ProblemDetails:
    type: object
    properties:
      type:
        type: string
      title:
        type: string
      status:
        format: int32
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: {}
  ReportScheduleSummaryModel:
    type: object
    properties:
      reportId:
        type: string
      facilityId:
        type: string
      startDate:
        format: date-time
        type: string
      endDate:
        format: date-time
        type: string
      submitReportDateTime:
        format: date-time
        type: string
      measures:
        type: array
        items:
          type: string
    additionalProperties: false
  ResourceSummary:
    type: object
    properties:
      facilityId:
        type: string
      measureReportId:
        type: string
      patientId:
        type: string
      resourceId:
        type: string
      fhirId:
        type: string
      resourceType:
        $ref: '#/definitions/ResourceType'
      resourceCategory:
        type: string
      reference:
        type: string
        readOnly: true
    additionalProperties: false
  ResourceSummaryPagedConfigModel:
    type: object
    properties:
      records:
        type: array
        items:
          $ref: '#/definitions/ResourceSummary'
      metadata:
        $ref: '#/definitions/PaginationMetadata'
    additionalProperties: false
  ResourceType:
    format: int32
    enum:
