swagger: "2.0"
info:
  version: 0.4.1
  title: Submission
paths:
  /api/submission/info:
    get:
      tags:
      - Submission
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ServiceInformation'
  /api/Submission/{facilityId}/{reportId}:
    get:
      tags:
      - Submission
      description: Gets information about the report from the report service in order to construct the directory/path for the report.
      parameters:
      - in: path
        name: facilityId
        description: The ID of the facility
        required: true
        type: string
      - in: path
        name: reportId
        description: The ID of the report to download
        required: true
        type: string
      - in: query
        name: external
        description: Whether to download from external or internal (default) storage
        type: boolean
        default: false
      responses:
        "200":
          description: OK
  /health:
    get:
      tags:
      - Health
      summary: Health check endpoint
      description: Returns the health status of the service and its dependencies
      produces:
      - application/json
      responses:
        "200":
          description: Healthy
          schema:
            type: object
            properties:
              status:
                description: Overall health status
                type: string
              totalDuration:
                description: Total duration of health checks
                type: string
              entries:
                type: object
                properties:
                  Database:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
                  Kafka:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
        "503":
          description: Unhealthy
          schema:
            type: object
            properties:
              status:
                description: Overall health status
                type: string
              totalDuration:
                description: Total duration of health checks
                type: string
              entries:
                type: object
                properties:
                  Database:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
                  Kafka:
                    type: object
                    properties:
                      status:
                        type: string
                      description:
                        type: string
                      duration:
                        type: string
                      data:
                        type: object
definitions:
  ServiceInformation:
    type: object
    properties:
      serviceName:
        type: string
      version:
        type: string
      productVersion:
        type: string
      commit:
        type: string
      build:
        type: string
      swaggerUrl:
        type: string
    additionalProperties: false

