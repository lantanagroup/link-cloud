openapi: 3.0.1
info:
  version: 0.2.0
  title: Normalization
paths:
  /api/normalization/operations:
    get:
      tags:
      - Search Operations
      parameters:
      - name: operationType
        in: query
        schema:
          type: string
      - name: facilityId
        in: query
        schema:
          type: string
      - name: resourceType
        in: query
        schema:
          type: string
      - name: operationId
        in: query
        schema:
          type: string
          format: uuid
      - name: includeDisabled        
        in: query
        schema:
          type: boolean
      - name: vendorId
        in: query
        schema:
          type: guid
      - name: sortBy
        in: query
        schema:
          type: string
      - name: sortOrder
        in: query
        schema:
          type: SortOrder
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationModel'
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/normalization/operations/facility/{facilityId}:
    get:
      tags:
      - Operations
      parameters:
      - name: operationType
        in: query
        schema:
          type: string
      - name: facilityId
        in: query
        schema:
          type: string
      - name: resourceType
        in: query
        schema:
          type: string
      - name: operationId
        in: query
        schema:
          type: guid
      - name: includeDisabled        
        in: query
        schema:
          type: boolean
      - name: vendorId
        in: query
        schema:
          type: guid
      - name: sortBy
        in: query
        schema:
          type: string
      - name: sortOrder
        in: query
        schema:
          type: SortOrder
      - name: pageSize
        in: query
        schema:
          type: int
      - name: pageNumber
        in: query
        schema:
          type: int
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationModel'
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "500":
          description: Internal Server Error
    post:
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostOperationModel'
          text/json:
            schema:
              $ref: '#/components/schemas/PostOperationModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PostOperationModel'
      responses:
        "201":
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OperationModel'
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "500":
          description: Internal Server Error
    put:
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOperationModel'
          text/json:
            schema:
              $ref: '#/components/schemas/PutOperationModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PutOperationModel'
      responses:
        "202":
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OperationModel'
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "500":
          description: Internal Server Error
    delete:
      tags:
        - Operations
      parameters:
        - name: resourceType
          in: query
          schema:
            type: string
        - name: operationId
          in: query
          schema:
            type: string
  /api/Normalization/Operations/test:
    post:
      tags:
      - Test Operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestOperationModel'
          text/json:
            schema:
              $ref: '#/components/schemas/TestOperationModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TestOperationModel'
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OperationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/Normalization/Operations/{id}/test:
    post:
      tags:
      - Test Operation
      requestBody:
        content:
          application/json:
            schema:
              properties:
                Resource:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  Resource:
                    type: string
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "500":
          description: Internal Server Error
  /api/normalization/operations/vendor/{vendor}:
      get:
        description: Retrieve normalization operations for a specific vendor.
        tags:
        - Vendor Operations
        parameters:
          - name: vendor
            in: path
            required: true
            description: The vendor identifier (e.g., Epic).
            schema:
              type: string
          - name: operationType
            in: query
            required: false
            description: Filter by operation type (e.g., CopyProperty).
            schema:
              type: string
          - name: resourceType
            in: query
            required: false
            description: Filter by FHIR resource type (e.g., Location).
            schema:
              type: string
          - name: includeDisabled
            in: query
            required: false
            description: Whether to include disabled operations.
            schema:
              type: boolean
          - name: operationId
            in: query
            required: false
            description: Filter by a specific operation ID (UUID).
            schema:
              type: string
              format: uuid
      delete:
        description: Delete a specific normalization operation for a given vendor.
        tags:
          - Vendor Operations
        parameters:
          - name: vendor
            in: path
            required: true
            description: The vendor identifier (UUID or string).
            schema:
              type: string
          - name: operationId
            in: query
            required: false
            description: The ID of the operation to delete.
            schema:
              type: string
              format: uuid
          - name: resourceType
            in: query
            required: false
            description: Optionally filter by FHIR resource type.
            schema:
              type: string            
      post:
        tags:
          - Vendor Operations
        description: Create or update a vendor definition.
        parameters:
          - name: vendor
            in: path
            required: true
            description: Vendor name.
            schema:
              type: string
        requestBody:
          required: false
          content:
            application/json:
              schema:
                type: object
                description: Vendor details payload.          
  /api/normalization/vendor/vendors:
    get:
      tags:
        - Vendor Operations
      description: Retrieve a list of all vendors.

  /api/normalization/vendor/presets/{vendor}:
    get:
      tags:
        - Vendor Operations
      description: Retrieve presets associated with a given vendor.
      parameters:
        - name: vendor
          in: path
          required: true
          description: Vendor name.
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: Optional resource filter (e.g., Location).
          schema:
            type: string

  /api/normalization/vendor/presets/{vendor}/{presetId}:
    get:
      tags:
        - Vendor Operations
      description: Retrieve details about a specific vendor preset.
      parameters:
        - name: vendor
          in: path
          required: true
          description: Vendor name.
          schema:
            type: string
        - name: presetId
          in: path
          required: true
          description: Preset ID.
          schema:
            type: string
            format: uuid
    delete:
      tags:
        - Vendor Operations
      description: Delete a specific preset for a vendor.
      parameters:
        - name: vendor
          in: path
          required: true
          description: Vendor name.
          schema:
            type: string
        - name: presetId
          in: path
          required: true
          description: Preset ID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Preset deleted successfully. No content returned.
        '404':
          description: Preset not found.

  /api/normalization/vendor/presets:
    post:
      tags:
        - Vendor Operations
      description: Create a new vendor preset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - VendorId
                - OperationResourceTypeId
              properties:
                VendorId:
                  type: string
                  format: uuid
                OperationResourceTypeId:
                  type: string
                  format: uuid

  /api/normalization/OperationSequence:
    get:
      tags:
        - Operation Sequence
      description: Retrieve the sequence of normalization operations for a facility and resource type.
      parameters:
        - name: FacilityId
          in: query
          required: true
          description: Identifier of the facility.
          schema:
            type: string
        - name: ResourceType
          in: query
          required: true
          description: FHIR resource type (e.g., Location, Encounter).
          schema:
            type: string
        - name: ResourceTypeId
          in: query
          required: false
          description: Optional identifier of the resource type.
          schema:
            type: string
    post:
      tags:
        - Operation Sequence
      description: Set or update the sequence of normalization operations for a facility and resource type.
      parameters:
        - name: FacilityId
          in: query
          required: true
          description: Identifier of the facility.
          schema:
            type: string
        - name: ResourceType
          in: query
          required: true
          description: FHIR resource type (e.g., Location, Encounter).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - OperationId
                  - Sequence
                properties:
                  OperationId:
                    type: string
                    format: uuid
                  Sequence:
                    type: integer
    delete:
      tags:
        - Operation Sequence
      description: Delete operation sequences for a facility and resource type.
      parameters:
        - name: FacilityId
          in: query
          required: true
          description: Identifier of the facility.
          schema:
            type: string
        - name: ResourceType
          in: query
          required: true
          description: FHIR resource type (e.g., Location, Encounter).
          schema:
            type: string
      responses:
        '204':
          description: Operation sequences deleted successfully. No content returned.
        '400':
          description: Bad request.
        '404':
          description: Sequence not found.
  schemas:
    INormalizationOperation:
      type: object
      additionalProperties: false
    IOperation:
      type: object
      properties:
        OperationType:
          $ref: '#/components/schemas/OperationType'
      additionalProperties: false
    NormalizationConfig:
      type: object
      properties:
        Id:
          type: string
          nullable: true
        CreateDate:
          type: string
          format: date-time
        ModifyDate:
          type: string
          format: date-time
          nullable: true
        FacilityId:
          type: string
          nullable: true
        OperationSequence:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/INormalizationOperation'
          nullable: true
      additionalProperties: false
    NormalizationConfigModel:
      type: object
      properties:
        FacilityId:
          type: string
          nullable: true
        OperationSequence:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/INormalizationOperation'
          nullable: true
      additionalProperties: false
    OperationModel:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        FacilityId:
          type: string
          nullable: true
        OperationJson:
          type: string
          nullable: true
        OperationType:
          type: string
          nullable: true
        Description:
          type: string
          nullable: true
        IsDisabled:
          type: boolean
        CreateDate:
          type: string
          format: date-time
        ModifyDate:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    OperationResult:
      type: object
      properties:
        SuccessCode:
          $ref: '#/components/schemas/OperationStatus'
        ErrorMessage:
          type: string
          nullable: true
        Resource:
          type: object
          additionalProperties: {}
          nullable: true
      additionalProperties: false
      description: Result of a copy operation, including status, error message, and modified resource.
    OperationStatus:
      enum:
      - 0
      - 1
      type: integer
      description: Status of a copy operation.
      format: int32
    OperationType:
      enum:
      - CopyProperty
      - CopyLocation
      - ConditionalTransform
      - CodeMap
      type: string
    PostOperationModel:
      required:
      - Operation
      - ResourceTypes
      type: object
      properties:
        ResourceTypes:
          type: array
          items:
            type: string
        Operation:
          $ref: '#/components/schemas/IOperation'
        FacilityId:
          type: string
          nullable: true
        VendorIds:
          type: array
          items:
            type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    PutOperationModel:
      required:
      - Id
      - IsDisabled
      - Operation
      - ResourceTypes
      type: object
      properties:
        Id:
          type: string
          format: uuid
        ResourceTypes:
          type: array
          items:
            type: string
        Operation:
          $ref: '#/components/schemas/IOperation'
        IsDisabled:
          type: boolean
        FacilityId:
          type: string
          nullable: true
        Description:
          type: string
          nullable: true
      additionalProperties: false
    TestOperationModel:
      required:
      - Resource
      - ResourceType
      type: object
      properties:
        ResourceType:
          minLength: 1
          type: string
        Operation:
          $ref: '#/components/schemas/IOperation'
        Resource:
          minLength: 1
          type: string
      additionalProperties: false

