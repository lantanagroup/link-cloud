openapi: 3.0.1
info:
  title: Measure Evaluation Service
  description: Service for evaluating measures against clinical data.
  license:
    name: Apache 2.0
  version: dev
servers:
  - url: http://localhost:8067
    description: Generated server url
paths:
  /api/measureeval/measure-definition:
    get:
      tags:
        - Measure Definitions
      summary: Get all measure definitions
      operationId: getAll
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasureDefinition_Summary'
    put:
      tags:
        - Measure Definitions
      summary: Put (create or update) a measure definition
      operationId: put
      requestBody:
        content:
          application/json: {}
        required: true
      responses:
        '200':
          description: OK
          content: {}
  /api/measureeval/measure-definition/{id}/$evaluate:
    post:
      tags:
        - Measure Definitions
      summary: Evaluate a measure against data in request body
      operationId: evaluate
      parameters:
        - name: id
          in: path
          description: The ID of the measure definition
          required: true
          schema:
            type: string
        - name: debug
          in: query
          description: Whether to log CQL debugging information during evaluation
          required: false
          schema:
            type: boolean
            default: false
        - name: parameters
          in: query
          description: The parameters to use in the evaluation
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parameters'
        required: true
      responses:
        '200':
          description: OK
          content: {}
  /api/measureeval/patient/{facilityId}/{reportId}/{patientId}:
    get:
      tags:
        - patient-controller
      operationId: getPatientData
      parameters:
        - name: facilityId
          in: path
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          required: true
          schema:
            type: string
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content: {}
  /api/measureeval/measure-definition/{id}:
    get:
      tags:
        - Measure Definitions
      summary: Get a measure definition
      operationId: getOne
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content: {}
  /api/measureeval/measure-definition/{id}/{library-id}/$cql:
    get:
      tags:
        - Measure Definitions
      summary: Get the CQL for a measure definition's library
      operationId: getMeasureLibraryCQL
      parameters:
        - name: id
          in: path
          description: The ID of the measure definition
          required: true
          schema:
            type: string
        - name: library-id
          in: path
          description: The ID of the library in the measure definition
          required: true
          schema:
            type: string
        - name: range
          in: query
          description: The range of the CQL to return (e.g. 37:1-38:22)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/measureeval/measure-definition/{id}/relatedArtifact:
    get:
      tags:
        - Measure Definitions
      summary: Get related artifacts for a measure definition
      operationId: getRelatedArtifacts
      parameters:
        - name: id
          in: path
          description: The ID of the measure definition
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatedArtifactInfo'
  /api/measureeval/info:
    get:
      tags:
        - api-info-controller
      operationId: info
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceInformationConfig'
