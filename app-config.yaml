$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Link App Configuration Registry"
description: "Enumerates all required application configuration keys needed to run the system in any deployed environment."
type: "object"
properties:
  global:
    type: "array"
    description: "Configurations shared across most or all services."
    items:
      $ref: "#/$defs/configEntry"
  services:
    type: "object"
    description: "Configurations specific to individual services."
    additionalProperties:
      type: "array"
      items:
        $ref: "#/$defs/configEntry"
  serviceMeta:
    type: "object"
    description: "Per-service deployment facts: the Azure App Configuration label the running service selects, and which runtime it is. Tooling reads this rather than hardcoding the mapping."
    additionalProperties:
      $ref: "#/$defs/serviceMetaEntry"
  environments:
    type: "object"
    description: "The environments this catalog is checked against, keyed by the suffix of their export file (Config/app-config.<key>.json). Declared here so adding a store is one line plus its export rather than four hardcoded lists."
    additionalProperties:
      $ref: "#/$defs/environmentEntry"
required:
  - "global"
  - "services"
  - "serviceMeta"
  - "environments"

# Label values are hardcoded in the services themselves and must match exactly:
#   .NET  - a compile-time constant passed to AddExternalConfiguration(), e.g.
#           LinkAdminConstants.ServiceName = "LinkAdminBFF"
#           (DotNet/Shared/Application/Extensions/ExternalConfigurationExtension.cs:61)
#   Java  - the label-filter in bootstrap.yml, e.g. ',MeasureEval'
#           (Java/measureeval/src/main/resources/bootstrap.yml:9)
# Each service selects unlabeled keys first, then its own label, so a labeled row
# overrides an unlabeled one for that service only. Changing a label requires a redeploy.
# The environments every required: true key must be present in. Each key is the suffix of its
# export file, so `qa2` means Config/app-config.qa2.json. A declared environment with no export
# is an error, not a quietly smaller check.
#
# The store names are not consistently spelled. dev is `nhsnlink`; qa, qa2 and test are
# `nhnslink`, with the middle letters transposed. That is in the actual Azure resource names,
# so anything addressing a store must use it verbatim. The Key Vaults spell it the other way
# again (`nhsnlink-kv-*`), and dev's vault does not follow the pattern at all.
environments:
  dev:  { store: "nhsnlink-ac-dev",  keyVault: "link-vault" }
  qa:   { store: "nhnslink-ac-qa",   keyVault: "nhsnlink-kv-qa" }
  test: { store: "nhnslink-ac-test", keyVault: "nhsnlink-kv-test" }
  # nhnslink-ac-qa2 exists in Azure but holds no key-values yet, so listing it here would
  # report all 95 required keys as missing - true, but not actionable until LEGLINK-775
  # imports into it. Add it with its first export, in that change:
  #   qa2: { store: "nhnslink-ac-qa2", keyVault: "nhsnlink-kv-qa2" }
  # The keyVault above is inferred from the qa/test pattern; confirm it from the keyvaultref
  # values in the export rather than trusting the guess.

serviceMeta:
  Account:               { label: "Account",               runtime: "dotnet" }
  AdminBFF:              { label: "LinkAdminBFF",          runtime: "dotnet" }
  Audit:                 { label: "Audit",                 runtime: "dotnet" }
  AutomationUI:          { label: "Link Automation UI",    runtime: "dotnet" }
  Census:                { label: "Census",                runtime: "dotnet" }
  DataAcquisition:       { label: "DataAcquisition",       runtime: "dotnet" }
  DataAcquisitionWorker: { label: "DataAcquisitionWorker", runtime: "dotnet" }
  MeasureEval:           { label: "MeasureEval",           runtime: "java" }
  MockDmrpApi:           { label: "MockDmrpApi",           runtime: "dotnet" }
  Normalization:         { label: "Normalization",         runtime: "dotnet" }
  Notification:          { label: "Notification",          runtime: "dotnet" }
  QueryDispatch:         { label: "QueryDispatch",         runtime: "dotnet" }
  Report:                { label: "Report",                runtime: "dotnet" }
  Submission:            { label: "Submission",            runtime: "dotnet" }
  Tenant:                { label: "Tenant",                runtime: "dotnet" }
  Terminology:           { label: "Terminology",           runtime: "dotnet" }
  Validation:            { label: "Validation",            runtime: "java" }

global:
  - key: "KafkaConnection:BootstrapServers"
    description: "Comma-separated list of Kafka bootstrap servers for event messaging."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "KafkaConnection:SaslUsername"
    description: "The SASL username for authenticating to Kafka. Read by every .NET service through the shared Kafka wiring."
    required: true
    sensitive: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "KafkaConnection:SaslPassword"
    description: "The SASL password for authenticating to Kafka. Read by every .NET service through the shared Kafka wiring."
    required: true
    sensitive: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  # SASL_PLAINTEXT is deliberate, and is catalogued so review tooling stops proposing SASL_SSL.
  # Three things would all have to change together first:
  #   1. The brokers have no TLS listener. docker-compose maps every listener to SASL_PLAINTEXT,
  #      and the deployed Strimzi clusters are addressed on :9092, the plain listener (:9093 is
  #      TLS). A SASL_SSL client against a plaintext listener fails the handshake outright.
  #   2. The client has no TLS surface. KafkaConnection.cs sets SecurityProtocol, SaslUsername,
  #      SaslPassword and SaslMechanism only - there is no SslCaLocation or truststore setting
  #      anywhere in either runtime.
  #   3. The bootstrap address is a Kubernetes internal service name
  #      (kafka-kafka-bootstrap.kafka-<env>), so this is pod-to-pod traffic on the cluster
  #      network, not an exposed endpoint.
  # The residual risk is real but not fixable here: SCRAM credentials cross the cluster network
  # unencrypted, so a compromised pod could capture them. Hardening that is a broker-and-code
  # change, and these values move last, not first.
  - key: "KafkaConnection:Protocol"
    description: "Confluent.Kafka SecurityProtocol for the .NET clients. SaslPlaintext today; see the note above before changing it."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "KafkaConnection:Mechanism"
    description: "Confluent.Kafka SaslMechanism for the .NET clients. ScramSha512, matching the brokers' SCRAM-SHA-512 credentials."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "KafkaConnection:SaslProtocolEnabled"
    description: "Whether the .NET clients send SASL credentials at all. When false, KafkaConnection.CreateConsumerConfig/CreateProducerConfig skip the security protocol, username, password and mechanism entirely, producing an unauthenticated connection."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "DatabaseProvider"
    description: "The database provider to use. SqlServer is the only value the code handles; the key exists for a future provider swap."
    required: false
    defaultValue: "SqlServer"
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "ConnectionStrings:DatabaseConnection"
    description: "The connection string for the primary service database."
    required: true
    sensitive: true
    consumers: ["Account", "Audit", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]

  # Automation.UI inbound-auth coordination note:
  # In Automation.UI Program.cs, the anonymous-access short-circuit middleware runs
  # before UseAuthentication(). When Authentication:EnableAnonymousAccess is false,
  # every non-/health request is returned as 503 before bearer-token validation can run.
  # To make ApiBearer-protected endpoints reachable, EnableAnonymousAccess and
  # Authentication:ApiBearer:Enabled must be configured together for the target environment.
  # Canonical key path is Authentication:ApiBearer:* (not top-level ApiBearer:*).
  - key: "Authentication:Schemas:LinkBearer:Authority"
    description: "The OIDC authority URL used for validating bearer tokens."
    required: true
    consumers: ["Account", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "Authentication:EnableAnonymousAccess"
    description: "Whether services skip authentication. The effect differs by consumer and the polarity is easy to misread. In the eleven backend services, false registers UseAuthentication() and UserScopeMiddleware, so true serves requests without authenticating them. Admin.BFF additionally stops attaching a bearer token to its downstream service calls and drops the YARP authorization transforms. Automation.UI is the exception: it has no built-in authentication, so false makes it serve nothing - every non-/health request is short-circuited with 503 - and true serves the UI anonymously, intended only behind an authenticating proxy. Must be true for requests to reach UseAuthentication()/ApiBearer policy evaluation in Automation.UI; see the note above."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "Authentication:ApiBearer:Enabled"
    description: "Boolean flag that enables inbound API bearer-token validation in Automation.UI for /api/runs endpoints."
    required: true
    consumers: ["AutomationUI"]
  - key: "Authentication:ApiBearer:Authority"
    description: "OIDC authority URL for validating inbound Automation.UI API bearer tokens. Required when Authentication:ApiBearer:Enabled is true."
    required: true
    consumers: ["AutomationUI"]
  - key: "Authentication:ApiBearer:Audience"
    description: "Expected audience for inbound Automation.UI API bearer tokens. Required when Authentication:ApiBearer:Enabled is true."
    required: true
    consumers: ["AutomationUI"]
  - key: "LinkTokenService:Authority"
    description: "The authority URL used by the LinkTokenService for internal token generation and validation."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "LinkTokenService:SigningKey"
    description: "The secret key used for signing internal tokens. Must be kept secure."
    required: true
    sensitive: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "Logging:HmacKey"
    description: "The HMAC key used to pseudonymise identifiers before they reach the logs. Read by Account, Admin BFF, Audit and Notification."
    required: true
    sensitive: true
    consumers: ["Account", "AdminBFF", "Audit", "Notification"]
  # Security posture, and the stores currently contradict the shipped default: appsettings.json
  # ships Enabled: true, every store sets it to False, and App Configuration outranks the file.
  # With it off, Admin.BFF caches the serialized Account - email, name, roles and claims - into
  # Redis unencrypted (LinkClaimsTransformer.cs:65-95). Catalogued so the divergence is visible
  # rather than buried in a store nobody diffs.
  - key: "DataProtection:Enabled"
    description: "Whether ASP.NET Data Protection encrypts values before they are cached. When false, Admin.BFF writes the serialized Account to the shared cache as plain JSON. Set to False in all three stores today, overriding the true shipped in appsettings.json."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "DataProtection:KeyRing"
    description: "The Data Protection key ring name, used to scope keys so services sharing a store do not read each other's protected payloads. Only meaningful when DataProtection:Enabled is true."
    required: true
    consumers: ["Account", "AdminBFF", "DataAcquisition", "DataAcquisitionWorker"]
  - key: "Telemetry:EnableTelemetry"
    description: "Boolean flag to enable or disable OpenTelemetry tracing and metrics."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
    
  # Serilog's WriteTo is an array, so sinks are addressed positionally, not by name. Index 1
  # is GrafanaLoki because every appsettings.json orders the array [GrafanaLoki, Console] and
  # the stores overlay WriteTo:0:Name=Console / WriteTo:1:Name=GrafanaLoki, which .NET merges
  # by index. Reordering that array in any service silently moves this setting.
  # No consumers listed: Serilog reads its own configuration section, so there is no call site
  # for the extractor to attribute and no service to name. Every .NET service ships Serilog.
  - key: "Serilog:WriteTo:1:Args:uri"
    description: "The endpoint URI for the Grafana Loki log aggregator."
    required: true
  # Read by logback-spring.xml via <springProperty>, not by any @ConfigurationProperties
  # class, so a scan of the Java binding classes alone reports it as dead. It is not.
  - key: "loki.app"
    description: "The application label attached to log lines shipped to Loki by the Java services."
    required: false
    runtime: "java"
    defaultValue: "link-cloud"
    consumers: ["MeasureEval", "Validation"]
  - key: "authentication.signing-key"
    description: "Java-side signing key for internal Link tokens, the counterpart to LinkTokenService:SigningKey. Read by MeasureEval and Validation."
    required: true
    sensitive: true
    runtime: "java"
    consumers: ["MeasureEval", "Validation"]
  - key: "internal-blob-storage.connection-string"
    description: "Java-side connection string for the internal blob container, the counterpart to InternalBlobStorage:ConnectionString. Read by MeasureEval and Validation."
    required: true
    sensitive: true
    runtime: "java"
    consumers: ["MeasureEval", "Validation"]
  # The Java half of the Kafka client security settings, mirroring the KafkaConnection:* keys
  # above - see the SASL_PLAINTEXT note there before changing either side. None of the three
  # lists consumers, for the same reason as Serilog: Spring Boot binds spring.kafka.* itself,
  # so no Link class reads them. Both Java services authenticate to Kafka with them.
  - key: "spring.kafka.properties.sasl.jaas.config"
    description: "The JAAS login module configuration Spring Kafka uses to authenticate to Kafka. Bound by Spring Boot auto-configuration, not by any Link class, and commented out in application.yml so the store is its only source."
    required: true
    sensitive: true
    runtime: "java"
  - key: "spring.kafka.properties.security.protocol"
    description: "Spring Kafka security protocol, the Java counterpart to KafkaConnection:Protocol. SASL_PLAINTEXT today; the two must stay in step or the runtimes disagree about how to reach the same brokers."
    required: true
    runtime: "java"
  - key: "spring.kafka.properties.sasl.mechanism"
    description: "Spring Kafka SASL mechanism, the Java counterpart to KafkaConnection:Mechanism. SCRAM-SHA-512, spelled in Kafka's convention rather than Confluent.Kafka's ScramSha512."
    required: true
    runtime: "java"
  # CORS. The unlabeled rows are the platform default that the eleven backend services apply;
  # Admin.BFF overrides them under its own label because it is the only one a browser calls
  # directly. Automation.UI reads this section but never registers a CORS policy, so nothing
  # it holds affects that service.
  #
  # AllowAllOrigins and AllowCredentials are a pair, and the combination is the trap. The
  # shared builder does not emit a wildcard when AllowAllOrigins is true - CorsServiceExtension
  # calls SetIsOriginAllowed(_ => true), which reflects the caller's own Origin header back.
  # That is legal alongside Access-Control-Allow-Credentials, so the browser does not block it
  # and nothing throws; any site could then make credentialed cross-origin requests and read
  # the responses. Both are false on the unlabeled rows for that reason. Admin.BFF keeps
  # AllowCredentials true, which is correct because it pairs it with an explicit AllowedOrigins
  # list rather than reflection.
  - key: "CORS:AllowAllOrigins"
    description: "Whether any origin is accepted. When true the shared builder reflects the caller's Origin header rather than emitting a wildcard, which is legal with credentials and therefore dangerous when paired with them. False on the unlabeled rows; Admin.BFF sets it false and lists origins explicitly."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "CORS:AllowCredentials"
    description: "Whether cross-origin requests may carry cookies or TLS client certificates. False on the unlabeled rows: the backend services are reached server-side through Admin.BFF, so no browser sends them credentials. Admin.BFF sets it true, paired with an explicit AllowedOrigins list."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "CORS:AllowAllMethods"
    description: "Whether any HTTP method is accepted. When false the service uses AllowedMethods, falling back to a built-in default list."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "CORS:AllowAllHeaders"
    description: "Whether any request header is accepted. When false the service uses AllowedHeaders, falling back to a built-in default list."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "CORS:AllowedExposedHeaders"
    description: "Response headers a browser may read cross-origin. Stored element by element (CORS:AllowedExposedHeaders:0). X-Pagination, so paged responses expose their metadata."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "CORS:MaxAge"
    description: "Preflight cache lifetime in seconds."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "Census", "DataAcquisition", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "ConnectionStrings:Redis"
    description: "The Redis connection string. The password is supplied separately via Redis:Password. Required for distributed locks and Redis/Hybrid resource caching in DataAcquisition and DataAcquisitionWorker."
    required: true
    consumers: ["Account", "AdminBFF", "DataAcquisition", "DataAcquisitionWorker"]
  - key: "Redis:Password"
    description: "The password for the Redis instance addressed by ConnectionStrings:Redis. Supplied separately because that key holds only host:port."
    required: true
    sensitive: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant", "Terminology"]
  - key: "InternalBlobStorage:ConnectionString"
    description: "The connection string for the internal Azure Blob Storage (or Azurite)."
    required: true
    sensitive: true
    consumers: ["Report", "Submission", "AutomationUI"]
  - key: "InternalBlobStorage:BlobContainerName"
    description: "The name of the blob container used for internal storage."
    required: true
    consumers: ["Report", "Submission", "AutomationUI"]
  - key: "InternalBlobStorage:BlobRoot"
    description: "Optional blob-path prefix used by services writing internal artifacts to Azure Blob Storage. Automation.UI imported bundles default to automation/imported-bundles when this is unset."
    required: false
    defaultValue: "automation/imported-bundles"
    consumers: ["Report", "Submission", "AutomationUI"]
  - key: "InternalBlobStorage:GeneratedTemplateBlobRoot"
    description: "Optional blob-path prefix used by Automation.UI for generated template cache blobs. When unset, generated templates are written at the container root under generated-patient-templates."
    required: false
    defaultValue: "automation/generated-bundles"
    consumers: ["AutomationUI"]
  - key: "ServiceRegistry:TenantService:TenantServiceUrl"
    description: "The base URL for the Tenant Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:AccountServiceUrl"
    description: "The base URL for the Account Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:ReportServiceUrl"
    description: "The base URL for the Report Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:MeasureServiceUrl"
    description: "The base URL for the Measure Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:CensusServiceUrl"
    description: "The base URL for the Census Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:DataAcquisitionServiceUrl"
    description: "The base URL for the Data Acquisition Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:AdminBffServiceUrl"
    description: "The base URL for the Admin BFF service used by Automation.UI and LinkSdk Admin.BFF integration calls."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:NormalizationServiceUrl"
    description: "The base URL for the Normalization Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:ValidationServiceUrl"
    description: "The base URL for the Validation Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:SubmissionServiceUrl"
    description: "The base URL for the Submission Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:TerminologyServiceUrl"
    description: "The base URL for the Terminology Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:AuditServiceUrl"
    description: "The base URL for the Audit Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:QueryDispatchServiceUrl"
    description: "The base URL for the Query Dispatch Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  - key: "ServiceRegistry:NotificationServiceUrl"
    description: "The base URL for the Notification Service."
    required: true
    consumers: ["Account", "AdminBFF", "Audit", "AutomationUI", "Census", "DataAcquisition", "DataAcquisitionWorker", "Normalization", "Notification", "QueryDispatch", "Report", "Submission", "Tenant"]
  # Java-notation key under global, which has no owning service to infer a runtime from.
  # Without the marker it is looked up as a .NET key and its /link/report/base-url row is
  # never matched.
  - key: "link.report.base-url"
    description: "The base URL for the Report Service (used by Java services)."
    required: true
    runtime: "java"
    consumers: ["MeasureEval", "Validation"]
  - key: "SecretManagement:Manager"
    description: "The type of secret manager to use (e.g., AzureKeyVault)."
    required: true
    consumers: ["Account", "AdminBFF", "DataAcquisition", "DataAcquisitionWorker"]
  - key: "SecretManagement:ManagerUri"
    description: "The URI for the secret manager."
    required: true
    consumers: ["AdminBFF", "DataAcquisition", "DataAcquisitionWorker"]
  - key: "ConsumerSettings:ConsumerRetryDuration"
    description: "List of ISO 8601 durations defining the retry intervals for Kafka consumers."
    required: true
    consumers: ["Audit", "Census", "DataAcquisition", "DataAcquisitionWorker", "Report", "Submission"]
  - key: "ConsumerSettings:DisableRetryConsumer"
    description: "Boolean flag to disable the retry consumer for Kafka events."
    required: true
    consumers: ["Audit", "Census", "DataAcquisition", "DataAcquisitionWorker", "Report", "Submission"]
  - key: "ConsumerSettings:DisableConsumer"
    description: "Boolean flag to disable the Kafka consumer entirely for the service."
    required: true
    consumers: ["Audit", "Census", "DataAcquisition", "DataAcquisitionWorker", "Report", "Submission"]
  # SYSTEM FEATURE SWITCH — one decision for the whole deployment, not a Tenant setting.
  # It is catalogued here, unlabeled, so every service sees the same answer: today only Tenant acts
  # on it, but the switch decides whether this deployment does NHSN measure-enrollment reporting at
  # all, and further services are expected to read it as the workflow lands (LEGLINK-698/701).
  #
  # The Angular Admin UI needs the same answer and cannot read App Configuration. It is served by a
  # container that maps LINK_DMRP_ENABLED into its runtime app.config, so the switch reaches the UI
  # out of band. The two MUST agree, and the failure modes are not symmetric:
  #   UI off, services on  -> the facility form asks for a schedule the Tenant API then refuses. Loud.
  #   UI on, services off  -> the form sends an empty schedule Tenant accepts, quietly creating a
  #                           facility with no scheduled reports and no jobs. Silent.
  # So the UI must never be switched on ahead of the services.
  #
  # Expected to end up permanently on, at which point this row and LINK_DMRP_ENABLED both go away.
  - key: "DMRP:Enabled"
    description: "Boolean flag (default false) that turns on DMRP integration for the deployment. When enabled, facility reporting plans are sourced from the NHSN DMRP API rather than chosen per facility, the DMRP controllers are served under api/dmrp by their host service, and a facility's scheduled reports are derived from its reporting plans. When disabled, Link performs facility dQM reporting on its own and the api/dmrp routes do not exist. Must be set to the same value as the Admin UI container's LINK_DMRP_ENABLED."
    required: false
    defaultValue: "false"
    consumers: ["Tenant"]

