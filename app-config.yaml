      description: "Azure SDK in-process tries per ABS resource-cache call (initial call + quick retries). Kept low deliberately: the Kafka retry-topic ladder owns real retrying, and the SDK default of 4 exponential tries blocked the single-threaded consumer executor for minutes during an ABS outage. Defaults to 2."
