$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Link App Configuration Registry"
description: "Enumerates all required application configuration keys needed to run the system in any deployed environment."
type: "object"
properties:
  global:
    type: "array"
    description: "Configurations shared across most or all services."
    items:
      $ref: "#/$defs/configEntry"
  services:
    type: "object"
    description: "Configurations specific to individual services."
    additionalProperties:
      type: "array"
      items:
        $ref: "#/$defs/configEntry"
  serviceMeta:
    type: "object"
    description: "Per-service deployment facts: the Azure App Configuration label the running service selects, and which runtime it is. Tooling reads this rather than hardcoding the mapping."
    additionalProperties:
      $ref: "#/$defs/serviceMetaEntry"
required:
  - "global"
  - "services"
  - "serviceMeta"

# Label values are hardcoded in the services themselves and must match exactly:
#   .NET  - a compile-time constant passed to AddExternalConfiguration(), e.g.
#           LinkAdminConstants.ServiceName = "LinkAdminBFF"
#           (DotNet/Shared/Application/Extensions/ExternalConfigurationExtension.cs:61)
#   Java  - the label-filter in bootstrap.yml, e.g. ',MeasureEval'
#           (Java/measureeval/src/main/resources/bootstrap.yml:9)
# Each service selects unlabeled keys first, then its own label, so a labeled row
# overrides an unlabeled one for that service only. Changing a label requires a redeploy.
serviceMeta:
  Account:               { label: "Account",               runtime: "dotnet" }
  AdminBFF:              { label: "LinkAdminBFF",          runtime: "dotnet" }
  Audit:                 { label: "Audit",                 runtime: "dotnet" }
  AutomationUI:          { label: "Link Automation UI",    runtime: "dotnet" }
  Census:                { label: "Census",                runtime: "dotnet" }
  DataAcquisition:       { label: "DataAcquisition",       runtime: "dotnet" }
  DataAcquisitionWorker: { label: "DataAcquisitionWorker", runtime: "dotnet" }
  MeasureEval:           { label: "MeasureEval",           runtime: "java" }
  Normalization:         { label: "Normalization",         runtime: "dotnet" }
  Notification:          { label: "Notification",          runtime: "dotnet" }
  QueryDispatch:         { label: "QueryDispatch",         runtime: "dotnet" }
  Report:                { label: "Report",                runtime: "dotnet" }
  Submission:            { label: "Submission",            runtime: "dotnet" }
  Tenant:                { label: "Tenant",                runtime: "dotnet" }
  Terminology:           { label: "Terminology",           runtime: "dotnet" }
  Validation:            { label: "Validation",            runtime: "java" }

global:
  - key: "KafkaConnection:BootstrapServers"
    description: "Comma-separated list of Kafka bootstrap servers for event messaging."
    required: true
  - key: "DatabaseProvider"
    description: "The database provider to use. SqlServer is the only value the code handles; the key exists for a future provider swap."
    required: false
    defaultValue: "SqlServer"
  - key: "ConnectionStrings:DatabaseConnection"
    description: "The connection string for the primary service database."
    required: true
  # Automation.UI inbound-auth coordination note:
  # In Automation.UI Program.cs, the anonymous-access short-circuit middleware runs
  # before UseAuthentication(). When Authentication:EnableAnonymousAccess is false,
  # every non-/health request is returned as 503 before bearer-token validation can run.
  # To make ApiBearer-protected endpoints reachable, EnableAnonymousAccess and
  # Authentication:ApiBearer:Enabled must be configured together for the target environment.
  # Canonical key path is Authentication:ApiBearer:* (not top-level ApiBearer:*).
  - key: "Authentication:Schemas:LinkBearer:Authority"
    description: "The OIDC authority URL used for validating bearer tokens."
    required: true
  - key: "Authentication:EnableAnonymousAccess"
    description: "Controls whether Automation.UI serves non-health traffic. Must be true for requests to reach UseAuthentication()/ApiBearer policy evaluation."
    required: true
  - key: "Authentication:ApiBearer:Enabled"
    description: "Boolean flag that enables inbound API bearer-token validation in Automation.UI for /api/runs endpoints."
    required: true
  - key: "Authentication:ApiBearer:Authority"
    description: "OIDC authority URL for validating inbound Automation.UI API bearer tokens. Required when Authentication:ApiBearer:Enabled is true."
    required: true
  - key: "Authentication:ApiBearer:Audience"
    description: "Expected audience for inbound Automation.UI API bearer tokens. Required when Authentication:ApiBearer:Enabled is true."
    required: true
  - key: "LinkTokenService:Authority"
    description: "The authority URL used by the LinkTokenService for internal token generation and validation."
    required: true
  - key: "LinkTokenService:SigningKey"
    description: "The secret key used for signing internal tokens. Must be kept secure."
    required: true
  - key: "Telemetry:EnableTelemetry"
    description: "Boolean flag to enable or disable OpenTelemetry tracing and metrics."
    required: true
  # Serilog's WriteTo is an array, so sinks are addressed positionally, not by name. Index 1
  # is GrafanaLoki because every appsettings.json orders the array [GrafanaLoki, Console] and
  # the stores overlay WriteTo:0:Name=Console / WriteTo:1:Name=GrafanaLoki, which .NET merges
  # by index. Reordering that array in any service silently moves this setting.
  - key: "Serilog:WriteTo:1:Args:uri"
    description: "The endpoint URI for the Grafana Loki log aggregator."
    required: true
  # Read by logback-spring.xml via <springProperty>, not by any @ConfigurationProperties
  # class, so a scan of the Java binding classes alone reports it as dead. It is not.
  - key: "loki.app"
    description: "The application label attached to log lines shipped to Loki by the Java services."
    required: false
    runtime: "java"
    defaultValue: "link-cloud"
  - key: "ConnectionStrings:Redis"
    description: "The Redis endpoint (host:port). The password is supplied separately via Redis:Password. Required when Cache:Type is Redis; the resource cache uses ResourceCache:Redis:ConnectionString instead."
    required: true
  - key: "InternalBlobStorage:ConnectionString"
    description: "The connection string for the internal Azure Blob Storage (or Azurite)."
    required: true
  - key: "InternalBlobStorage:BlobContainerName"
    description: "The name of the blob container used for internal storage."
    required: true
  - key: "ServiceRegistry:TenantService:TenantServiceUrl"
    description: "The base URL for the Tenant Service."
    required: true
  - key: "ServiceRegistry:AccountServiceUrl"
    description: "The base URL for the Account Service."
    required: true
  - key: "ServiceRegistry:ReportServiceUrl"
    description: "The base URL for the Report Service."
    required: true
  - key: "ServiceRegistry:MeasureServiceUrl"
    description: "The base URL for the Measure Service."
    required: true
  - key: "ServiceRegistry:CensusServiceUrl"
    description: "The base URL for the Census Service."
    required: true
  - key: "ServiceRegistry:DataAcquisitionServiceUrl"
    description: "The base URL for the Data Acquisition Service."
    required: true
  - key: "ServiceRegistry:AdminBffServiceUrl"
    description: "The base URL for the Admin BFF service used by Automation.UI and LinkSdk Admin.BFF integration calls."
    required: true
  - key: "ServiceRegistry:NormalizationServiceUrl"
    description: "The base URL for the Normalization Service."
    required: true
  - key: "ServiceRegistry:ValidationServiceUrl"
    description: "The base URL for the Validation Service."
    required: true
  - key: "ServiceRegistry:SubmissionServiceUrl"
    description: "The base URL for the Submission Service."
    required: true
  - key: "ServiceRegistry:TerminologyServiceUrl"
    description: "The base URL for the Terminology Service."
    required: true
  - key: "ServiceRegistry:AuditServiceUrl"
    description: "The base URL for the Audit Service."
    required: true
  - key: "ServiceRegistry:QueryDispatchServiceUrl"
    description: "The base URL for the Query Dispatch Service."
    required: true
  - key: "ServiceRegistry:NotificationServiceUrl"
    description: "The base URL for the Notification Service."
    required: true
  # Java-notation key under global, which has no owning service to infer a runtime from.
  # Without the marker it is looked up as a .NET key and its /link/report/base-url row is
  # never matched.
  - key: "link.report.base-url"
    description: "The base URL for the Report Service (used by Java services)."
    required: true
    runtime: "java"
  - key: "SecretManagement:Manager"
    description: "The type of secret manager to use (e.g., AzureKeyVault)."
    required: true
  - key: "SecretManagement:ManagerUri"
    description: "The URI for the secret manager."
    required: true
  - key: "ConsumerSettings:ConsumerRetryDuration"
    description: "List of ISO 8601 durations defining the retry intervals for Kafka consumers."
    required: true
  - key: "ConsumerSettings:DisableRetryConsumer"
    description: "Boolean flag to disable the retry consumer for Kafka events."
    required: true
  - key: "ConsumerSettings:DisableConsumer"
    description: "Boolean flag to disable the Kafka consumer entirely for the service."
    required: true
  # PAIRED KEYS — one decision, one key per runtime, and they MUST be set to the same value.
  # Enabling only the Java side puts two OperationOutcomes in the patient NDJSON; enabling only the
  # .NET side puts none there. Neither failure is loud, so treat these as a single change.
  # They are separate keys because Spring cannot bind a colon-separated key, and the Java services are
  # being retired: a shared key would leave the surviving .NET services carrying a translation layer
  # for a platform that no longer exists. When Validation is retired, drop the dotted key below and
  # keep the .NET one.
  # In Azure App Configuration these are two rows, each in its runtime's convention:
  #   PreQualification:WritePreQualOperationOutcome        (.NET, as with other Section:Key rows)
  #   /pre-qualification/write-pre-qual-operation-outcome  (Java, as with /link/report/base-url)
  - key: "PreQualification:WritePreQualOperationOutcome"
    description: "Boolean flag (default false), read by the .NET Report service. When true, Report skips its legacy 'Patient has failed Validation' OperationOutcome append to the patient NDJSON, because the Validation service is the sole writer (LEGLINK-425/LEGLINK-466). Must be set to the same value as pre-qualification.write-pre-qual-operation-outcome."
    required: false
  - key: "pre-qualification.write-pre-qual-operation-outcome"
    description: "Boolean flag (default false), read by the Java Validation service. When true, Validation writes the category-grouped pre-qualification OperationOutcome to the patient NDJSON and is its sole writer (LEGLINK-425/LEGLINK-466). Must be set to the same value as PreQualification:WritePreQualOperationOutcome."
    required: false
    runtime: "java"
services:
  Account:
    - key: "UserManagement:EnableAutomaticUserActivation"
      description: "Boolean flag to enable automatic activation of new users. Every environment currently runs the default; provision a row only where the posture should differ."
      required: false
      defaultValue: "true"
  AdminBFF:
    - key: "Authentication:Schemas:Oauth2:ClientId"
      description: "The OAuth2 client ID for the Admin BFF."
      required: true
    - key: "Authentication:Schemas:Oauth2:ClientSecret"
      description: "The OAuth2 client secret for the Admin BFF."
      required: true
    - key: "Authentication:Schemas:Oauth2:Endpoints:Authorization"
      description: "The OAuth2 authorization endpoint URL."
      required: true
    - key: "Authentication:Schemas:Oauth2:Endpoints:Token"
      description: "The OAuth2 token endpoint URL."
      required: true
    - key: "Authentication:Schemas:Oauth2:Endpoints:UserInformation"
      description: "The OAuth2 user information endpoint URL."
      required: true
    - key: "ReverseProxy:Clusters:{Service}:Destinations:destination1:Address"
      description: "The backend address for each service routed through the BFF (e.g., AccountService, AuditService, etc.)."
      required: true
    - key: "MonitorBackendHealthChecks"
      description: "Boolean flag to enable monitoring of backend service health."
      required: true
  Audit:
    - key: "KafkaConnection:ClientId"
      description: "The client ID for the Kafka connection."
      required: true
  AutomationUI:
    - key: "Automation:FhirServerBase"
      description: "The base URL of the FHIR server the generator writes test data to."
      required: true
    - key: "Automation:FacilityFhirServerBase"
      description: "The base URL of the FHIR server as the facility reaches it. Differs from Automation:FhirServerBase only when the consumer's network vantage point differs."
      required: true
    - key: "MongoDB:ConnectionString"
      description: "The MongoDB connection string for automation data."
      required: true
    - key: "MongoDB:DatabaseName"
      description: "The MongoDB database name for automation data."
      required: true
    - key: "ApiHealth:EnableAdminBffAuthSuite"
      description: "Boolean flag to enable the Admin BFF authentication API Health suite in Automation.UI."
      required: false
  DataAcquisition:
    - key: "AcquisitionJobSettings:CronSchedule"
      description: "The cron expression defining how often data acquisition jobs should run."
      required: false
      defaultValue: "0/10 * * * * ?"
    - key: "DistributedLockSettings:Expiration"
      description: "The expiration time in minutes for distributed locks."
      required: false
      defaultValue: "10"
    - key: "Cache:Type"
      description: "ICacheService backend. Defaults to InMemory (per-process); set to Redis to share the cache (e.g. org-location conditions) across the DataAcquisition service and AcquisitionWorker so a config change in one is seen by the other. Redis requires ConnectionStrings:Redis."
      required: false
    - key: "ResourceCache:CacheImplementation"
      description: "The resource cache implementation to register. Defaults to Hybrid; supported values are Hybrid, Redis, and ABS."
      required: false
    - key: "ResourceCache:Redis:ConnectionString"
      description: "The Redis endpoint used by the resource cache. Required when ResourceCache:CacheImplementation is Hybrid or Redis."
      required: true
    - key: "ResourceCache:Redis:Password"
      description: "Optional Redis password for the resource cache. Defaults to empty."
      required: false
    - key: "ResourceCache:Redis:MemoryThresholdPercent"
      description: "Optional percentage of ResourceCache:Redis:MaxMemoryBytes at which Hybrid caching falls back to blob storage. Defaults to 80.0."
      required: false
    - key: "ResourceCache:Redis:MaxMemoryBytes"
      description: "The Redis max-memory limit in bytes, used as the denominator for Hybrid cache memory-pressure fallback. Supplied via configuration because Azure Managed Redis does not return maxmemory via INFO. Recommended for Hybrid; when unset or <= 0 Redis is always used (a warning is logged). All LCG Redis instances are currently 1 GB (1073741824); this must be updated if Redis capacity is scaled. Defaults to 268435456 (256 MB) to match local Docker Redis."
      required: false
    # Normalization binds a top-level "CacheBlobStorage" section for the same three settings
    # (Normalization/Program.cs), while DataAcquisition and Shared bind the nested
    # ResourceCache:BlobStorage form. Both spellings are live; unifying them needs a code
    # change and is tracked separately.
    - key: "ResourceCache:BlobStorage:ConnectionString"
      description: "The Azure Blob Storage connection string used by the resource cache. Required when ResourceCache:CacheImplementation is Hybrid or ABS."
      required: true
    - key: "ResourceCache:BlobStorage:BlobContainerName"
      description: "Optional blob container name used by the resource cache. Defaults to empty."
      required: false
    - key: "ResourceCache:BlobStorage:BlobRoot"
      description: "Optional blob name prefix used by the resource cache. Defaults to empty."
      required: false
  DataAcquisitionWorker:
    - key: "AcquisitionWorkerProcessorSettings:MaxConcurrentAcquisitions"
      description: "The maximum number of concurrent data acquisition tasks. Declared in appsettings.json as a flat colon key rather than a nested object."
      required: false
      defaultValue: "8"
    - key: "AcquisitionWorkerProcessorSettings:WorkChannelCapacity"
      description: "The capacity of the internal work channel for acquisition tasks."
      required: true
    - key: "Cache:Type"
      description: "ICacheService backend. Defaults to InMemory (per-process); set to Redis to share the cache (e.g. org-location conditions) across the DataAcquisition service and AcquisitionWorker so a config change in one is seen by the other. Redis requires ConnectionStrings:Redis."
      required: false
    - key: "ResourceCache:CacheImplementation"
      description: "The resource cache implementation to register. Defaults to Hybrid; supported values are Hybrid, Redis, and ABS."
      required: false
    - key: "ResourceCache:Redis:ConnectionString"
      description: "The Redis endpoint used by the resource cache. Required when ResourceCache:CacheImplementation is Hybrid or Redis."
      required: true
    - key: "ResourceCache:Redis:Password"
      description: "Optional Redis password for the resource cache. Defaults to empty."
      required: false
    - key: "ResourceCache:Redis:MemoryThresholdPercent"
      description: "Optional percentage of ResourceCache:Redis:MaxMemoryBytes at which Hybrid caching falls back to blob storage. Defaults to 80.0."
      required: false
    - key: "ResourceCache:Redis:MaxMemoryBytes"
      description: "The Redis max-memory limit in bytes, used as the denominator for Hybrid cache memory-pressure fallback. Supplied via configuration because Azure Managed Redis does not return maxmemory via INFO. Recommended for Hybrid; when unset or <= 0 Redis is always used (a warning is logged). All LCG Redis instances are currently 1 GB (1073741824); this must be updated if Redis capacity is scaled. Defaults to 268435456 (256 MB) to match local Docker Redis."
      required: false
    - key: "ResourceCache:BlobStorage:ConnectionString"
      description: "The Azure Blob Storage connection string used by the resource cache. Required when ResourceCache:CacheImplementation is Hybrid or ABS."
      required: true
    - key: "ResourceCache:BlobStorage:BlobContainerName"
      description: "Optional blob container name used by the resource cache. Defaults to empty."
      required: false
    - key: "ResourceCache:BlobStorage:BlobRoot"
      description: "Optional blob name prefix used by the resource cache. Defaults to empty."
      required: false
  # No service-specific required config: this service reads only global keys. An explicit
  # empty list keeps it paired with its serviceMeta entry.
  Census: []
  MeasureEval:
    - key: "spring.data.mongodb.uri"
      description: "The MongoDB connection string."
      required: true
    - key: "spring.kafka.bootstrap-servers"
      description: "Kafka bootstrap servers for the measure evaluation service."
      required: true
    - key: "authentication.authority"
      description: "The OIDC authority URL for token validation."
      required: true
    - key: "link.reportability-predicate"
      description: "Fully qualified class name of the reportability predicate. Changing it changes evaluation behaviour, not deployment topology, so it is not an environment concern."
      required: false
      defaultValue: "com.lantanagroup.link.measureeval.reportability.IsInInitialPopulation"
    - key: "link.cql-debug"
      description: "Boolean flag to enable CQL debugging."
      required: false
      defaultValue: "false"
    - key: "resource-cache.blob-storage.connection-string"
      description: "Azure Blob Storage (or Azurite) connection string for the ABS resource cache. Required only when the ABS resource-cache backend is used instead of Redis; leave empty to disable ABS caching."
      required: false
    - key: "resource-cache.blob-storage.blob-container-name"
      description: "Name of the blob container backing the ABS resource cache. Required only when the ABS resource-cache backend is used."
      required: false
    - key: "resource-cache.blob-storage.blob-root"
      description: "Root path/prefix within the blob container under which cached resources are stored for the ABS resource cache. Required only when the ABS resource-cache backend is used."
      required: false
  Normalization:
    - key: "ResourceCache:CacheImplementation"
      description: "The resource cache implementation to register. Defaults to Hybrid; supported values are Hybrid, Redis, and ABS."
      required: false
    - key: "ResourceCache:Redis:ConnectionString"
      description: "The Redis endpoint used by the resource cache. Required when ResourceCache:CacheImplementation is Hybrid or Redis."
      required: true
    - key: "ResourceCache:Redis:Password"
      description: "Optional Redis password for the resource cache. Defaults to empty."
      required: false
    - key: "ResourceCache:Redis:MemoryThresholdPercent"
      description: "Optional percentage of ResourceCache:Redis:MaxMemoryBytes at which Hybrid caching falls back to blob storage. Defaults to 80.0."
      required: false
    - key: "ResourceCache:Redis:MaxMemoryBytes"
      description: "The Redis max-memory limit in bytes, used as the denominator for Hybrid cache memory-pressure fallback. Supplied via configuration because Azure Managed Redis does not return maxmemory via INFO. Recommended for Hybrid; when unset or <= 0 Redis is always used (a warning is logged). All LCG Redis instances are currently 1 GB (1073741824); this must be updated if Redis capacity is scaled. Defaults to 268435456 (256 MB) to match local Docker Redis."
      required: false
    - key: "ResourceCache:BlobStorage:ConnectionString"
      description: "The Azure Blob Storage connection string used by the resource cache. Required when ResourceCache:CacheImplementation is Hybrid or ABS."
      required: true
    - key: "ResourceCache:BlobStorage:BlobContainerName"
      description: "Optional blob container name used by the resource cache. Defaults to empty."
      required: false
    - key: "ResourceCache:BlobStorage:BlobRoot"
      description: "Optional blob name prefix used by the resource cache. Defaults to empty."
      required: false
  Notification:
    - key: "SmtpConnection:Host"
      description: "The SMTP server hostname for sending notifications."
      required: true
    - key: "SmtpConnection:Port"
      description: "The SMTP server port."
      required: true
  # No service-specific required config: this service reads only global keys. An explicit
  # empty list keeps it paired with its serviceMeta entry.
  QueryDispatch: []
  Report:
    - key: "EnhancedQueryLoggingSettings:EnableEnhancedQueryLogging"
      description: "Boolean flag to enable detailed logging of database queries. Diagnostic toggle; provision a row where it should be on."
      required: false
      defaultValue: "false"
    - key: "PatientAggregator:IncludeOrganizationResource"
      description: "Whether to include the submitting Organization in patient bundles."
      required: false
  Submission:
    - key: "SubmissionServiceConfig:SubmissionDirectory"
      description: "The local or network path where submission files are stored."
      required: true
    - key: "SubmissionServiceConfig:PatientBundleBatchSize"
      description: "The number of patient bundles to process in a single batch."
      required: true
    - key: "InternalBlobStorage:ConnectionString"
      description: "The connection string for the internal Azure Blob Storage (where submissions are stored)."
      required: true
    - key: "InternalBlobStorage:BlobContainerName"
      description: "The name of the blob container used for internal storage."
      required: true
    - key: "ExternalBlobStorage:ConnectionString"
      description: "The connection string for the external Azure Blob Storage (where submissions are stored)."
      required: true
    - key: "ExternalBlobStorage:BlobContainerName"
      description: "The name of the blob container used for external storage."
      required: true
    - key: "ExternalBlobStorage:FlattenHierarchy"
      description: "Whether to flatten the submission hierarchy (i.e., upload all bundles to the blob root)."
      required: false
    - key: "ExternalBlobStorage:SuppressManifest"
      description: "Whether to suppress submission of manifest bundles."
      required: false
    - key: "ExternalBlobStorage:UseMeasurePrefix"
      description: "Whether to use a measure prefix (i.e., dQM-specific directory following the blob root) for external blobs."
      required: false
    - key: "ExternalBlobStorage:MeasurePrefixesByReportType"
      description: "Mapping of report types to measure prefixes."
      required: false
  Tenant:
    - key: "FacilityIdSettings:NumericOnlyFacilityId"
      description: "Boolean flag to restrict facility IDs to numeric values only."
      required: false
      defaultValue: "false"
  Terminology:
    - key: "Terminology:Path"
      description: "Path to the terminology data files. A path inside the container image, so it does not vary by environment. Validated at startup: a missing directory is a hard startup failure."
      required: false
      defaultValue: "data/"
  Validation:
    - key: "spring.datasource.url"
      description: "The SQL Server database connection URL for the validation service."
      required: true
    - key: "spring.datasource.username"
      description: "The database username."
      required: true
    - key: "spring.datasource.password"
      description: "The database password."
      required: true
    - key: "spring.kafka.bootstrap-servers"
      description: "Kafka bootstrap servers for the validation service."
      required: true
    - key: "spring.data.redis.host"
      description: "The Redis host for the validation service."
      required: true
    - key: "spring.data.redis.port"
      description: "The Redis port for the validation service."
      required: true
    - key: "spring.data.redis.password"
      description: "The Redis password."
      required: true
    - key: "authentication.authority"
      description: "The OIDC authority URL for token validation."
      required: true
    - key: "link.terminology-service-url"
      description: "The base URL for the Terminology Service used for validation."
      required: true
    # The master gate, pre-qualification.write-pre-qual-operation-outcome, is registered under
    # global instead of here: the .NET Report service reads that same key (LEGLINK-466). Only the
    # expression toggle below is Validation-only.
    - key: "pre-qualification.write-expressions-in-operation-outcome"
      description: "Boolean flag (default true). When false, the expression[] of each issue is omitted from the pre-qualification OperationOutcome written by the Validation service."
      required: false
$defs:
  serviceMetaEntry:
    type: "object"
    additionalProperties: false
    required:
      - "label"
      - "runtime"
    properties:
      label:
        type: "string"
        description: "The App Configuration label this service selects at startup. Hardcoded per service (a compile-time constant in .NET, the bootstrap.yml label-filter in Java), so it cannot be changed without a redeploy. Must match exactly, including case and spaces."
      runtime:
        type: "string"
        enum: ["dotnet", "java"]
        description: "Which runtime the service is. Determines key notation: .NET reads 'Section:Key' rows, Java reads '/section/key' rows which the Spring provider maps to 'section.key'."
  configEntry:
    type: "object"
    additionalProperties: false
    required:
      - "key"
      - "description"
    properties:
      key:
        type: "string"
        description: "The configuration key path (e.g., 'KafkaConnection:BootstrapServers')."
      description:
        type: "string"
        description: "A brief explanation of what the setting does and why it is required."
      required:
        type: "boolean"
        default: true
        description: "Whether the setting is strictly required for the service to start/function correctly."
      label:
        type: "string"
        description: "An optional label for the configuration key, if applicable."
      sensitive:
        type: "boolean"
        default: false
        description: "Whether the setting contains sensitive information (e.g., passwords, secrets) that should be protected."
      defaultValue:
        type: "string"
        description: "An optional default value for the configuration key, if applicable."
      runtime:
        type: "string"
        enum: ["dotnet", "java"]
        description: "Overrides the runtime inferred from the owning service, for the rare entry whose notation does not match its section. Needed for Java-notation keys listed under 'global', which has no owning service."
      consumers:
        type: "array"
        items:
          type: "string"
        description: "Services that read this key, derived from the code inventory. Documentation only - not used for resolution."
    # A sensitive setting must never carry a defaultValue - secrets and Key Vault
    # references are supplied per environment, never seeded from this file.
    # The "required: sensitive" guard below is load-bearing: without it, an entry that
    # omits "sensitive" still matches the "if" (a properties clause is vacuously true for
    # an absent property) and would be blocked from having a defaultValue. The
    # "default: false" above does not help - JSON Schema defaults are annotation only
    # and are not applied during validation.
    if:
      properties:
        sensitive:
          const: true
      required:
