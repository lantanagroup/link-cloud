#### services and ports
## fhir_server: 6157
## mock-fhir-server: 6158
## redis_cache: 6379
## mssql: 1433
## mongo: 17017 
## loki: 3100
## grafana: 3000
## otel-collector: 4317
## tempo: 4417
## prometheus: 9090
## kafka_b: 9092, 9094
## kafka-ui: 9095
## azurite: 10000
## rest-proxy: 8082
## schema-registry: 8081
## account: 8060
## audit: 8062
## admin-bff: 8063
## census: 8064
## dataacq: 8065
## dataacq-worker: 8078
## admin-ui: 8066
## automation-ui: 5256
## measureeval: 8067
## normalization: 8068
## querydispatch: 8071
## report: 8072
## submission: 8073
## tenant: 8074
## validation: 8075
## terminology: 8076

services:
  
  ###########################################
  ### FHIR Server (HAPI) - For testing
  ###########################################
  fhir_server_prep:
    image: alpine:latest
    volumes:
      - fhir_data:/data
    # Give HAPI's (non-root) user access to the volume
    command: >-
      chown 65532:65532 /data

  fhir_server:
    image: hapiproject/hapi:v8.10.0-2
    container_name: fhir-server
    depends_on:
      fhir_server_prep:
        condition: service_completed_successfully
    ports:
      - "6157:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_multiple_delete=true
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.allow_cascading_deletes=true
      - hapi.fhir.delete_enabled=true
      - hapi.fhir.expunge_enabled=true
      - hapi.fhir.enforce_referential_integrity_on_delete=false
      - hapi.fhir.enforce_referential_integrity_on_write=false
      - hapi.fhir.delete_expunge_enabled=true
      - hapi.fhir.reuse_cached_search_results_millis=0
      - hapi.fhir.subscription_enabled=false
      - hapi.fhir.client_id_strategy=ANY
      - hapi.fhir.server_id_strategy=UUID
      - spring.main.lazy-initialization=true
      - hapi.fhir.openapi_enabled=false
      - hapi.fhir.lastn_enabled=false
      - hapi.fhir.graphql_enabled=false
      - hapi.fhir.bulk_export_enabled=false
      - hapi.fhir.binary_storage_enabled=false
      - hapi.fhir.validation.requests_enabled=false
      - hapi.fhir.validation.responses_enabled=false
      - spring.datasource.url=jdbc:h2:file:/data/h2
    volumes:
      - fhir_data:/data
    networks:
      - link-nw
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      
  ###########################################
  ### Redis Cache
  ###########################################

  redis_cache:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    container_name: redis_cache
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASS} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: 
      - redis_cache:/data
    networks:
      - link-nw
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ###########################################
  ### Blob Storage
  ###########################################

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    ports:
      - "10000:10000"
    container_name: azurite
    command: azurite --skipApiVersionCheck -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite_data:/data
    healthcheck:
      test: >-
        nc -z 127.0.0.1 10000
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - link-nw

  azurite_init:
    image: mcr.microsoft.com/azure-cli:2.75.0
    container_name: azurite-init
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING}
    command: bash -c 'az storage container create -n ${INTERNAL_BLOB_CONTAINER_NAME}; az storage container create -n ${EXTERNAL_BLOB_CONTAINER_NAME}'
    restart: "no"
    depends_on:
      azurite:
        condition: service_healthy
    networks:
      - link-nw
    
  ###########################################
  ### SFTP Server
  ###########################################
  sftp:
    image: atmoz/sftp
    container_name: sftp-server
    ports:
      - "2222:22"
    volumes:
      - sftp_data:/home/${SFTP_USER}/data
      - ./Scripts/sftp-setup.sh:/etc/sftp.d/sftp-setup.sh:ro
    command: ${SFTP_USER}:${SFTP_PASSWORD}:1001:1001:data
    networks:
      - link-nw
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "sftp -oBatchMode=no -b - ${SFTP_USER}@localhost -P 22 <<< 'exit' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  ###########################################
  ### Databases
  ###########################################
  
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - 1433:1433
    container_name: sql-server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${LINK_DB_PASS}
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always
    healthcheck:
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -C -U sa -P "$$SA_PASSWORD" -Q 'SELECT 1;'
      interval: 5s
      retries: 15
      start_period: 5s
      timeout: 5s
    networks:
      - link-nw
      
  mssql_init:
    image: mcr.microsoft.com/mssql-tools
    container_name: sql-init
    environment:
      LINK_DB_PASS: ${LINK_DB_PASS}
    volumes:
      - type: bind
        source: .docker/create-dbs.sql
        target: /create-dbs.sql
    command: bash -c "/opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P ${LINK_DB_PASS} -i /create-dbs.sql"
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - link-nw

  mongo:
    image: mongo:6-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '17017:27017'
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - link-nw
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo_init:
    image: mongo:6-jammy
    container_name: mongo-init
    depends_on:
        mongo:
            condition: service_healthy
    command: >
        bash -c '
        echo "=== MongoDB Replica Set Setup ===";
        sleep 6;

        mongosh --host mongo:27017 --quiet --eval "
            try {
            if (rs.status().ok) {
                print(\"? Replica set rs0 already initialized - skipping\");
                quit(0);
            }
            } catch (err) {
            print(\"?? Initializing replica set rs0...\");
            rs.initiate({
                _id: \"rs0\",
                members: [{ _id: 0, host: \"mongo:27017\" }]
            });
            print(\"? Replica set initialized successfully\");
            }
        ";

        echo "=== mongo_init completed ===";
        '
    networks:
        - link-nw
      
  ###########################################
  ### Telemetry
  ###########################################
      
  loki:
    image: grafana/loki:3.3.1
    ports:
      - "3100:3100"
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - link-nw
      
  # Kafka lag exporter is an infra proposal only (.docker/kafka-exporter.proposal.yml).
  # It is not part of this compose file and is not shown on the Automation Metrics page.
  otel-collector:
    image: otel/opentelemetry-collector:0.88.0
    container_name: open-telemetry-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - .docker/collector.yml:/etc/otel-collector-config.yaml
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "55679:55679" # zpages extension
    networks:
      - link-nw
      
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    container_name: prometheus
    volumes:
      - .docker/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - link-nw
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:2.9.1
    command: [ "-config.file=/etc/tempo.yaml" ]
    container_name: tempo
    hostname: tempo
    volumes:
      - .docker/tempo.yml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4417:4417"
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/status"]
    networks:
      - link-nw

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    container_name: grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - .docker/grafana.yml:/etc/grafana/provisioning/datasources/ds.yaml
    networks:
      - link-nw
      
  ###########################################
  ### KAFKA
  ###########################################
  
  kafka_b:
     image: bitnamilegacy/kafka:3.4
     ports:
       - "9092:9092"
       - "9094:9094"
     container_name: kafka-broker
     volumes:
       - kafka_data:/bitnami
       - .docker/kafka-client.properties:/etc/kafka-client.properties
     environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093"
      KAFKA_CFG_LISTENERS: "SASL_PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:SASL_PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT"
      KAFKA_CFG_ADVERTISED_LISTENERS: "SASL_PLAINTEXT://kafka_b:9092,EXTERNAL://localhost:9094"
      KAFKA_CLIENT_USERS: "${KAFKA_SASL_CLIENT_USER}"
      KAFKA_CLIENT_PASSWORDS: "${KAFKA_SASL_CLIENT_PASSWORD}"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "SASL_PLAINTEXT"
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_INTER_BROKER_USER: "controller_user"
      KAFKA_INTER_BROKER_PASSWORD: "controller_password"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_SASL_MECHANISM_CONTROLLER_PROTOCOL: "PLAIN"
      KAFKA_CONTROLLER_USER: "${KAFKA_INTER_BROKER_USER}"
      KAFKA_CONTROLLER_PASSWORD: "${KAFKA_INTER_BROKER_PASSWORD}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "2"
      KAFKA_CFG_MESSAGE_MAX_BYTES: 10485760
      KAFKA_CFG_REPLICA_FETCH_MAX_BYTES: 10485760
     networks:
       - link-nw
     healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka-broker:9092 --command-config /etc/kafka-client.properties --list" ]
      interval: 5s
      timeout: 5s
      retries: 10
     
  kafka_init:
    image: confluentinc/cp-kafka:6.1.1
    container_name: kafka-init
    volumes:
      - .docker/kafka-client.properties:/etc/kafka-client.properties
      - ./Scripts/create-topics-rest.sh:/create-topics-rest.sh
      - ./topics.txt:/topics.txt
    depends_on:
      rest-proxy:
        condition: service_healthy
    entrypoint: [ 'bash', '/create-topics-rest.sh', 'http://rest-proxy:8082', '${KAFKA_SASL_CLIENT_USER}', '${KAFKA_SASL_CLIENT_PASSWORD}', '/topics.txt' ]
    networks:
      - link-nw
      
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - 9095:8080
    depends_on:
      - kafka_b
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka_b:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_CLIENT_USER}" password="${KAFKA_SASL_CLIENT_PASSWORD}";'
      FILTERING_GROOVY_ENABLED: 'true'
    networks:
      - link-nw

  rest-proxy:
    # Pinned to a 7.x release (aligns with the Kafka 3.4 broker and ships curl for the healthcheck);
    # ':latest' drifted to Confluent Platform 8.x and broke the healthcheck.
    image: confluentinc/cp-kafka-rest:7.4.0
    depends_on:
      kafka_b:
        condition: service_healthy
    ports:
      - 8082:8082
    container_name: kafka-rest-proxy
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: 'kafka_b:9092'
      KAFKA_REST_LISTENERS: "http://0.0.0.0:8082"
      KAFKA_REST_KAFKA_CLUSTER_ID: "link-cluster"
      KAFKA_REST_CLIENT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_REST_CLIENT_SASL_MECHANISM: PLAIN
      KAFKA_REST_CLIENT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_CLIENT_USER}" password="${KAFKA_SASL_CLIENT_PASSWORD}";'
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:8082/v3/clusters"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - link-nw

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    depends_on:
      - kafka_b
    ports:
      - "8081:8081"
    container_name: kafka-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://kafka_b:9092,PLAINTEXT_INTERNAL://localhost:29092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN 
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_CLIENT_USER}" password="${KAFKA_SASL_CLIENT_PASSWORD}";'
    networks:
      - link-nw
     
  ###########################################
  ### LINK
  ###########################################

  account:
    image: link-account
    container_name: link-account
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433; Initial Catalog=link-account;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "8060:8060"
    build:
      context: .
      dockerfile: DotNet/Account/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
      mssql_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8060/health"]
      
  admin-bff:
    image: link-admin-bff
    container_name: link-admin-bff
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Authentication__EnableAnonymousAccess: ${LOCAL_AUTH_ENABLE_ANONYMOUS_ACCESS:-true}
      Authentication__DefaultChallengeScheme: "link_cookie"
      Authentication__Schemas__Oauth2__Enabled: ${LOCAL_AUTH_ENABLE_OAUTH2:-false}
      Authentication__Schemas__OpenIdConnect__Enabled: ${LOCAL_AUTH_ENABLE_OPENID_CONNECT:-false}
      Authentication__Schemas__Jwt__Enabled: ${LOCAL_AUTH_ENABLE_JWT:-false}
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:-LinkServiceAdmin}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:-local-dev-link-bearer-signing-key-2026-automation-adminbff-shared-secret-min-64-bytes}
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      Redis__Password: ${REDIS_PASS}
    ports:
      - "8063:8063"
    build:
      context: .
      dockerfile: DotNet/Admin.BFF/Dockerfile
    networks:
      - link-nw
    depends_on:
      otel-collector:
        condition: service_started
      redis_cache:
        condition: service_healthy
      loki:
        condition: service_started
      account:
        condition: service_healthy
      census:
        condition: service_healthy
      dataacq:
        condition: service_healthy
      measureeval:
        condition: service_healthy
      normalization:
        condition: service_healthy
      report:
        condition: service_healthy
      submission:
        condition: service_healthy
      tenant:
        condition: service_healthy
      terminology:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8063/api/health"]
  
  audit:
    image: link-audit
    container_name: link-audit
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-audit;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "8062:8062"
    build:
      context: .
      dockerfile: DotNet/Audit/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
      mssql_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8062/health"]

  census:
    image: link-census
    container_name: link-census
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-census;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "8064:8064"
    build:
      context: .
      dockerfile: DotNet/Census/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
      mssql_init:
        condition: service_completed_successfully
      tenant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8064/health" ]

  dataacq:
    image: link-dataacquisition
    container_name: link-dataacquisition
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-dataacquisition;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      Redis__Password: ${REDIS_PASS}
      ResourceCache__CacheImplementation: Hybrid
      ResourceCache__Redis__MaxMemoryBytes: 268435456
      ResourceCache__BlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
      ResourceCache__BlobStorage__BlobContainerName: ${INTERNAL_BLOB_CONTAINER_NAME}
      ResourceCache__BlobStorage__BlobRoot: resource-cache
    ports:
      - "8065:8065"
    build:
      context: .
      dockerfile: DotNet/DataAcquisition/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      azurite_init:
        condition: service_completed_successfully
      tenant:
        condition: service_healthy
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/health"]
      start_period: 5s
      interval: 5s
      retries: 10

  dataacq-worker:
     image: link-dataacquisitionworker
     container_name: link-dataacquisitionworker
     environment:
       ASPNETCORE_ENVIRONMENT: Docker
       KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
       KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
       ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-dataacquisition;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
       Redis__Password: ${REDIS_PASS}
       ResourceCache__CacheImplementation: Hybrid
       ResourceCache__Redis__MaxMemoryBytes: 268435456
       ResourceCache__BlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
       ResourceCache__BlobStorage__BlobContainerName: ${INTERNAL_BLOB_CONTAINER_NAME}
       ResourceCache__BlobStorage__BlobRoot: resource-cache
     ports:
       - "8078:8078"
     build:
       context: .
       dockerfile: DotNet/DataAcquisition.AcquisitionWorker/Dockerfile
       args:
         BUILD_CONFIGURATION: Debug
     networks:
       - link-nw
     depends_on:
       kafka_init:
         condition: service_completed_successfully
       mssql_init:
         condition: service_completed_successfully
       azurite_init:
         condition: service_completed_successfully
       otel-collector:
         condition: service_started
       dataacq:
         condition: service_healthy
       loki:
         condition: service_started
       redis_cache:
         condition: service_healthy
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8078/health"]
       start_period: 3s
       interval: 3s
       retries: 10
  
  admin-ui:
    image: link-admin-ui
    container_name: link-admin-ui
    ports:
      - "8066:80"
    build:
      context: Web/Admin.UI
    environment:
      LINK_AUTH_REQUIRED: ${LOCAL_ADMIN_UI_AUTH_REQUIRED:-false}
      LINK_BASE_API_URL: http://localhost:8063/api
      GRAFANA_URL: http://localhost:3000
      KAFKA_URL: http://localhost:9095
      # DMRP system feature switch. Must match DMRP:Enabled on the services, which this stack leaves
      # off in the tenant service's appsettings.Docker.json. To exercise DMRP locally, set this to
      # "true" and DMRP:Enabled to true in DotNet/Tenant/appsettings.Docker.json, then rebuild the
      # tenant image - appsettings is baked into it, so recreating the container on its own keeps the
      # value the image was built with. Change both, or the facility form quietly creates facilities
      # that report nothing.
      LINK_DMRP_ENABLED: "false"
    networks:
      - link-nw
    depends_on:
      - admin-bff

  automation-ui:
    image: link-automation-ui
    container_name: link-automation-ui
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Automation__LokiBaseUrl: http://loki:3100
      InternalBlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
      InternalBlobStorage__BlobContainerName: link-automation-ui
      ApiHealth__EnableAdminBffAuthSuite: ${LOCAL_APIHEALTH_ENABLE_ADMINBFF_AUTH_SUITE:-true}
      KafkaConnection__BootstrapServers__0: kafka_b:9092
      KafkaConnection__SaslProtocolEnabled: true
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      Authentication__UseBearerForServiceCalls: ${LOCAL_AUTOMATION_UI_USE_BEARER_FOR_SERVICE_CALLS:-false}
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:-LinkServiceAdmin}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:-local-dev-link-bearer-signing-key-2026-automation-adminbff-shared-secret-min-64-bytes}
      PatientAggregator__IncludeOrganizationResource: ${PATIENT_AGGREGATOR_INCLUDE_ORGANIZATION_RESOURCE:-true}
      pre-qualification.write-pre-qual-operation-outcome: ${VALIDATION_WRITE_PREQUAL_OO:-false}
      InternalBlobStorage__GeneratedTemplateBlobRoot: ${INTERNAL_BLOB_GENERATED_TEMPLATE_BLOB_ROOT:-automation/generated-bundles}
    volumes:
      - automation_ui_keys:/keys/dataprotection
    ports:
      - "5256:5257"
    build:
      context: .
      dockerfile: DotNet/Automation.UI/Dockerfile
      additional_contexts:
        thetis: ../thetis
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      azurite_init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      admin-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5257/"]

  measureeval:
    image: link-measureeval
    container_name: link-measureeval
    environment:
      SPRING_PROFILES_ACTIVE: docker
      spring.main.lazy-initialization: "true"
      spring.kafka.properties.sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_CLIENT_USER}" password="${KAFKA_SASL_CLIENT_PASSWORD}";
      internal-blob-storage.connection-string: ${AZURITE_CONNECTION_STRING}
      internal-blob-storage.blob-container-name: ${INTERNAL_BLOB_CONTAINER_NAME}
      resource-cache.blob-storage.connection-string: ${AZURITE_CONNECTION_STRING}
      resource-cache.blob-storage.blob-container-name: ${INTERNAL_BLOB_CONTAINER_NAME}
      resource-cache.blob-storage.blob-root: resource-cache
      link.report.base-url: http://report:8072
      spring.data.redis.password: ${REDIS_PASS}
      authentication.signing-key: ${LOCAL_LINK_TOKEN_SIGNING_KEY:-local-dev-link-bearer-signing-key-2026-automation-adminbff-shared-secret-min-64-bytes}
    ports:
      - "8067:8067"
    build:
      context: Java/
      dockerfile: measureeval/Dockerfile
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      dataacq:
        condition: service_healthy
      dataacq-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8067/health"]
      start_period: 15s
      interval: 5s
      retries: 10
      
  normalization:
    image: link-normalization
    container_name: link-normalization
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-normalization;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      ResourceCache__Redis__ConnectionString: redis_cache:6379,abortConnect=false,resolveDns=true,allowAdmin=true
      ResourceCache__Redis__Password: ${REDIS_PASS}
      ResourceCache__Redis__MaxMemoryBytes: 268435456
      ResourceCache__BlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
      ResourceCache__BlobStorage__BlobContainerName: ${INTERNAL_BLOB_CONTAINER_NAME}
      ResourceCache__BlobStorage__BlobRoot: resource-cache
      ResourceCache__CacheImplementation: Hybrid
    ports:
      - "8068:8068"
    build:
      context: .
      dockerfile: DotNet/Normalization/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      azurite_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
      redis_cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8068/health"]
      start_period: 3s
      interval: 3s
      retries: 10
      
  querydispatch:
    image: link-querydispatch
    container_name: link-querydispatch
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-querydispatch;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "8071:8071"
    build:
      context: .
      dockerfile: DotNet/QueryDispatch/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8071/health"]
      start_period: 3s
      interval: 3s
      retries: 10

  report:
    image: link-report
    container_name: link-report
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      PatientAggregator__IncludeOrganizationResource: ${PATIENT_AGGREGATOR_INCLUDE_ORGANIZATION_RESOURCE:-true}
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      InternalBlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
      InternalBlobStorage__BlobContainerName: ${INTERNAL_BLOB_CONTAINER_NAME}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-report;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "8072:8072"
    build:
      context: .
      dockerfile: DotNet/Report/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      azurite_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8072/health"]
      start_period: 5s
      interval: 5s
      retries: 10

  submission:
    image: link-submission
    container_name: link-submission
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-submission;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      InternalBlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
      InternalBlobStorage__BlobContainerName: ${INTERNAL_BLOB_CONTAINER_NAME}
      ExternalBlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING}
      ExternalBlobStorage__BlobContainerName: ${EXTERNAL_BLOB_CONTAINER_NAME}
      ExternalBlobStorage__FlattenHierarchy: ${EXTERNAL_BLOB_FLATTEN_HIERARCHY}
    ports:
      - "8073:8073"
    build:
      context: .
      dockerfile: DotNet/Submission/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    volumes: 
      - submission_data:/data/submission
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      azurite_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8073/health"]
      start_period: 30s
      interval: 5s
      retries: 10

  tenant:
    image: link-tenant
    container_name: link-tenant
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      KafkaConnection__SaslUsername: ${KAFKA_SASL_CLIENT_USER}
      KafkaConnection__SaslPassword: ${KAFKA_SASL_CLIENT_PASSWORD}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-tenant;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "8074:8074"
    build:
      context: .
      dockerfile: DotNet/Tenant/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8074/health"]
      start_period: 5s
      interval: 5s
      retries: 10

  validation:
    image: link-validation
    container_name: link-validation
    environment:
      SPRING_PROFILES_ACTIVE: docker
      spring.main.lazy-initialization: "true"
      spring.datasource.password: ${LINK_DB_PASS}
      spring.kafka.properties.sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_CLIENT_USER}" password="${KAFKA_SASL_CLIENT_PASSWORD}";
      internal-blob-storage.connection-string: ${AZURITE_CONNECTION_STRING}
      internal-blob-storage.blob-container-name: ${INTERNAL_BLOB_CONTAINER_NAME}
      spring.data.redis.password: ${REDIS_PASS}
      authentication.signing-key: ${LOCAL_LINK_TOKEN_SIGNING_KEY:-local-dev-link-bearer-signing-key-2026-automation-adminbff-shared-secret-min-64-bytes}
      pre-qualification.write-pre-qual-operation-outcome: ${VALIDATION_WRITE_PREQUAL_OO:-false}
      pre-qualification.write-expressions-in-operation-outcome: ${VALIDATION_WRITE_OO_EXPRESSIONS:-true}
    ports:
      - "8075:8075"
    build:
      context: Java/
      dockerfile: validation/Dockerfile
    networks:
      - link-nw
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mssql_init:
        condition: service_completed_successfully
      redis_cache:
        condition: service_healthy
      report:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8075/health"]
      start_period: 15s
      interval: 5s
      retries: 10

  mock-fhir-server:
    image: mock-fhir-server
    container_name: mock-fhir-server
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      MockFhirServer__PreGeneratedPatientCount: 10
      MockFhirServer__ResourcesPerPatient: 10
      MockFhirServer__ClinicalPeriodStart: "2026-01-01"
      MockFhirServer__ClinicalPeriodEnd: "2026-01-31"
    ports:
      - "6158:8080"
    build:
      context: .
      dockerfile: DotNet/MockFhirServer/Dockerfile
      additional_contexts:
        thetis: ../thetis
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      start_period: 15s
      interval: 5s
      retries: 10

  mock-dmrp-api:
    image: mock-dmrp-api
    container_name: mock-dmrp-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      MockDmrpApi__Enabled: "true"
      MockDmrpApi__AuthClientId: ${MOCK_DMRP_CLIENT_ID:-link-cloud-dev}
      MockDmrpApi__AuthClientSecret: ${MOCK_DMRP_CLIENT_SECRET:-link-cloud-dev-secret}
      MockDmrpApi__SigningKey: ${MOCK_DMRP_SIGNING_KEY:-mock-dmrp-local-development-signing-key-not-for-any-deployed-environment}
      ConnectionStrings__DatabaseConnection: Server=tcp:mssql,1433;Initial Catalog=link-mock-dmrp;Persist Security Info=False;User ID=sa;Password=${LINK_DB_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
    ports:
      - "6159:8080"
    build:
      context: .
      dockerfile: DotNet/MockDmrpApi/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      # Unlike mock-fhir-server this has a database, and migration runs at startup against
      # a catalog create-dbs.sql has to create first.
      mssql_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      start_period: 15s
      interval: 5s
      retries: 10

  terminology:
    image: link-terminology
    container_name: link-terminology
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Terminology__Path: "/data"
      ServiceInformation__Name: Link Terminology
      Serilog__WriteTo__0__Args__uri: http://loki:3100
      Telemetry__EnableTelemetry: true
      Telemetry__EnableOtelCollector: true
      Telemetry__OtelCollectorEndpoint: http://otel-collector:4317
      EnableSwagger: true
      Authentication__EnableAnonymousAccess: true
    volumes:
      - terminology_data:/data
    ports:
      - "8076:8076"
    build:
      context: .
      dockerfile: DotNet/Terminology/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    networks:
      - link-nw
    depends_on:
      otel-collector:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8076/health"]

networks:
  link-nw:
     
volumes:
  kafka_data:
    driver: local
  mssql_data:
    driver: local
  redis_cache:
    driver: local
  mongo_data:
    driver: local
  submission_data:
    driver: local
  fhir_data:
    driver: local
  azurite_data:
    driver: local
  terminology_data:
    driver: local
  sftp_data:
    driver: local
  automation_ui_keys:
    driver: local
