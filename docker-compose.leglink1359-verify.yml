# Local verification override for LEGLINK-1359: proves the NHSN user's email reaches an audit event.
#
# The default Docker stack disables the whole token path at both ends, so without this nothing can be
# observed:
#   * the BFF's Authentication:AllowAnonymous is true, and LinkApiClientBase skips the token service
#     entirely when it is - no Authorization header is sent on any outbound call;
#   * Tenant's Authentication:EnableAnonymousAccess is true, so it never populates User and
#     AuditEventFactory.ResolveActor has nothing to read.
#
# Both ends must therefore be off and share one signing key. Values come from .env (gitignored); the
# key is the same one docker-compose.yml already defaults to for admin-bff and automation-ui, so those
# keep working while this is active. For local use only - never a deployed environment.
#
# Run:
#   docker compose -f docker-compose.yml -f docker-compose.leglink1359-verify.yml up -d \
#     tenant nhsn-app-bff admin-bff dataacq querydispatch census
# Revert:
#   docker compose up -d tenant nhsn-app-bff admin-bff dataacq querydispatch census
services:
  nhsn-app-bff:
    environment:
      # false = mint a token per outbound call, which is what carries the actor
      Authentication__AllowAnonymous: "false"
      # the issuer written into the minted token; must equal tenant's LinkBearer Authority below
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:?set LOCAL_LINK_TOKEN_AUTHORITY in .env}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:?set LOCAL_LINK_TOKEN_SIGNING_KEY in .env}
      # set deliberately: this is the address audit events carried BEFORE this story, so if the
      # forwarding ever regresses the events show this instead of the NHSN user - a visible failure
      # rather than an empty field.
      LinkTokenService__LinkAdminEmail: ${LOCAL_LINK_ADMIN_EMAIL:-linkadmin@lantanagroup.com}

  tenant:
    environment:
      # false = validate the bearer and populate User, which the audit filter reads. Tenant hosts
      # DMRP in-process, so this covers the reporting-plan and measure-mapping endpoints too.
      Authentication__EnableAnonymousAccess: "false"
      # MUST stay empty. BackendAuthenticationServiceExtension feeds this single value to BOTH
      # JwtBearerOptions.Authority and TokenValidationParameters.ValidIssuer, and hard-wires
      # RequireHttpsMetadata = !IsDevelopment() - which is true under ASPNETCORE_ENVIRONMENT=Docker.
      # Any non-empty value therefore triggers OIDC metadata discovery and every request 500s with
      # "The MetadataAddress or Authority must use HTTPS". Empty means no discovery is attempted.
      Authentication__Schemas__LinkBearer__Authority: ""
      # false because ValidIssuer is necessarily empty (above), and validating against an empty
      # issuer fails. The signature is still verified: IssuerSigningKeyResolver returns the shared
      # key below, so a token not signed with it is still rejected. Issuer and audience checks are
      # what is given up here - a limitation of running bearer auth locally, not of LEGLINK-1359.
      Authentication__Schemas__LinkBearer__ValidateToken: "false"
      # Tenant mints tokens of its own too (DMRP.CreateMeasureMapping validates the DQM against
      # MeasureEval). CreateSystemToken throws ArgumentNullException(Authority) when this is empty,
      # surfacing as a 500 from the audited endpoint. Note this is NOT the same key as the
      # LinkBearer Authority above: that one validates inbound and must stay empty, this one is the
      # issuer stamped on outbound tokens and must be set.
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:?set LOCAL_LINK_TOKEN_AUTHORITY in .env}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:?set LOCAL_LINK_TOKEN_SIGNING_KEY in .env}

  # Lets the Admin UI be used while tenant requires auth, which it otherwise cannot be. Admin.BFF is
  # a YARP reverse proxy, not an SDK caller: it forwards the caller's own Authorization header and
  # mints nothing. Anonymous Admin.BFF therefore forwards no header at all, and every proxied call
  # to tenant 401s - which is what the Admin UI shows the moment the tenant block above is active.
  #
  # Signing in is not the way out: there is no identity provider in this stack. /api/login challenges
  # DefaultChallengeScheme, which docker-compose.yml pins to link_cookie, whose LoginPath is
  # /api/login - a redirect loop; the oauth2, OpenID Connect and Jwt schemes all default to false;
  # and GET /api/auth/token mints a token only for a caller who is already authenticated. Turning
  # Authentication:EnableAnonymousAccess off here would just make Admin.BFF reject everything too.
  #
  # So the header is injected instead, with a YARP request transform on the three routes that reach
  # tenant. Those are the audited ones - Facility, Vendor and VendorVersion - and the token carries
  # an email claim, so events name admin-ui-local@hospital.example.org rather than nobody. Every
  # Admin UI change is attributed to that one address: this proves the wiring end to end, it does
  # NOT prove per-user attribution, which needs a real provider and a real sign-in.
  #
  # The token is minted with LOCAL_LINK_TOKEN_SIGNING_KEY and lives in .env, which is gitignored -
  # never inline it here, because this file is not.
  admin-bff:
    environment:
      ReverseProxy__Routes__route10__Transforms__0__RequestHeader: "Authorization"
      ReverseProxy__Routes__route10__Transforms__0__Set: "Bearer ${LOCAL_ADMIN_UI_AUDIT_TOKEN:?set LOCAL_ADMIN_UI_AUDIT_TOKEN in .env}"
      ReverseProxy__Routes__tenantVendor__Transforms__0__RequestHeader: "Authorization"
      ReverseProxy__Routes__tenantVendor__Transforms__0__Set: "Bearer ${LOCAL_ADMIN_UI_AUDIT_TOKEN:?set LOCAL_ADMIN_UI_AUDIT_TOKEN in .env}"
      ReverseProxy__Routes__tenantVendorVersion__Transforms__0__RequestHeader: "Authorization"
      ReverseProxy__Routes__tenantVendorVersion__Transforms__0__Set: "Bearer ${LOCAL_ADMIN_UI_AUDIT_TOKEN:?set LOCAL_ADMIN_UI_AUDIT_TOKEN in .env}"

  # The BFF writes four records when onboarding saves facility-info: the Tenant facility above,
  # and a query config, a dispatch config and a census config in these three. All four are audited,
  # and the BFF calls all four directly, so each one's token carries the actor email - but only if
  # the receiving service validates the bearer. Left anonymous they record user: null while Tenant
  # records the address, which reads as the forwarding being broken when it is not.
  #
  # Each flag below is the same shape as tenant's, for the same reasons given there, because these
  # services share one Program.cs pattern: EnableAnonymousAccess drives BOTH directions - inbound
  # validation AND whether the shared TenantApiService/SDK clients mint a token on the way out.
  # That second half is not optional here. DataAcquisition asks Tenant whether the facility exists
  # before it writes, so with Tenant requiring auth and DataAcquisition still anonymous that check
  # 401s, dataacq answers 500, and the BFF turns it into a 502 that fails onboarding at the census
  # step - which is exactly what happens if you enable the tenant block above on its own.
  dataacq:
    environment:
      Authentication__EnableAnonymousAccess: "false"
      Authentication__Schemas__LinkBearer__Authority: ""
      Authentication__Schemas__LinkBearer__ValidateToken: "false"
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:?set LOCAL_LINK_TOKEN_AUTHORITY in .env}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:?set LOCAL_LINK_TOKEN_SIGNING_KEY in .env}

  querydispatch:
    environment:
      Authentication__EnableAnonymousAccess: "false"
      Authentication__Schemas__LinkBearer__Authority: ""
      Authentication__Schemas__LinkBearer__ValidateToken: "false"
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:?set LOCAL_LINK_TOKEN_AUTHORITY in .env}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:?set LOCAL_LINK_TOKEN_SIGNING_KEY in .env}

  census:
    environment:
      Authentication__EnableAnonymousAccess: "false"
      Authentication__Schemas__LinkBearer__Authority: ""
      Authentication__Schemas__LinkBearer__ValidateToken: "false"
      LinkTokenService__Authority: ${LOCAL_LINK_TOKEN_AUTHORITY:?set LOCAL_LINK_TOKEN_AUTHORITY in .env}
      LinkTokenService__SigningKey: ${LOCAL_LINK_TOKEN_SIGNING_KEY:?set LOCAL_LINK_TOKEN_SIGNING_KEY in .env}
